<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N5 模擬考（正式版）</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  :root{
    --bg:#f7f5f0; --card:#ffffff; --ink:#2b2b2b; --sub:#6b6b6b;
    --accent:#c0392b; --accent2:#2e7d6b; --line:#e6e2d8;
    --jp:#1a3a5c; --shadow:0 1px 3px rgba(0,0,0,.07);
    --ok:#2e7d6b; --ng:#c0392b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Hiragino Sans","Noto Sans TC","Microsoft JhengHei",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.7;font-size:16px}
  .wrap{max-width:760px;margin:0 auto;padding:28px 20px 140px}
  h1{font-size:26px;margin:0 0 4px;color:var(--accent);letter-spacing:2px}
  .sub{color:var(--sub);font-size:14px;margin-bottom:22px}
  a{color:var(--jp)}
  button{font-family:inherit;font-size:15px;border:1px solid var(--line);background:#fff;
    color:var(--ink);border-radius:8px;padding:8px 16px;cursor:pointer}
  button:hover{background:#f0ece3}
  button:disabled{opacity:.45;cursor:default}
  .btn-primary{background:var(--jp);border-color:var(--jp);color:#fff;font-weight:700}
  .btn-primary:hover{background:#15304d}
  .btn-danger{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  .btn-danger:hover{background:#a33225}

  /* ── 選卷頁 ── */
  .paper{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
  .paper h2{margin:0 0 2px;font-size:20px;color:var(--jp)}
  .paper .meta{color:var(--sub);font-size:13px;margin-bottom:12px}
  .paper.off{opacity:.5}
  .hist{border-top:1px dashed var(--line);margin-top:12px;padding-top:10px;font-size:14px}
  .hist table{width:100%;border-collapse:collapse}
  .hist td{padding:4px 6px;border-bottom:1px solid #f0ece3}
  .hist td.d{color:var(--sub);font-size:13px;white-space:nowrap}
  .hist .pass{color:var(--ok);font-weight:700}
  .hist .fail{color:var(--ng);font-weight:700}
  .hist .void{color:var(--sub)}
  .hist .none{color:var(--sub);font-size:13px}
  .hist .clr{font-size:12px;padding:2px 10px;margin-left:8px;color:var(--sub)}
  .rule{background:#fffdf7;border:1px solid var(--line);border-left:4px solid var(--accent2);
    border-radius:0 8px 8px 0;padding:12px 16px;margin:18px 0;font-size:14px;color:#3a4750}
  .rule b{color:var(--jp)}
  .rule ul{margin:6px 0 0;padding-left:20px}

  /* ── 作答區 ── */
  .examtop{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0 8px;
    border-bottom:1px solid var(--line);margin-bottom:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .examtop .name{font-weight:700;color:var(--jp)}
  .clock{margin-left:auto;font-variant-numeric:tabular-nums;font-size:20px;font-weight:700;color:var(--jp)}
  .clock.warn{color:var(--accent)}
  .prog{margin-left:auto;font-size:14px;color:var(--sub)}
  .bar{height:6px;background:#e6e2d8;border-radius:3px;overflow:hidden;flex:1 1 100%;margin-top:4px}
  .bar i{display:block;height:100%;background:var(--accent2);width:0;transition:width .3s linear}

  .part{margin:26px 0 10px}
  .part h3{margin:0;font-size:17px;color:var(--accent);letter-spacing:1px}
  .part .instr{font-size:14px;color:var(--sub);margin-top:2px}
  .pass{background:#fffdf7;border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:12px 0;
    font-size:15px;line-height:2}
  .pass table.info{border-collapse:collapse;margin:8px 0;font-size:14px;width:100%}
  .pass table.info th,.pass table.info td{border:1px solid var(--line);padding:4px 8px;text-align:center}
  .q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;
    margin-bottom:12px;box-shadow:var(--shadow)}
  .q .no{display:inline-block;min-width:34px;font-weight:700;color:var(--accent);font-size:14px}
  .q .text{font-size:17px;line-height:1.9;margin-bottom:10px}
  .ul{text-decoration:underline;text-underline-offset:3px;font-weight:700;color:var(--jp)}
  .bk{display:inline-block;min-width:54px;border-bottom:1px solid var(--jp);text-align:center}
  .star{display:inline-block;min-width:54px;border-bottom:1px solid var(--accent);
    text-align:center;color:var(--accent);font-weight:700}
  .qimg{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px;
    margin:6px auto 10px;background:#fff}
  .scene img{display:block;max-width:300px;width:100%;height:auto;border:1px solid var(--line);
    border-radius:8px;margin:6px auto 10px;background:#fff}
  ol.ch{list-style:none;margin:0;padding:0;display:grid;gap:7px}
  ol.ch.row{grid-template-columns:repeat(4,1fr)}
  ol.ch.row3{grid-template-columns:repeat(3,1fr)}
  ol.ch li button{width:100%;text-align:left;display:flex;gap:8px;align-items:flex-start;line-height:1.6}
  ol.ch.row li button,ol.ch.row3 li button{justify-content:center}
  ol.ch .n{color:var(--sub);font-weight:700;flex:0 0 auto}
  ol.ch li button.sel{border-color:var(--jp);background:#eaf1f8;font-weight:700}
  ol.ch li button.ok{border-color:var(--ok);background:#eaf7f2}
  ol.ch li button.ng{border-color:var(--ng);background:#fdeeee}
  .exp{margin-top:10px;padding:10px 12px;background:#fbf9f4;border-left:3px solid var(--accent2);
    border-radius:0 6px 6px 0;font-size:14px;line-height:1.9;color:#3a4750}
  .exp b{color:var(--jp)}
  .zh{font-size:14px;color:#3a4750;margin-top:8px;padding:8px 12px;background:#f4f7f5;border-radius:6px}
  .playone{font-size:13px;padding:4px 10px;margin-top:8px}
  .q.exq{background:#fbf9f4;border-style:dashed}
  .q.exq .no{color:var(--accent2)}
  .extag{display:inline-block;font-size:12px;font-weight:700;color:var(--accent2);
    border:1px solid var(--accent2);border-radius:999px;padding:0 8px;margin-left:8px}
  .banner{background:#eaf1f8;border:1px solid var(--jp);border-radius:8px;padding:10px 14px;
    margin-bottom:14px;font-size:14px;color:var(--jp);font-weight:700}

  /* ── 休息 ── */
  .center{text-align:center;padding:60px 0}
  .big{font-size:52px;font-weight:700;color:var(--jp);font-variant-numeric:tabular-nums;letter-spacing:2px}

  /* ── 成績 ── */
  .score{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;
    box-shadow:var(--shadow);margin-bottom:16px}
  .score .total{font-size:34px;font-weight:700;color:var(--jp)}
  .score table{width:100%;border-collapse:collapse;margin-top:12px;font-size:15px}
  .score th,.score td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left}
  .score td.num{text-align:right;font-variant-numeric:tabular-nums}
  .judge{display:inline-block;padding:4px 14px;border-radius:999px;font-weight:700;margin-left:10px}
  .judge.y{background:#eaf7f2;color:var(--ok);border:1px solid var(--ok)}
  .judge.n{background:#fdeeee;color:var(--ng);border:1px solid var(--ng)}
  .foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
    padding:10px 16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;z-index:30}
  .note{font-size:13px;color:var(--sub)}
  @media(max-width:520px){
    .wrap{padding:20px 14px 150px}
    ol.ch.row{grid-template-columns:repeat(2,1fr)}
    .big{font-size:40px}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>N5 模擬考（正式版）</h1>
  <div class="sub" id="sub">比照正式考試的題數、時間與流程 · <a href="index.html">← 回首頁</a></div>

  <!-- ══ 選卷頁 ══ -->
  <div id="home"></div>

  <!-- ══ 作答 ══ -->
  <div id="exam" hidden>
    <div class="examtop">
      <span class="name" id="secname"></span>
      <span id="secmeta" class="note"></span>
      <span class="clock" id="clock"></span>
      <span class="prog" id="prog"></span>
      <span class="bar" id="barwrap" hidden><i id="bar"></i></span>
    </div>
    <div id="qbody"></div>
  </div>

  <!-- ══ 休息 ══ -->
  <div id="brk" hidden>
    <div class="center">
      <div class="note" id="brknext"></div>
      <div class="big" id="brkclock">20:00</div>
      <p class="note">正式考試兩科之間會休息（含收發考卷）。不想等可以直接跳過。</p>
      <button class="btn-primary" id="brkskip">跳過休息，直接開始</button>
    </div>
  </div>

  <!-- ══ 成績 ══ -->
  <div id="result" hidden></div>

  <!-- ══ 檢討 ══ -->
  <div id="review" hidden></div>
</div>

<div class="foot" id="foot" hidden></div>

<script id="paper-A" type="application/json">{"id":"A","name":"A 卷","pass":{"total":80,"a":38,"b":19},"sections":[{"key":"moji","label":"言語知識（文字・語彙）","min":20,"parts":[{"no":1,"title":"問題1","instr":"＿＿の ことばは ひらがなで どう 書きますか。1・2・3・4から いちばん いい ものを 一つ えらんで ください。","items":[{"q":"<span class=\"ul\">姉</span>は いしゃです。","c":["あね","あに","いもうと","おとうと"],"a":0,"e":"姉＝あね，指自己的姊姊。<br>其他選項：あに＝兄（哥哥）、いもうと＝妹（妹妹）、おとうと＝弟（弟弟）。<br><b>容易選錯的地方</b>：「姉」和「妹」都是女生、「姉」和「兄」都是年長的，四個字常被混在一起記。訣竅是先記「上面的是 あね・あに、下面的是 いもうと・おとうと」。講別人的姊姊要用 お姉さん。"},{"q":"じゅぎょうは <span class=\"ul\">午後</span> 一時からです。","c":["ごぜん","ごご","ごこ","こご"],"a":1,"e":"午後＝ごご（下午）。<br>其他選項：ごぜん＝午前（上午）、ごこ・こご 不是詞。<br><b>容易選錯的地方</b>：午前／午後 只差一個字，意思卻相反；「午」單獨唸 ご，不要受到「牛（うし）」的字形影響。"},{"q":"ゆうびんきょくは <span class=\"ul\">左</span>に あります。","c":["みぎ","さ","ひだり","ちだり"],"a":2,"e":"左＝ひだり。<br>其他選項：みぎ＝右（相反方向）、さ 是音讀（左右＝さゆう 才會這樣唸）、ちだり 不是詞。<br><b>容易選錯的地方</b>：左右兩個字形很像，記法是「左」裡面有「工」、「右」裡面有「口」。"},{"q":"<span class=\"ul\">十日</span>に 国へ 帰ります。","c":["じゅうにち","とうか","じゅうか","とおか"],"a":3,"e":"十日＝とおか（十號／十天）。<br>其他選項：じゅうにち・じゅうか・とうか 都不是正確唸法。<br><b>容易選錯的地方</b>：一號到十號的唸法全部是特殊的 —— ついたち、ふつか、みっか、よっか、いつか、むいか、なのか、ようか、ここのか、とおか，只能整組背。十四日（じゅうよっか）、二十日（はつか）也是特例。"},{"q":"けさから <span class=\"ul\">雨</span>が ふって います。","c":["あめ","あま","う","ゆき"],"a":0,"e":"雨＝あめ。<br>其他選項：ゆき＝雪、う 是音讀（雨天＝うてん）、あま 只出現在 雨水（あまみず）這種複合詞裡。<br><b>容易選錯的地方</b>：「あめ」還有「飴（糖果）」的意思，兩個同音不同漢字，看漢字判斷就不會錯。"},{"q":"まいばん 七時に ばんごはんを <span class=\"ul\">食べます</span>。","c":["しょくべます","たべます","たばます","のべます"],"a":1,"e":"食べます＝たべます。<br>其他選項：しょく 是音讀（食堂＝しょくどう）、たばます・のべます 不是詞。<br><b>容易選錯的地方</b>：同一個「食」字，單獨當動詞唸訓讀 た，放進詞裡唸音讀 しょく（食事・食堂）。"},{"q":"友だちが うちへ <span class=\"ul\">来ます</span>。","c":["らいます","くます","きます","いきます"],"a":2,"e":"来ます＝きます（來）。<br>其他選項：いきます＝行きます（去，方向相反）、らい 是音讀（来月＝らいげつ）、くます 不是詞。<br><b>容易選錯的地方</b>：来ます 是不規則動詞，ます形唸 き、辭書形唸 くる、否定唸 こない，三種唸法都不一樣，要整組記。"}]},{"no":2,"title":"問題2","instr":"＿＿の ことばは どう 書きますか。1・2・3・4から いちばん いい ものを 一つ えらんで ください。","items":[{"q":"きのう <span class=\"ul\">ともだち</span>と 会いました。","c":["友連","方達","有達","友達"],"a":3,"e":"友達（ともだち）＝朋友。<br>其他選項：友連・方達・有達 都不是詞，是把字形相近的字湊出來的。<br><b>容易選錯的地方</b>：「友」和「有」、「達」和「連」字形都很像，先記「友」是朋友的友就不會挑錯。"},{"q":"その <span class=\"ul\">ほん</span>を 見せて ください。","c":["本","木","体","休"],"a":0,"e":"本（ほん）＝書。<br>其他選項：木＝き（樹）、体＝からだ（身體）、休＝やすみ（休息）。<br><b>容易選錯的地方</b>：「本」就是「木」多一橫，「休」是人字旁加木，四個字都繞著「木」打轉。"},{"q":"<span class=\"ul\">あたま</span>が いたいです。","c":["顔","頭","首","耳"],"a":1,"e":"頭（あたま）＝頭。<br>其他選項：顔＝かお（臉）、首＝くび（脖子）、耳＝みみ（耳朵）。<br><b>容易選錯的地方</b>：身體部位的漢字常一起出現，記住「頭」右邊是「頁」這個部首（和頭、顔 同類）。"},{"q":"大きい こえで <span class=\"ul\">くち</span>を あけて ください。","c":["日","目","口","田"],"a":2,"e":"口（くち）＝嘴巴。<br>其他選項：日＝ひ（太陽、日子）、目＝め（眼睛）、田＝た（田）。<br><b>容易選錯的地方</b>：這四個字都是方框，差別只在裡面有沒有橫線、幾條橫線 —— 口沒有、日一條、目兩條。"},{"q":"なつやすみに <span class=\"ul\">うみ</span>へ 行きます。","c":["湖","池","洋","海"],"a":3,"e":"海（うみ）＝海。<br>其他選項：湖＝みずうみ（湖）、池＝いけ（池塘）、洋＝よう（洋，如 西洋）。<br><b>容易選錯的地方</b>：四個都是三點水，「海」的右邊是「毎」，和 毎日 的毎同一個部件，可以一起記。"}]},{"no":3,"title":"問題3","instr":"（　）に 何を 入れますか。1・2・3・4から いちばん いい ものを 一つ えらんで ください。","items":[{"q":"あついですから、エアコンを <span class=\"bk\">　　</span>。","c":["つけます","けします","あけます","しめます"],"a":0,"e":"電器要「打開」用 つけます。<br>其他選項：けします＝關掉（電器）、あけます＝打開（門窗）、しめます＝關（門窗）。<br><b>容易選錯的地方</b>：中文都說「開」，日文卻分成兩組 —— <b>電器</b>用 つける／けす、<b>門窗</b>用 あける／しめる。"},{"q":"きってを はって、てがみを <span class=\"bk\">　　</span>。","c":["入れます","出します","あけます","もらいます"],"a":1,"e":"信要「寄出」用 出します。<br>其他選項：入れます＝放進去、あけます＝打開、もらいます＝收到（方向相反）。<br><b>容易選錯的地方</b>：「ポストに 入れます」（投進郵筒）也說得通，但整句是「貼了郵票之後」，指的是寄出這個動作，所以 出します 才完整。"},{"q":"おふろに <span class=\"bk\">　　</span>から、ねます。","c":["出て","のって","入って","あがって"],"a":2,"e":"泡澡是「おふろに 入ります」。<br>其他選項：出て＝出來、のって＝搭乘、あがって＝上去。<br><b>容易選錯的地方</b>：おふろ 要配 に＋入る，不是 を；「おふろを 出ます」才是洗完出來。"},{"q":"この じしょは <span class=\"bk\">　　</span>ですから、よく つかいます。","c":["ゆうめい","しずか","げんき","べんり"],"a":3,"e":"字典好用＝べんり（方便）。<br>其他選項：ゆうめい＝有名、しずか＝安靜、げんき＝有精神，都不能拿來形容字典好不好用。<br><b>容易選錯的地方</b>：四個都是な形容詞，光看詞性分不出來，要看前面的名詞「じしょ」和後面的「よく つかいます」。"},{"q":"たんじょうびに 友だちから プレゼントを <span class=\"bk\">　　</span>。","c":["もらいました","あげました","かしました","おくりました"],"a":0,"e":"「友だちから」＝從朋友那裡，所以是收到 → もらいました。<br>其他選項：あげました＝給出去、かしました＝借出、おくりました＝寄送，方向都相反。<br><b>容易選錯的地方</b>：看助詞判斷方向 —— <b>から／に＋もらう</b>是進來、<b>に＋あげる</b>是出去。"},{"q":"きょうは しごとが <span class=\"bk\">　　</span>ですから、早く 帰ります。","c":["いそがしい","ひま","たいへん","だいじ"],"a":1,"e":"沒事做＝ひま，才能早點回家。<br>其他選項：いそがしい＝忙（那就不能早回家）、たいへん＝辛苦、だいじ＝重要。<br><b>容易選錯的地方</b>：ひま 是な形容詞、いそがしい 是い形容詞，後面都接 ですから，從詞形看不出來，要靠「早く 帰ります」這個結果反推。"}]},{"no":4,"title":"問題4","instr":"＿＿の ぶんと だいたい 同じ いみの ぶんが あります。1・2・3・4から いちばん いい ものを 一つ えらんで ください。","items":[{"q":"きょうは 学校を <span class=\"ul\">休みました</span>。","c":["きょうは 学校で べんきょうしました。","きょうは 学校が ありました。","きょうは 学校へ 行きませんでした。","きょうは 学校まで あるきました。"],"a":2,"e":"「学校を 休みます」＝請假不去學校＝学校へ 行きませんでした。<br>其他選項：2 在學校唸書、3 有課、4 走路到學校，都代表人有去，意思相反。<br><b>容易選錯的地方</b>：「休みます」看起來像「休息」，但接在「学校を」後面是<b>缺席</b>的意思，助詞用 を。"},{"q":"ここは <span class=\"ul\">でぐち</span>です。","c":["ここから 中へ 入ります。","ここで きっぷを 買います。","ここで 電車を まちます。","ここから 外へ 出ます。"],"a":3,"e":"出口＝從這裡出去。<br>其他選項：2 是入口（いりぐち）、3 是售票處、4 是月台，都不是出口。<br><b>容易選錯的地方</b>：出口／入口 的漢字只差一個字，「出」是往外、「入」是往內，可以配合動詞 出ます／入ります 一起記。"},{"q":"きのうは <span class=\"ul\">あめ</span>でした。","c":["きのう あめが ふりました。","きのう あめが ふりませんでした。","きのうは いい 天気でした。","きのう ゆきが ふりました。"],"a":0,"e":"「あめでした」＝那天是雨天＝下了雨。<br>其他選項：2 是沒下雨（否定）、3 是好天氣（相反）、4 下的是雪不是雨。<br><b>容易選錯的地方</b>：名詞句「〜でした」和動詞句「〜が ふりました」講的是同一件事，考的就是會不會把兩種說法對起來。"}]}],"n":21},{"key":"bunpou","label":"言語知識（文法）・読解","min":40,"parts":[{"no":1,"title":"問題1","instr":"（　）に 何を 入れますか。1・2・3・4から いちばん いい ものを 一つ えらんで ください。","items":[{"q":"この かばんは 五千円<span class=\"bk\">　　</span> 買いました。","c":["に","で","を","が"],"a":1,"e":"花多少錢買的，金額用 <b>で</b>（表示手段・範圍）。<br>其他選項：に 是時間或到達點、を 是受詞（かばんを 買いました）、が 是主語。<br><b>同類對照</b>：「二人で 行きます」（以兩個人的狀態）、「百円で 買えます」（用一百圓就買得到），都是同一個「範圍・手段」的 で。"},{"q":"田中さんは きょう 学校<span class=\"bk\">　　</span> 休みました。","c":["に","で","を","へ"],"a":2,"e":"「〜を 休みます」是固定用法，請假缺席的對象用 を。<br>其他選項：に 是時間（一時に）、で 是場所（学校で べんきょうします）、へ 是方向（学校へ 行きます）。<br><b>同類對照</b>：同樣用 を 但不是受詞的還有「公園を 散歩します」「電車を おります」。"},{"q":"あしたは 雨が ふります<span class=\"bk\">　　</span>、かさを 持って 行きます。","c":["が","まで","でも","から"],"a":3,"e":"前面是理由、後面是結果 → <b>から</b>（因為…所以…）。<br>其他選項：が＝但是（前後要相反）、まで＝到…為止、でも＝但是（放句首）。<br><b>同類對照</b>：から 放在<b>理由</b>後面，ので 也是理由但語氣客氣；が 和 でも 都是轉折，這句前後不矛盾所以不能用。"},{"q":"この もんだいは かんたん<span class=\"bk\">　　</span>、すぐ できました。","c":["で","くて","だから","なので"],"a":0,"e":"な形容詞要接下一句時用 <b>で</b>：かんたんで、すぐ できました。<br>其他選項：くて 是<b>い形容詞</b>的接法（やすくて おいしい）、だから・なので 是普通形的用法，不能直接接在「かんたん」後面當連接。<br><b>同類對照</b>：い形容詞 → 〜くて（おいしくて）、な形容詞・名詞 → 〜で（しずかで／学生で）。"},{"q":"林さんは 日本語<span class=\"bk\">　　</span> 上手です。","c":["を","が","に","で"],"a":1,"e":"「〜が 上手です／下手です／好きです／きらいです」的對象一律用 <b>が</b>。<br>其他選項：を 用在動詞的受詞，但 上手 是形容詞不是動詞；に 是對象或時間；で 是手段。<br><b>同類對照</b>：同一組還有「〜が わかります」「〜が できます」「〜が ほしいです」，中文都會講成「把／對」，日文卻一律是 が。"},{"q":"まだ 子どもですから、おさけを 飲む こと<span class=\"bk\">　　</span> できません。","c":["を","に","が","は"],"a":2,"e":"「辭書形＋ことが できます」是固定句型，中間一定是 <b>が</b>。<br>其他選項：を 是受詞（おさけを 飲む 那一段已經用過了）、に 是對象、は 是主題。<br><b>同類對照</b>：「ことが できます」＝能力或許可，和 ⑤ 的「〜が 上手です」一樣，能力相關的句型都站在 が 這一邊。"},{"q":"この 車は 父<span class=\"bk\">　　</span> もらいました。","c":["を","が","で","に"],"a":3,"e":"もらいます 的「給的人」用 <b>に</b>（也可以用 から）。<br>其他選項：を 是收到的東西（車を）、が 是主語、で 是手段。<br><b>同類對照</b>：あげます 的對象也是 に，但方向相反（東西從我這裡出去）；對方是公司、學校這種團體時 もらう 只能用 から。"},{"q":"わたしは 朝ごはんを 食べない<span class=\"bk\">　　</span>、会社へ 行きました。","c":["で","くて","ので","から"],"a":0,"e":"「ない形＋で」＝沒有做…就…。食べないで 行きました＝沒吃早餐就去上班。<br>其他選項：くて 是い形容詞的接法；ので・から 是理由，接在 ない 後面會變成「因為不吃所以去公司」，意思不通。<br><b>同類對照</b>：なくて 也接得上，但那是<b>原因</b>（食べなくて、おなかが すきました＝因為沒吃所以餓），這句講的是<b>狀態</b>，所以用 ないで。"},{"q":"この へやは とても しずかです<span class=\"bk\">　　</span>、すこし せまいです。","c":["から","が","ので","そして"],"a":1,"e":"安靜是優點、狹小是缺點，前後相反 → <b>が</b>（但是）。<br>其他選項：から・ので 是理由（安靜不是狹小的原因）、そして 是順著接下去，要放句首而且前後不能矛盾。<br><b>同類對照</b>：が 接在<b>句尾</b>；放句首的轉折是 でも／しかし。"}]},{"no":2,"title":"問題2","instr":"★に 入る ものは どれですか。1・2・3・4から いちばん いい ものを 一つ えらんで ください。","items":[{"q":"田中さんは <span class=\"bk\">　　</span> <span class=\"bk\">　　</span> <span class=\"star\">★</span> <span class=\"bk\">　　</span> です。","c":["せが","高くて","かみが","ながい"],"a":2,"e":"正しい順序：田中さんは <b>せが 高くて かみが ながい</b>です。＝田中先生個子高、頭髮長。<br>い形容詞要接下一句用て形（高い → 高くて）；兩個特徵各自有自己的主語，所以用兩個 が。<br>★的位置是第三格，答案是「かみが」。"},{"q":"わたしは <span class=\"bk\">　　</span> <span class=\"bk\">　　</span> <span class=\"star\">★</span> <span class=\"bk\">　　</span> ことが あります。","c":["いちど","日本で","すしを","食べた"],"a":2,"e":"正しい順序：わたしは <b>いちど 日本で すしを 食べた</b> ことが あります。＝我在日本吃過一次壽司。<br>「た形＋ことが あります」＝有過…的經驗，所以最後一格一定是 食べた。次數（いちど）放最前面、場所（日本で）在受詞（すしを）前面。<br>★的位置是第三格，答案是「すしを」。"},{"q":"すみません、<span class=\"bk\">　　</span> <span class=\"bk\">　　</span> <span class=\"star\">★</span> <span class=\"bk\">　　</span> ください。","c":["もう","すこし","ゆっくり","話して"],"a":2,"e":"正しい順序：すみません、<b>もう すこし ゆっくり 話して</b> ください。＝不好意思，請再說慢一點。<br>「もう すこし」是一組（再一點點），後面接副詞 ゆっくり，最後是「て形＋ください」。<br>★的位置是第三格，答案是「ゆっくり」。"},{"q":"きょうは <span class=\"bk\">　　</span> <span class=\"bk\">　　</span> <span class=\"star\">★</span> <span class=\"bk\">　　</span> 帰ります。","c":["しごとが","ありませんから","早く","うちへ"],"a":2,"e":"正しい順序：きょうは <b>しごとが ありませんから 早く うちへ</b> 帰ります。＝今天沒工作，所以早點回家。<br>から 前面是理由，後面是結果；結果的部分依序是 副詞（早く）→ 方向（うちへ）→ 動詞。<br>★的位置是第三格，答案是「早く」。"}]},{"no":3,"title":"問題3","instr":"つぎの 文章を 読んで、【　】に 入る ものを1・2・3・4から 一つ えらんで ください。","items":[{"pass":"わたしは 先月 日本へ 来ました。いまは 大学の 近くの アパートに 【1】 います。<br>へやは あまり 広く ありませんが、まどから 山が 見えて、あさは 鳥の こえが 聞こえます。<br>まいあさ 六時に おきて、近くの こうえんを さんぽ 【2】 から、大学へ 行きます。じゅぎょうは 九時からですが、わたしは いつも 八時半ごろ 教室に つきます。<br>日本語の べんきょうは やさしく ありません。かんじも たくさん おぼえなければ なりません。【3】、先生も クラスの 友だちも しんせつですから、まいにち 楽しいです。<br>来月は 友だちと いっしょに 京都へ 行きます。京都は はじめてですから、いまから とても 行き【4】です。","passZh":"我上個月來到日本。現在住在大學附近的公寓。房間不太寬敞，但從窗戶看得到山，早上聽得到鳥叫聲。每天早上六點起床，在附近的公園散步之後去大學。課是九點開始，但我總是八點半左右就到教室。日文不好學，漢字也得背很多。不過老師和班上的朋友都很親切，所以每天都很開心。下個月要和朋友一起去京都。京都我是第一次去，所以現在就非常想去。（【1】＝すんで、【2】＝して、【3】＝でも、【4】＝たい）","q":"【1】","c":["すみ","すむ","すんで","すんだ"],"a":2,"e":"「〜て います」表示<b>持續的狀態</b>（住在某處），前面一定接て形：すむ → すんで。<br>其他選項：すみ 是ます形的語幹、すむ 是辭書形、すんだ 是た形，都接不上 います。<br><b>答案在哪一句</b>：第一段「アパートに 【1】 います」—— 看到 います 就知道要て形。"},{"pass":"わたしは 先月 日本へ 来ました。いまは 大学の 近くの アパートに 【1】 います。<br>へやは あまり 広く ありませんが、まどから 山が 見えて、あさは 鳥の こえが 聞こえます。<br>まいあさ 六時に おきて、近くの こうえんを さんぽ 【2】 から、大学へ 行きます。じゅぎょうは 九時からですが、わたしは いつも 八時半ごろ 教室に つきます。<br>日本語の べんきょうは やさしく ありません。かんじも たくさん おぼえなければ なりません。【3】、先生も クラスの 友だちも しんせつですから、まいにち 楽しいです。<br>来月は 友だちと いっしょに 京都へ 行きます。京都は はじめてですから、いまから とても 行き【4】です。","passZh":"我上個月來到日本。現在住在大學附近的公寓。房間不太寬敞，但從窗戶看得到山，早上聽得到鳥叫聲。每天早上六點起床，在附近的公園散步之後去大學。課是九點開始，但我總是八點半左右就到教室。日文不好學，漢字也得背很多。不過老師和班上的朋友都很親切，所以每天都很開心。下個月要和朋友一起去京都。京都我是第一次去，所以現在就非常想去。（【1】＝すんで、【2】＝して、【3】＝でも、【4】＝たい）","q":"【2】","c":["し","する","した","して"],"a":3,"e":"「〜て から」＝做完…之後，前面接<b>て形</b>。さんぽする → さんぽして。<br>其他選項：し・する・した 都接不上 から（「〜てから」是固定組合）。<br><b>容易搞混的</b>：「〜から」接在<b>句尾</b>是理由（九時からですが 的 から 又是另一回事 ——那是「從…開始」）。同一個 から 有三種用法，靠前面接什麼分辨。"},{"pass":"わたしは 先月 日本へ 来ました。いまは 大学の 近くの アパートに 【1】 います。<br>へやは あまり 広く ありませんが、まどから 山が 見えて、あさは 鳥の こえが 聞こえます。<br>まいあさ 六時に おきて、近くの こうえんを さんぽ 【2】 から、大学へ 行きます。じゅぎょうは 九時からですが、わたしは いつも 八時半ごろ 教室に つきます。<br>日本語の べんきょうは やさしく ありません。かんじも たくさん おぼえなければ なりません。【3】、先生も クラスの 友だちも しんせつですから、まいにち 楽しいです。<br>来月は 友だちと いっしょに 京都へ 行きます。京都は はじめてですから、いまから とても 行き【4】です。","passZh":"我上個月來到日本。現在住在大學附近的公寓。房間不太寬敞，但從窗戶看得到山，早上聽得到鳥叫聲。每天早上六點起床，在附近的公園散步之後去大學。課是九點開始，但我總是八點半左右就到教室。日文不好學，漢字也得背很多。不過老師和班上的朋友都很親切，所以每天都很開心。下個月要和朋友一起去京都。京都我是第一次去，所以現在就非常想去。（【1】＝すんで、【2】＝して、【3】＝でも、【4】＝たい）","q":"【3】","c":["でも","そして","だから","それから"],"a":0,"e":"前面說「日文不好學、漢字要背很多」，後面說「每天很開心」，<b>前後相反</b> → でも。<br>其他選項：そして・それから 是順著接下去、だから 是因果（不好學 ≠ 很開心的原因）。<br><b>答案在哪一句</b>：第三段。判斷關鍵是前一句是負面、後一句是正面。"},{"pass":"わたしは 先月 日本へ 来ました。いまは 大学の 近くの アパートに 【1】 います。<br>へやは あまり 広く ありませんが、まどから 山が 見えて、あさは 鳥の こえが 聞こえます。<br>まいあさ 六時に おきて、近くの こうえんを さんぽ 【2】 から、大学へ 行きます。じゅぎょうは 九時からですが、わたしは いつも 八時半ごろ 教室に つきます。<br>日本語の べんきょうは やさしく ありません。かんじも たくさん おぼえなければ なりません。【3】、先生も クラスの 友だちも しんせつですから、まいにち 楽しいです。<br>来月は 友だちと いっしょに 京都へ 行きます。京都は はじめてですから、いまから とても 行き【4】です。","passZh":"我上個月來到日本。現在住在大學附近的公寓。房間不太寬敞，但從窗戶看得到山，早上聽得到鳥叫聲。每天早上六點起床，在附近的公園散步之後去大學。課是九點開始，但我總是八點半左右就到教室。日文不好學，漢字也得背很多。不過老師和班上的朋友都很親切，所以每天都很開心。下個月要和朋友一起去京都。京都我是第一次去，所以現在就非常想去。（【1】＝すんで、【2】＝して、【3】＝でも、【4】＝たい）","q":"【4】","c":["たいで","たい","ほしい","ましょう"],"a":1,"e":"「ます形＋たいです」＝想做…。行きます → 行きたいです。<br>其他選項：たいで 形態不對；ほしい 要接名詞（京都が ほしい 意思完全不同）；ましょう 是邀約，主語不能是「わたし一個人的心情」。<br><b>答案在哪一句</b>：最後一句「いまから とても 行き【4】です」。"}]},{"no":4,"title":"問題4","instr":"つぎの 文を 読んで、しつもんに こたえて ください。こたえは 1・2・3・4から いちばん いい ものを 一つ えらんで ください。","items":[{"pass":"（会社の つくえの 上に メモが あります）<br>「山田さん<br>　きょうの 会議は 中止に なりました。<br>　来週の 月よう日の 同じ 時間に します。<br>　しりょうは そのままで いいです。　　田中」","passZh":"（公司桌上有一張便條）「山田先生：今天的會議取消了。改到下週一的同一時間。資料維持原樣就可以了。 田中」","q":"山田さんは きょう 何を しますか。","c":["会議に 出ます。","しりょうを 作りなおします。","会議には 出ません。","田中さんに 電話します。"],"a":2,"e":"「中止に なりました」＝取消了，所以今天沒有會議。<br>其他選項：2 和取消矛盾；3 便條說「そのままで いい」＝不用改；4 便條沒有要他回電。<br><b>答案在哪一句</b>：第二行「きょうの 会議は 中止に なりました」。"},{"pass":"わたしは コーヒーが 好きです。でも、よる 飲むと ねむれません。<br>ですから、よるは お茶を 飲みます。お茶の 中でも、あまり つよく ない ものを えらびます。","passZh":"我喜歡咖啡。不過晚上喝了會睡不著。所以晚上我喝茶。茶裡面也會挑不太濃的。","q":"この 人は よる 何を 飲みますか。","c":["コーヒー","つよい お茶","何も 飲みません","あまり つよく ない お茶"],"a":3,"e":"最後兩句：晚上喝茶，而且挑不濃的。<br>其他選項：2 咖啡晚上喝了會睡不著（被否定）、3 和「つよく ない」相反、4 文章沒說不喝。<br><b>答案在哪一句</b>：第三、四句「よるは お茶を 飲みます」「あまり つよく ない ものを えらびます」。"}]},{"no":5,"title":"問題5","instr":"つぎの 文章を 読んで、しつもんに こたえて ください。こたえは 1・2・3・4から いちばん いい ものを 一つ えらんで ください。","items":[{"pass":"わたしは 先月 この 町に ひっこして きました。<br>まえに すんで いた 町は えきが 近くて、買いものも べんりでしたが、いつも 人が 多くて、休みの 日も しずかに 休む ことが できませんでした。<br>いまの 町は えきまで 歩いて 二十分 かかります。大きい 店も 近くに ありませんから、買いものは 週に 一回、車で 行きます。<br>でも、まわりに 山が 見えて、空気が とても きれいです。あさ 早く おきて、まどを あけると、鳥の こえが 聞こえます。よるは くらいですが、星が たくさん 見えます。<br>ふべんな ことも ありますが、わたしは この 町が 好きに なりました。来年は この 町で 小さい 店を はじめたいと 思って います。","passZh":"我上個月搬到這個城鎮。之前住的城鎮車站很近、買東西也方便，但人總是很多，連假日都沒辦法安靜地休息。現在的城鎮走到車站要二十分鐘，附近也沒有大店，所以買東西是一週一次開車去。不過周圍看得到山，空氣非常乾淨。早上早起打開窗戶，聽得到鳥叫聲。晚上雖然很暗，卻看得到很多星星。雖然有不方便的地方，我卻喜歡上了這個城鎮。明年想在這個城鎮開一家小店。","q":"まえの 町は どんな 町でしたか。","c":["べんりでしたが、人が 多かったです。","ふべんで、人も 少なかったです。","えきから とおくて、しずかでした。","山が 見えて、空気が きれいでした。"],"a":0,"e":"第二段：車站近、買東西方便，但人多到假日都沒辦法好好休息。<br>其他選項：2・3 講的是現在的城鎮（店少、離車站遠）、4 也是現在城鎮的優點。<br><b>答案在哪一句</b>：第二段整段，關鍵是「べんりでしたが、いつも 人が 多くて」這個轉折。"},{"pass":"わたしは 先月 この 町に ひっこして きました。<br>まえに すんで いた 町は えきが 近くて、買いものも べんりでしたが、いつも 人が 多くて、休みの 日も しずかに 休む ことが できませんでした。<br>いまの 町は えきまで 歩いて 二十分 かかります。大きい 店も 近くに ありませんから、買いものは 週に 一回、車で 行きます。<br>でも、まわりに 山が 見えて、空気が とても きれいです。あさ 早く おきて、まどを あけると、鳥の こえが 聞こえます。よるは くらいですが、星が たくさん 見えます。<br>ふべんな ことも ありますが、わたしは この 町が 好きに なりました。来年は この 町 ,{"p":5},{"r":"M","t":"あした、えいがを 見に 行きませんか。"},{"r":"F","t":"すみません、あしたは うちの そうじを します。"},{"r":"N","t":"女の人は あした 何を しますか。"},{"r":"N","t":"いちばん いい ものは 1ばんです。"}],"img":"img/mock/l2-08.png"},"items":[{"n":1,"play":[{"r":"N","t":"1ばん。"},{"r":"N","t":"女の人は この あと どこへ 行きますか。"},{"p":5},{"r":"F","t":"もしもし、田中さん。今 バスていの 前に いますが、バスが なかなか 来ません。"},{"r":"M","t":"そうですか。この 時間は バスが 少ないんですよ。"},{"r":"F","t":"そうなんですか。じゃ、どう しましょうか。"},{"r":"M","t":"えきの 前まで 歩いて 来て ください。わたしは そこで まって いますから。"},{"r":"F","t":"わかりました。十分ぐらいで 行きます。"},{"r":"N","t":"女の人は この あと どこへ 行きますか。"}],"q":"女の人は この あと どこへ 行きますか。","a":1,"gap":10,"zh":"女：喂，田中先生。我現在在公車站牌前，可是公車一直不來。／男：這樣啊，這個時間公車很少喔。／女：原來如此。那我該怎麼辦？／男：你走到車站前面來吧，我在那裡等你。／女：知道了，大概十分鐘過去。","e":"<b>關鍵句</b>：「<b>えきの 前まで 歩いて 来て ください</b>」＝叫她走到車站前面。<br>→ 正解は 2 の 絵（えきの 前）。<br>其他選項：1 的辦公大樓前沒出現；<b>3 的公車站牌是她「現在」的位置</b>，問的是「この あと」要去哪裡，這是最常見的陷阱；4 的家裡沒提到。","img":"img/mock/l1-10.png","c":["1","2","3","4"]},{"n":2,"play":[{"r":"N","t":"2ばん。"},{"r":"N","t":"男の人は これから 何を しますか。"},{"p":5},{"r":"F","t":"山田さん、きのう おねがいした しりょう、コピーは もう しましたか。"},{"r":"M","t":"はい、けさ しました。つくえの 上に おいて あります。"},{"r":"F","t":"ありがとう ございます。じゃ、三時から 会議室で せつめいを おねがいできますか。"},{"r":"M","t":"はい、だいじょうぶです。じゅんびして おきます。"},{"r":"F","t":"おねがいします。"},{"r":"N","t":"男の人は これから 何を しますか。"}],"q":"男の人は これから 何を しますか。","a":2,"gap":10,"zh":"女：山田先生，昨天拜託你的資料影印好了嗎？／男：是的，今天早上印好了，放在桌上。／女：謝謝。那三點開始可以麻煩你在會議室說明嗎？／男：好的，沒問題，我會先準備。／女：麻煩你了。","e":"<b>關鍵句</b>：「<b>三時から 会議室で せつめいを おねがいできますか</b>」＋「はい、だいじょうぶです」。<br>→ 正解は 3 の 絵（会議）。<br>其他選項：<b>1 的影印已經「けさ しました」＝做完了</b>，不是接下來的動作；2 看文件、4 寫文件對話都沒提到。","img":"img/mock/l1-11.png","c":["1","2","3","4"]},{"n":3,"play":[{"r":"N","t":"3ばん。"},{"r":"N","t":"女の人は まず 何を しますか。"},{"p":5},{"r":"M","t":"すみません、にもつが 届きましたよ。"},{"r":"F","t":"あ、ありがとう ございます。どこに おきましょうか。"},{"r":"M","t":"そこで いいですよ。あ、サインの まえに、中を かくにんして ください。"},{"r":"F","t":"わかりました。じゃ、あけて みますね。"},{"r":"M","t":"おねがいします。"},{"r":"N","t":"女の人は まず 何を しますか。"}],"q":"女の人は まず 何を しますか。","a":0,"gap":10,"zh":"男：不好意思，行李送到了喔。／女：啊，謝謝。要放哪裡？／男：放那裡就好。啊，簽名之前請先確認裡面。／女：知道了，那我打開看看。／男：麻煩了。","e":"<b>關鍵句</b>：「<b>サインの まえに、中を かくにんして ください</b>」＝先確認裡面。<br>→ 正解は 1 の 絵（はこを あける）。<br>其他選項：2 的櫃台付錢沒提到；3 看書沒提到；4 寄包裹方向相反（這是收到不是寄出）。<br><b>提醒</b>：問「まず」就是問<b>第一件事</b>，簽名是確認之後才做的。","img":"img/mock/l1-12.png","c":["1","2","3","4"]},{"n":4,"play":[{"r":"N","t":"4ばん。"},{"r":"N","t":"女の人は これから 何を しますか。"},{"p":5},{"r":"M","t":"ただいま。やさいと にく、買って きましたよ。"},{"r":"F","t":"ありがとう。じゃ、わたしが カレーを 作りますね。"},{"r":"M","t":"てつだいましょうか。"},{"r":"F","t":"だいじょうぶです。その あいだに へやを かたづけて ください。"},{"r":"M","t":"はい、わかりました。"},{"r":"N","t":"女の人は これから 何を しますか。"}],"q":"女の人は これから 何を しますか。","a":0,"gap":10,"zh":"男：我回來了。蔬菜和肉買回來了喔。／女：謝謝。那我來做咖哩吧。／男：要我幫忙嗎？／女：不用，你趁這時候整理一下房間。／男：好，我知道了。","e":"<b>關鍵句</b>：「<b>わたしが カレーを 作りますね</b>」＝她要做菜。<br>→ 正解は 1 の 絵（りょうりを 作る）。<br>其他選項：2 吃飯是做完之後；<b>3 的買菜是男生已經做完的事</b>（買って きました）；4 出門沒提到。<b>整理房間是男生要做的</b>，不要跟女生的動作搞混。","img":"img/mock/l1-13.png","c":["1","2","3","4"]},{"n":5,"play":[{"r":"N","t":"5ばん。"},{"r":"N","t":"女の人は どこで 佐藤さんに 会いましたか。"},{"p":5},{"r":"M","t":"きのう、佐藤さんに 会いましたか。"},{"r":"F","t":"ええ、会いましたよ。"},{"r":"M","t":"どこで 会いましたか。会社ですか。"},{"r":"F","t":"いいえ。えきへ 行く とちゅうの 道で ぐうぜん 会って、十分ぐらい 話しました。"},{"r":"M","t":"そうですか。げんきそうでしたか。"},{"r":"N","t":"女の人は どこで 佐藤さんに 会いましたか。"}],"q":"女の人は どこで 佐藤さんに 会いましたか。","a":2,"gap":10,"zh":"男：昨天見到佐藤小姐了嗎？／女：嗯，見到了喔。／男：在哪裡見到的？公司嗎？／女：不是。在去車站的路上碰巧遇到，聊了十分鐘左右。／男：這樣啊。她看起來還好嗎？","e":"<b>關鍵句</b>：「<b>道で ぐうぜん 会って、十分ぐらい 話しました</b>」。<br>→ 正解は 3 の 絵（道で 話して いる）。<br>其他選項：<b>1 的公司被「いいえ」否定掉了</b>；2 店門口沒提到；4 在家裡也沒提到。<br><b>提醒</b>：「えきへ 行く とちゅう」是在<b>路上</b>，不是在車站。","img":"img/mock/l1-14.png","c":["1","2","3","4"]},{"n":6,"play":[{"r":"N","t":"6ばん。"},{"r":"N","t":"二人は しごとの あとで 何を しますか。"},{"p":5},{"r":"F","t":"山田さん、しごとは まだ おわりませんか。"},{"r":"M","t":"あと 少しです。レポートを 書いて いますから。"},{"r":"F","t":"そうですか。じゃ、おわったら お茶でも 飲みに 行きませんか。"},{"r":"M","t":"いいですね。三十分ぐらいで おわりますから、まって いて ください。"},{"r":"F","t":"わかりました。下の きっさてんで まって います。"},{"r":"N","t":"二人は しごとの あとで 何を しますか。"}],"q":"二人は しごとの あとで 何を しますか。","a":3,"gap":10,"zh":"女：山田先生，工作還沒結束嗎？／男：還差一點，我在寫報告。／女：這樣啊。那結束之後要不要去喝杯茶？／男：好啊。大概三十分鐘會結束，請等我一下。／女：知道了，我在樓下的咖啡店等你。","e":"<b>關鍵句</b>：「<b>お茶でも 飲みに 行きませんか</b>」＋「いいですね」＝兩人都同意。<br>→ 正解は 4 の 絵（二人で お茶を 飲む）。<br>其他選項：<b>1 用電腦是「現在」還在做的工作</b>（レポートを 書いて います）；2 購物、3 躺沙發都沒提到。","img":"img/mock/l1-15.png","c":["1","2","3","4"]},{"n":7,"play":[{"r":"N","t":"7ばん。"},{"r":"N","t":"男の人は いつも 何で 会社へ 来ますか。"},{"p":5},{"r":"F","t":"山田さんは まいにち 電車で 会社へ 来て いますか。"},{"r":"M","t":"いいえ。うちから えきまで とおいですから、じてんしゃで 来て います。"},{"r":"F","t":"そうですか。雨の 日は どう しますか。"},{"r":"M","t":"雨の 日だけ バスに のります。でも、バスは 時間が かかりますね。"},{"r":"F","t":"たいへんですね。"},{"r":"N","t":"男の人は いつも 何で 会社へ 来ますか。"}],"q":"男の人は いつも 何で 会社へ 来ますか。","a":2,"gap":10,"zh":"女：山田先生每天都搭電車來公司嗎？／男：不，從家裡到車站很遠，所以我都騎腳踏車。／女：這樣啊。下雨天怎麼辦？／男：只有下雨天搭公車。不過公車很花時間呢。／女：真辛苦。","e":"<b>關鍵句</b>：「<b>じてんしゃで 来て います</b>」——「〜て います」表示<b>平常的習慣</b>。<br>→ 正解は 3 の 絵（じてんしゃ）。<br>其他選項：1 的公車是<b>「雨の 日だけ」</b>的例外；2 計程車沒提到；4 的電車在第一句就被「いいえ」否定了。<br><b>提醒</b>：問「いつも」就是問<b>平常</b>，不要被例外那句騙走。","img":"img/mock/l2-06.png","c":["1","2","3","4"]}]},{"no":2,"title":"問題2　ポイント理解","instr":"問題2では、はじめに しつもんを 聞いて ください。それから 話を 聞いて、もんだいようしの 1から4の 中から、いちばん いい ものを 一つ えらんで ください。","ex":{"ex":true,"q":"女の人は けさ 何時に おきましたか。","c":["六時","六時半","七時","七時半"],"a":1,"zh":"男：今天早上幾點起床？／女：六點半。","play":[{"r":"N","t":"れい。"},{"r":"N","t":"女の人は けさ 何時に おきましたか。"},{"p":12},{"r":"M","t":"けさ、何時に おきましたか。"},{"r":"F","t":"六時半です。"},{"r":"N","t":"女の人は けさ 何時に おきましたか。"},{"r":"N","t":"いちばん いい ものは 2ばんです。"}]},"items":[{"n":1,"play":[{"r":"N","t":"1ばん。"},{"r":"N","t":"女の人は あした 何時に うちを 出ますか。"},{"p":12},{"r":"M","t":"あしたの 朝、何時に うちを 出ますか。"},{"r":"F","t":"そうですね。八時の 電車に のりたいですから、七時には 出ます。"},{"r":"M","t":"えきまで 二十分 かかりますからね。"},{"r":"F","t":"ええ。ですから 六時に おきないと いけません。"},{"r":"M","t":"早いですね。"},{"r":"N","t":"女の人は あした 何時に うちを 出ますか。"}],"q":"女の人は あした 何時に うちを 出ますか。","a":3,"gap":10,"zh":"男：明天早上幾點出門？／女：嗯…我想搭八點的電車，所以七點就要出門。／男：到車站要二十分鐘嘛。／女：對。所以我得六點起床。／男：真早呢。","e":"<b>關鍵句</b>：「<b>七時には 出ます</b>」＝七點出門。<br>其他選項：六時 是<b>起床</b>時間、八時 是<b>電車</b>的時間、九時 完全沒出現。<br><b>提醒</b>：這種題目一定會出現三四個時間，要聽清楚每個時間各自配哪個動作。","c":["六時","八時","九時","七時"]},{"n":2,"play":[{"r":"N","t":"2ばん。"},{"r":"N","t":"女の人は どうして かおいろが わるいですか。"},{"p":12},{"r":"M","t":"どう しましたか。かおいろが わるいですよ。"},{"r":"F","t":"けさから あたまが いたいんです。"},{"r":"M","t":"ねつは ありますか。"},{"r":"F","t":"いいえ、ねつは ありません。きのう おそくまで しごとを して、あまり ねて いませんから。"},{"r":"M","t":"じゃ、きょうは 早く 帰った ほうが いいですよ。"},{"r":"N","t":"女の人は どうして かおいろが わるいですか。"}],"q":"女の人は どうして かおいろが わるいですか。","a":0,"gap":10,"zh":"男：怎麼了？你臉色不太好喔。／女：從今天早上開始頭就很痛。／男：有發燒嗎？／女：沒有，沒發燒。昨天工作到很晚，沒什麼睡。／男：那今天早點回去比較好喔。","e":"<b>關鍵句</b>：「<b>けさから あたまが いたいんです</b>」＝頭痛。<br>其他選項：<b>ねつ 被「ねつは ありません」否定掉了</b>（這是最常見的陷阱）；かぜ（感冒）沒提到；工作忙是<b>頭痛的原因</b>，不是臉色差的直接回答——問的是「どうして かおいろが わるい」。","c":["あたまが いたいから","ねつが あるから","かぜを ひいたから","しごとが いそがしいから"]},{"n":3,"play":[{"r":"N","t":"3ばん。"},{"r":"N","t":"女の人は いくら はらいますか。"},{"p":12},{"r":"F","t":"すみません、この ノートは いくらですか。"},{"r":"M","t":"一さつ 四百円です。"},{"r":"F","t":"じゃ、三さつ ください。"},{"r":"M","t":"ありがとう ございます。ぜんぶで 千二百円です。ふくろは いりますか。"},{"r":"F","t":"いいえ、けっこうです。"},{"r":"N","t":"女の人は いくら はらいますか。"}],"q":"女の人は いくら はらいますか。","a":1,"gap":10,"zh":"女：不好意思，這個筆記本多少錢？／男：一本四百圓。／女：那請給我三本。／男：謝謝。總共一千兩百圓。需要袋子嗎？／女：不用，謝謝。","e":"<b>關鍵句</b>：四百円 × 三さつ＝<b>千二百円</b>，店員最後也說了一次。<br>其他選項：千円 和 二千円 都是湊整數的干擾項；八百円 是只算兩本。<br><b>提醒</b>：數字題常常要自己算一次，不一定會把答案直接唸出來。","c":["千円","千二百円","八百円","二千円"]},{"n":4,"play":[{"r":"N","t":"4ばん。"},{"r":"N","t":"女の人は 日よう日 どこへ 行きますか。"},{"p":12},{"r":"M","t":"日よう日、いっしょに デパートへ 行きませんか。"},{"r":"F","t":"すみません、日よう日は ちょっと…。"},{"r":"M","t":"何か 用事が ありますか。"},{"r":"F","t":"ええ、来週 テストが ありますから、としょかんで べんきょうします。"},{"r":"M","t":"そうですか。じゃ、また こんど さそいますね。"},{"r":"N","t":"女の人は 日よう日 どこへ 行きますか。"}],"q":"女の人は 日よう日 どこへ 行きますか。","a":2,"gap":10,"zh":"男：星期天要不要一起去百貨公司？／女：抱歉，星期天有點…／男：有什麼事嗎？／女：嗯，下週有考試，我要在圖書館唸書。／男：這樣啊。那下次再約你。","e":"<b>關鍵句</b>：「<b>としょかんで べんきょうします</b>」。<br>其他選項：<b>デパート 是被婉拒的邀約</b>；えいがかん、びょういん 完全沒提到。<br><b>提醒</b>：「ちょっと…」沒說完就是<b>委婉拒絕</b>，後面才會講真正的理由。","c":["デパート","えいがかん","としょかん","びょういん"]},{"n":5,"play":[{"r":"N","t":"5ばん。"},{"r":"N","t":"二人は どの シャツを 買いますか。"},{"p":12},{"r":"F","t":"この しろい シャツ、どうですか。"},{"r":"M","t":"うーん、わたしは あおの ほうが 好きです。"},{"r":"F","t":"そうですか。でも、しろいのも きれいですよ。"},{"r":"M","t":"ええ。でも、しろいのは すぐ よごれますから。"},{"r":"F","t":"それも そうですね。じゃ、こっちに します。"},{"r":"N","t":"二人は どの シャツを 買いますか。"}],"q":"二人は どの シャツを 買いますか。","a":3,"gap":10,"zh":"女：這件白襯衫怎麼樣？／男：嗯…我比較喜歡藍色的。／女：這樣啊。可是白的也很好看喔。／男：是啊。不過白的很快就髒了。／女：說得也是。那就選這件吧。","e":"<b>關鍵句</b>：「<b>あおの ほうが 好きです</b>」＋最後「こっちに します」＝決定買藍的。<br>其他選項：<b>しろい 被「すぐ よごれますから」否定掉了</b>；くろい・あかい 沒提到。<br><b>提醒</b>：「〜に します」＝決定選…，這句一出現就是答案；而且它出現在<b>最後</b>，不能聽到一半就作答。","c":["しろい シャツ","くろい シャツ","あかい シャツ","あおい シャツ"]},{"n":6,"play":[{"r":"N","t":"6ばん。"},{"r":"N","t":"テストは 何よう日に ありますか。"},{"p":12},{"r":"M","t":"テストは 水よう日でしたね。"},{"r":"F","t":"いいえ、水よう日じゃ ありません。木よう日ですよ。"},{"r":"M","t":"あ、そうでしたか。"},{"r":"F","t":"あ、でも きのう 先生が、木よう日から 金よう日に かわりますと 言って いました。"},{"r":"M","t":"そうですか。あぶなかったです。"},{"r":"N","t":"テストは 何よう日に ありますか。"}],"q":"テストは 何よう日に ありますか。","a":0,"gap":10,"zh":"男：考試是星期三對吧。／女：不，不是星期三，是星期四喔。／男：啊，這樣啊。／女：啊，不過昨天老師說，從星期四改到星期五了。／男：這樣啊，好險。","e":"<b>關鍵句</b>：「<b>木よう日から 金よう日に かわります</b>」——「AからBに かわる」＝從A改成B，<b>B 才是現在的</b>。<br>其他選項：もくよう日 是改之前的、すいよう日 是男生一開始記錯的、どよう日 沒出現。<br><b>提醒</b>：這題連續修正了兩次（水→木→金），要聽到<b>最後一次</b>才是答案。","c":["きんよう日","もくよう日","すいよう日","どよう日"]}]},{"no":3,"title":"問題3　発話表現","instr":"問題3では、えを 見ながら しつもんを 聞いて ください。やじるしの 人は 何と 言いますか。1から3の 中から、いちばん いい ものを 一つ えらんで ください。","ex":{"ex":true,"scene":"img/mock/l3-20.png","q":"ともだちに プレゼントを わたします。何と 言いますか。","c":["どうぞ。","どうも。","おねがいします。"],"a":0,"zh":"旁白：要把禮物交給朋友。這時候要說什麼？","play":[{"r":"N","t":"れい。"},{"r":"N","t":"ともだちに プレゼントを わたします。何と 言いますか。"},{"r":"N","t":"1ばん。"},{"r":"M","t":"どうぞ。"},{"r":"N","t":"2ばん。"},{"r":"F","t":"どうも。"},{"r":"N","t":"3ばん。"},{"r":"M","t":"おねがいします。"},{"r":"N","t":"いちばん いい ものは 1ばんです。"}]},"items":[{"n":1,"scene":"img/mock/l3-02.png","play":[{"r":"N","t":"1ばん。"},{"r":"N","t":"はじめて ともだちの うちへ 行きました。げんかんで 何と 言いますか。"},{"r":"N","t":"1ばん。"},{"r":"M","t":"おじゃまします。"},{"r":"N","t":"2ばん。"},{"r":"F","t":"いらっしゃいませ。"},{"r":"N","t":"3ばん。"},{"r":"M","t":"おかえりなさい。"}],"q":"何と 言いますか。","c":["おじゃまします。","いらっしゃいませ。","おかえりなさい。"],"a":0,"gap":8,"zh":"旁白：要進朋友家。這時候要說什麼？","e":"進別人家說「<b>おじゃまします</b>」＝打擾了。<br>其他選項：いらっしゃいませ＝歡迎光臨，是<b>店員</b>對客人說的；おかえりなさい＝你回來啦，是<b>在家的人</b>對回家的人說的。<br><b>陷阱</b>：三個都是「門口會聽到的話」，差別在<b>誰說</b>——箭頭指的是要進門的客人。","hideChoices":true},{"n":2,"scene":"img/mock/l3-09.png","play":[{"r":"N","t":"2ばん。"},{"r":"N","t":"レストランで ちゅうもんを したいです。店の 人に 何と 言いますか。"},{"r":"N","t":"1ばん。"},{"r":"M","t":"すみません。"},{"r":"N","t":"2ばん。"},{"r":"F","t":"ごめんなさい。"},{"r":"N","t":"3ばん。"},{"r":"M","t":"しつれいしました。"}],"q":"何と 言いますか。","c":["ごめんなさい。","すみません。","しつれいしました。"],"a":1,"gap":8,"zh":"旁白：在餐廳要叫店員。這時候要說什麼？","e":"叫人、搭話用「<b>すみません</b>」。<br>其他選項：ごめんなさい＝對不起（做錯事時的道歉）、しつれいしました＝失禮了（做了失禮的事之後）。<br><b>陷阱</b>：すみません 有「不好意思／抱歉／謝謝」三種用法，這裡是<b>叫人</b>的那一種；另外兩個都只能用在道歉。","hideChoices":true},{"n":3,"scene":"img/mock/l3-12.png","play":[{"r":"N","t":"3ばん。"},{"r":"N","t":"仕事が おわって、先に 帰ります。何と 言いますか。"},{"r":"N","t":"1ばん。"},{"r":"M","t":"おさきに しつれいします。"},{"r":"N","t":"2ばん。"},{"r":"F","t":"いってらっしゃい。"},{"r":"N","t":"3ばん。"},{"r":"M","t":"おつかれさまでした。"}],"q":"何と 言いますか。","c":["いってらっしゃい。","おつかれさまでした。","おさきに しつれいします。"],"a":2,"gap":8,"zh":"旁白：工作結束，要比別人先下班。這時候要說什麼？","e":"比別人早走說「<b>おさきに しつれいします</b>」。<br>其他選項：いってらっしゃい＝慢走（<b>送人</b>的人說的）、おつかれさまでした＝辛苦了（是<b>留下來的人</b>回應先走的人的話）。<br><b>陷阱</b>：おつかれさまでした 在辦公室很常聽到，但在這個場景是<b>別人回你</b>的話，不是你說的。","hideChoices":true},{"n":4,"scene":"img/mock/l3-15.png","play":[{"r":"N","t":"4ばん。"},{"r":"N","t":"ともだちが りょこうに 行きます。何と 言いますか。"},{"r":"N","t":"1ばん。"},{"r":"M","t":"いってらっしゃい。"},{"r":"N","t":"2ばん。"},{"r":"F","t":"いって きます。"},{"r":"N","t":"3ばん。"},{"r":"M","t":"ただいま。"}],"q":"何と 言いますか。","c":["いってらっしゃい。","いって きます。","ただいま。"],"a":0,"gap":8,"zh":"旁白：朋友要去旅行。這時候要說什麼？","e":"送人出發說「<b>いってらっしゃい</b>」。<br>其他選項：いって きます＝我出門了（<b>要走的人</b>說的）、ただいま＝我回來了。<br><b>陷阱</b>：いってらっしゃい 和 いって きます 只差幾個音，但說話的人完全相反 ——<b>箭頭指的是留下來的人</b>，所以要說 いってらっしゃい。","hideChoices":true},{"n":5,"scene":"img/mock/l3-08.png","play":[{"r":"N","t":"5ばん。"},{"r":"N","t":"ともだちから プレゼントを もらいました。何と 言いますか。"},{"r":"N","t":"1ばん。"},{"r":"M","t":"ありがとう ございます。"},{"r":"N","t":"2ばん。"},{"r":"F","t":"おめでとう ございます。"},{"r":"N","t":"3ばん。"},{"r":"M","t":"どう いたしまして。"}],"q":"何と 言いますか。","c":["おめでとう ございます。","ありがとう ございます。","どう いたしまして。"],"a":1,"gap":8,"zh":"旁白：收到朋友送的禮物。這時候要說什麼？","e":"收到東西道謝「<b>ありがとう ございます</b>」。<br>其他選項：おめでとう ございます＝恭喜（<b>祝賀別人</b>）、どう いたしまして＝不客氣（是<b>被道謝的人</b>回的話）。<br><b>陷阱</b>：どう いたしまして 是「ありがとう」的回答，順序顛倒了。","hideChoices":true}]},{"no":4,"title":"問題4　即時応答","instr":"問題4では、えなどが ありません。ぶんを 聞いて、1から3の 中から、いちばん いい ものを 一つ えらんで ください。","ex":{"ex":true,"q":"（へんじを えらんで ください）","c":["山田です。","はじめまして。","そうです。"],"a":0,"zh":"女：請問您貴姓？","play":[{"r":"N","t":"れい。"},{"r":"F","t":"おなまえは。"},{"r":"M","t":"山田です。"},{"r":"M","t":"はじめまして。"},{"r":"M","t":"そうです。"},{"r":"N","t":"いちばん いい ものは 1ばんです。"}]},"items":[{"n":1,"play":[{"r":"N","t":"1ばん。"},{"r":"F","t":"この まどを あけても いいですか。"},{"r":"M","t":"ええ、どうぞ。"},{"r":"M","t":"ええ、あけました。"},{"r":"M","t":"いいえ、あけます。"}],"q":"（へんじを えらんで ください）","c":["ええ、あけました。","いいえ、あけます。","ええ、どうぞ。"],"a":2,"gap":8,"zh":"女：這扇窗戶可以打開嗎？","e":"「〜ても いいですか」是<b>請求許可</b>，答應就說「ええ、どうぞ」。<br>其他選項：「あけました」＝我開了，<b>主客顛倒</b>（要開的是問的人）；「いいえ、あけます」前後矛盾（拒絕卻又說要開）。","hideChoices":true},{"n":2,"play":[{"r":"N","t":"2ばん。"},{"r":"M","t":"お仕事は 何ですか。"},{"r":"F","t":"きょうしです。"},{"r":"F","t":"かいしゃの 前です。"},{"r":"F","t":"九時からです。"}],"q":"（へんじを えらんで ください）","c":["きょうしです。","かいしゃの 前です。","九時からです。"],"a":0,"gap":8,"zh":"男：請問您從事什麼工作？","e":"問職業，要回答<b>職業名稱</b>。<br>其他選項：「かいしゃの 前です」是回答<b>地點</b>（どこですか）、「九時からです」是回答<b>時間</b>（何時からですか）。<br><b>陷阱</b>：三個答案都和「工作」有關，但只有第一個回答到「是什麼工作」。","hideChoices":true},{"n":3,"play":[{"r":"N","t":"3ばん。"},{"r":"F","t":"しゅうまつ どこかへ 行きましたか。"},{"r":"M","t":"いいえ、どこへも 行きませんでした。"},{"r":"M","t":"はい、どこも 行きました。"},{"r":"M","t":"いいえ、だれも 行きました。"}],"q":"（へんじを えらんで ください）","c":["はい、どこも 行きました。","いいえ、どこへも 行きませんでした。","いいえ、だれも 行きました。"],"a":1,"gap":8,"zh":"女：週末有去哪裡嗎？","e":"「どこか」的否定回答是「<b>どこへも 行きませんでした</b>」。<br>其他選項：「どこも 行きました」—— 疑問詞＋も <b>一定要配否定</b>，接肯定是錯的；「だれも」問的是人不是地方，而且同樣接了肯定。<br><b>陷阱</b>：どこか（某處）↔ どこも／どこへも（哪裡都…不），回答時要跟著換。","hideChoices":true},{"n":4,"play":[{"r":"N","t":"4ばん。"},{"r":"M","t":"あそこの かばんは だれのですか。"},{"r":"F","t":"わたしのです。"},{"r":"F","t":"わたしです。"},{"r":"F","t":"わたしへです。"}],"q":"（へんじを えらんで ください）","c":["わたしです。","わたしへです。","わたしのです。"],"a":2,"gap":8,"zh":"男：那邊那個包包是誰的？","e":"問「だれの」要用「<b>〜の</b>」回答＝我的。<br>其他選項：「わたしです」是回答<b>「だれですか」</b>（是誰）；「わたしへです」不成句。<br><b>陷阱</b>：差一個 の，問的東西就完全不同 ——「だれ」問人、「だれの」問所有者。","hideChoices":true},{"n":5,"play":[{"r":"N","t":"5ばん。"},{"r":"F","t":"もう しゅくだいを しましたか。"},{"r":"M","t":"いいえ、まだです。"},{"r":"M","t":"いいえ、しませんでした。"},{"r":"M","t":"はい、まだです。"}],"q":"（へんじを えらんで ください）","c":["いいえ、まだです。","いいえ、しませんでした。","はい、まだです。"],"a":0,"gap":8,"zh":"女：作業已經寫了嗎？","e":"「もう〜ましたか」的否定回答是「<b>まだです</b>」＝還沒（等一下會做）。<br>其他選項：「しませんでした」＝<b>當時沒做</b>，語氣是已經結束、不會再做了；「はい、まだです」前後矛盾。<br><b>陷阱</b>：中文都講「還沒寫」，日文卻分成「まだです」（之後會做）和「〜ませんでした」（那時候沒做）兩種。","hideChoices":true},{"n":6,"play":[{"r":"N","t":"6ばん。"},{"r":"M","t":"にもつが 多いですね。手つだいましょうか。"},{"r":"F","t":"ありがとう ございます。おねがいします。"},{"r":"F","t":"いいえ、手つだいます。"},{"r":"F","t":"はい、多いです。"}],"q":"（へんじを えらんで ください）","c":["いいえ、手つだいます。","ありがとう ございます。おねがいします。","はい、多いです。"],"a":1,"gap":8,"zh":"男：行李很多呢。要我幫忙嗎？","e":"「〜ましょうか」是<b>主動提議幫忙</b>，接受就道謝並說「おねがいします」。<br>其他選項：「いいえ、手つだいます」變成<b>你要去幫對方</b>（主客顛倒）；「はい、多いです」只回答了行李多不多，<b>沒有回應「要不要幫忙」</b>。","hideChoices":true}]}],"n":24}]}</script>
<script id="paper-B" type="application/json">{"id":"B","name":"B 卷","pass":{"total":80,"a":38,"b":19},"sections":[{"key":"moji","label":"言語知識（文字・語彙）","min":20,"parts":[{"no":1,"title":"問題1","instr":"＿＿の ことばは ひらがなで どう 書きますか。1・2・3・4から いちばん いい ものを 一つ えらんで ください。","items":[{"q":"<span class=\"ul\">兄</span>は 大学生です。","c":["あに","あね","おとうと","ちち"],"a":0,"e":"兄＝あに，指自己的哥哥。<br>其他選項：あね＝姉（姊姊）、おとうと＝弟（弟弟）、ちち＝父（爸爸）。<br><b>容易選錯的地方</b>：「兄」和「姉」都是年長的手足，字形也像。記法是「兄」有 儿（人的腳）、「姉」有 女字旁。講別人的哥哥要說 お兄さん。"},{"q":"<span class=\"ul\">午前</span> 十時に 来て ください。","c":["ごご","ごぜん","ぜんご","ごせん"],"a":1,"e":"午前＝ごぜん（上午）。<br>其他選項：ごご＝午後（下午，意思相反）、ぜんご＝前後、ごせん 不是詞。<br><b>容易選錯的地方</b>：午前／午後 只差一個字，考試很愛出。「前」在這裡唸 ぜん（音讀），單獨當「前面」時唸 まえ。"},{"q":"つくえの <span class=\"ul\">下</span>に かばんが あります。","c":["うえ","か","した","もと"],"a":2,"e":"下＝した（下面）。<br>其他選項：うえ＝上（上面，意思相反）、か 是音讀（地下＝ちか）、もと 是另一種訓讀（用在 足もと 這種詞）。<br><b>容易選錯的地方</b>：上・下・中・外 這組位置詞常一起考，而且「下」在 地下鉄（ちかてつ）裡唸 か，單獨用才唸 した。"},{"q":"りんごを <span class=\"ul\">四つ</span> ください。","c":["よんつ","しつ","よつ","よっつ"],"a":3,"e":"四つ＝よっつ。<br>其他選項：よんつ・しつ・よつ 都不是正確唸法。<br><b>容易選錯的地方</b>：一つ〜十 的唸法全部特殊 —— ひとつ、ふたつ、みっつ、よっつ、いつつ、むっつ、ななつ、やっつ、ここのつ、とお，而且「四」在這裡唸 よ 不唸 し。"},{"q":"きのうは <span class=\"ul\">雪</span>が ふりました。","c":["ゆき","あめ","くも","せつ"],"a":0,"e":"雪＝ゆき。<br>其他選項：あめ＝雨、くも＝雲、せつ 是音讀（大雪＝たいせつ 才會這樣唸）。<br><b>容易選錯的地方</b>：雨・雲・雪 都是雨字頭，下面的部分不一樣，要一起記。"},{"q":"まいばん ラジオを <span class=\"ul\">聞きます</span>。","c":["もんきます","ききます","きさます","ぶんきます"],"a":1,"e":"聞きます＝ききます（聽；也有「問」的意思）。<br>其他選項：もん・ぶん 是音讀（新聞＝しんぶん）、きさます 不是詞。<br><b>容易選錯的地方</b>：「聞きます」同時有「聽」和「問」兩個意思，靠助詞分辨 ——音楽<b>を</b> 聞きます（聽）／先生<b>に</b> 聞きます（問）。"},{"q":"六時に うちへ <span class=\"ul\">帰ります</span>。","c":["きります","かえします","かえります","もどります"],"a":2,"e":"帰ります＝かえります（回去）。<br>其他選項：かえします＝返します（歸還，漢字不同）、きります＝切ります、もどります＝戻ります（折返，漢字也不同）。<br><b>容易選錯的地方</b>：帰ります（自己回去）和 返します（把東西還人）發音很像，靠漢字和助詞分辨 —— うち<b>へ</b> 帰ります／本<b>を</b> 返します。"}]},{"no":2,"title":"問題2","instr":"＿＿の ことばは どう 書きますか。1・2・3・4から いちばん いい ものを 一つ えらんで ください。","items":[{"q":"<span class=\"ul\">あし</span>が いたいです。","c":["手","耳","目","足"],"a":3,"e":"足（あし）＝腳。<br>其他選項：手＝て、耳＝みみ、目＝め，都是身體部位。<br><b>容易選錯的地方</b>：身體部位的漢字常常整組出現，先把「足」上面是「口」下面是「止」記起來。"},{"q":"<span class=\"ul\">そら</span>が きれいですね。","c":["空","雲","気","天"],"a":0,"e":"空（そら）＝天空。<br>其他選項：雲＝くも、気＝き（元気 的気）、天＝てん（天気 的天）。<br><b>容易選錯的地方</b>：「空」還可以唸 くう（空気＝くうき）、から（空＝空的），一個字三種唸法。"},{"q":"ここから <span class=\"ul\">きた</span>へ 行きます。","c":["比","北","化","東"],"a":1,"e":"北（きた）＝北。<br>其他選項：東＝ひがし、比・化 字形相近但不是方位。<br><b>容易選錯的地方</b>：東西南北 四個字要一起背 —— 東（ひがし）、西（にし）、南（みなみ）、北（きた）。"},{"q":"<span class=\"ul\">ちち</span>は 会社員です。","c":["文","交","父","夫"],"a":2,"e":"父（ちち）＝（自己的）爸爸。<br>其他選項：文＝ぶん、交＝こう、夫＝おっと（丈夫），字形都很像。<br><b>容易選錯的地方</b>：講別人的爸爸要用「お父さん」，講自己的爸爸對外要用「父」。"},{"q":"おんがくが 大きくて、<span class=\"ul\">みみ</span>が いたいです。","c":["目","貝","自","耳"],"a":3,"e":"耳（みみ）＝耳朵。<br>其他選項：目＝め、貝＝かい（貝殼）、自＝じ（自分 的自），四個字形都很接近。<br><b>容易選錯的地方</b>：「耳」和「目」只差一筆和方向，是考試常見的一組。"}]},{"no":3,"title":"問題3","instr":"（　）に 何を 入れますか。1・2・3・4から いちばん いい ものを 一つ えらんで ください。","items":[{"q":"でんわばんごうを <span class=\"bk\">　　</span> ください。","c":["おしえて","ならって","つくって","もらって"],"a":0,"e":"請對方告訴你電話號碼 → おしえて ください。<br>其他選項：ならって＝（我）跟人學、つくって＝做、もらって＝收下，方向或意思都不對。<br><b>容易選錯的地方</b>：教えます 除了「教」還有「告訴」的意思，問路、問電話號碼都用這個字。"},{"q":"かぜを ひきましたから、くすりを <span class=\"bk\">　　</span>。","c":["食べます","飲みます","します","入れます"],"a":1,"e":"日文的「吃藥」是<b>くすりを 飲みます</b>（喝藥）。<br>其他選項：食べます＝吃（日文不這樣講藥）、します＝做、入れます＝放進去。<br><b>容易選錯的地方</b>：中文說「吃藥」，日文一律用 飲む，這是固定搭配，背起來就好。"},{"q":"あめが ふって いますから、<span class=\"bk\">　　</span>を 持って 行きます。","c":["ぼうし","かばん","かさ","くつ"],"a":2,"e":"下雨要帶傘 → かさ。<br>其他選項：ぼうし＝帽子、かばん＝包包、くつ＝鞋子，和下雨沒有直接關係。<br><b>容易選錯的地方</b>：這類題目要抓前半句的情境詞（あめが ふって います），再去選對應的東西。"},{"q":"えきの 前で ともだちを <span class=\"bk\">　　</span>。","c":["のります","はいります","つきます","まちます"],"a":3,"e":"等人用 <b>まちます</b>，對象用 を。<br>其他選項：のります＝搭乘（電車<b>に</b> のります）、はいります＝進入（へや<b>に</b> はいります）、つきます＝到達（えき<b>に</b> つきます）—— 這三個都不配 を。<br><b>容易選錯的地方</b>：看助詞就能刪掉三個選項，只有 まちます 用 を。"},{"q":"たいせつな 話ですから、<span class=\"bk\">　　</span> 聞いて ください。","c":["よく","すぐ","もう","まだ"],"a":0,"e":"「よく 聞いて ください」＝仔細聽。<br>其他選項：すぐ＝馬上、もう＝已經、まだ＝還沒，放進來都不通。<br><b>容易選錯的地方</b>：よく 有「常常」和「仔細、好好地」兩個意思，這裡是後者。"},{"q":"この へやは でんきが ついて いますから、<span class=\"bk\">　　</span>です。","c":["くらい","あかるい","ひろい","せまい"],"a":1,"e":"燈亮著所以房間很亮 → あかるい。<br>其他選項：くらい＝暗（相反）、ひろい＝寬、せまい＝窄，後兩個和燈沒有關係。<br><b>容易選錯的地方</b>：要從「でんきが ついて います」這個原因反推結果，不是看房間本身。"}]},{"no":4,"title":"問題4","instr":"＿＿の ぶんと だいたい 同じ いみの ぶんが あります。1・2・3・4から いちばん いい ものを 一つ えらんで ください。","items":[{"q":"この みせは 十時に <span class=\"ul\">あきます</span>。","c":["この みせは 十時までです。","この みせは 十時に しまります。","この みせは 十時からです。","この みせは 十時に 休みます。"],"a":2,"e":"「十時に あきます」＝十點開門＝營業從十點開始。<br>其他選項：十時まで＝到十點為止（結束時間）、しまります＝關門（相反）、休みます＝公休。<br><b>容易選錯的地方</b>：あきます／しまります 是一組，から／まで 是一組，把「開門＝から」「關門＝まで」對起來就不會錯。"},{"q":"わたしは まいばん 十一時に <span class=\"ul\">ねます</span>。","c":["わたしは まいばん 十一時に おきます。","わたしは まいばん 十一時まで はたらきます。","わたしは まいばん 十一時に 出かけます。","わたしは まいばん 十一時に 休みます。"],"a":3,"e":"「ねます」＝就寢，和「休みます」（休息、就寢）意思相同。<br>其他選項：おきます＝起床（相反）、はたらきます＝工作、出かけます＝出門。<br><b>容易選錯的地方</b>：休みます 有「請假」「休息」「就寢」三個意思，這裡配「まいばん 十一時に」就是就寢。"},{"q":"山田さんは いま <span class=\"ul\">でかけて います</span>。","c":["山田さんは いま うちに いません。","山田さんは いま うちに います。","山田さんは いま ねて います。","山田さんは いま しごとを して います。"],"a":0,"e":"「でかけて います」＝出門了（現在不在）。<br>其他選項：2 在家（相反）、3 在睡覺、4 在工作，都不等於「出門不在」。<br><b>容易選錯的地方</b>：「〜て います」在這裡表示<b>動作之後的狀態</b>（出門了，所以現在不在），不是「正在出門」。"}]}],"n":21},{"key":"bunpou","label":"言語知識（文法）・読解","min":40,"parts":[{"no":1,"title":"問題1","instr":"（　）に 何を 入れますか。1・2・3・4から いちばん いい ものを 一つ えらんで ください。","items":[{"q":"つくえの 上に 本が ならべて <span class=\"bk\">　　</span>。","c":["います","あります","おきます","します"],"a":1,"e":"「他動詞て形＋あります」＝有人做好、現在是那個狀態。ならべて あります＝（被）排好了。<br>其他選項：います 用在有生命的東西；おきます・します 接不上 ならべて。<br><b>同類對照</b>：<b>〜て あります</b>（有人刻意做好的狀態）vs <b>〜て います</b>（正在做／自然的狀態）。"},{"q":"としょかんで 大きい こえで <span class=\"bk\">　　</span> いけません。","c":["話して","話す","話しては","話した"],"a":2,"e":"「て形＋は いけません」＝不可以…。話す → 話しては。<br>其他選項：話して 少了 は、話す 是辭書形、話した 是た形，都接不上 いけません。<br><b>同類對照</b>：<b>〜ては いけません</b>（禁止）↔ <b>〜ても いいです</b>（許可），兩個成對記。"},{"q":"ともだち<span class=\"bk\">　　</span> 本を かしました。","c":["を","が","で","に"],"a":3,"e":"借出去的對象用 <b>に</b>：友だちに 本を かしました＝把書借給朋友。<br>其他選項：を 是借出的東西（本を）、が 是主語、で 是手段。<br><b>同類對照</b>：<b>かします</b>（借出，對象用 に）↔ <b>かります</b>（借入，來源用 に／から）。"},{"q":"あの 人は だれ<span class=\"bk\">　　</span> 知って いますか。","c":["か","が","を","は"],"a":0,"e":"疑問詞＋<b>か</b>＝不確定的內容（知不知道他是誰）。<br>其他選項：が・を・は 放在 だれ 後面會變成直接問「誰知道」，和句尾的「知って いますか」對不上。<br><b>同類對照</b>：疑問詞＋<b>か</b>（某個…）／＋<b>も</b>＋否定（都不…）／＋<b>でも</b>＋肯定（都…）。"},{"q":"へやに だれ<span class=\"bk\">　　</span> いませんでした。","c":["か","も","が","は"],"a":1,"e":"疑問詞＋<b>も</b>＋否定＝一個人也沒有。<br>其他選項：か 是「有沒有人」的疑問、が 是主語、は 是主題，後面都不會接否定的 いませんでした。<br><b>同類對照</b>：何も／どこへも／だれも ＋ 否定，是同一組用法。"},{"q":"すみません、もう 一度 <span class=\"bk\">　　</span> ください。","c":["言い","言う","言って","言った"],"a":2,"e":"請求用「て形＋ください」。言う → 言って。<br>其他選項：言い 是ます形語幹、言う 是辭書形、言った 是た形，都接不上 ください。<br><b>同類對照</b>：<b>〜て ください</b>（請做）↔ <b>〜ないで ください</b>（請不要做）。"},{"q":"あしたは たぶん 晴れる<span class=\"bk\">　　</span>。","c":["ましょう","ください","ですか","でしょう"],"a":3,"e":"「たぶん〜でしょう」＝大概會…吧，用來推測。<br>其他選項：ましょう＝提議、ください＝請求、ですか＝疑問，都和「たぶん」搭不起來。<br><b>同類對照</b>：たぶん 一定配 でしょう；きっと 語氣更肯定。"},{"q":"ここで しゃしんを <span class=\"bk\">　　</span> ください。","c":["とらないで","とらなくて","とらない","とりません"],"a":0,"e":"請對方不要做某事用「ない形＋で ください」。とる → とらないで。<br>其他選項：とらなくて 是原因用法、とらない 是普通形、とりません 是句尾，都接不上 ください。<br><b>同類對照</b>：<b>ないで</b>（沒做…就…／請不要）vs <b>なくて</b>（因為沒有…）。"},{"q":"わたしは 本を 読む<span class=\"bk\">　　</span> 好きです。","c":["ことが","のが","のを","ことを"],"a":1,"e":"把動作變成名詞再接「〜が 好きです」，用 <b>のが</b>：読むのが 好きです。<br>其他選項：ことが 多半配 できます（読む ことが できます）、のを・ことを 的 を 和形容詞 好き 不搭。<br><b>同類對照</b>：<b>〜のが 好き／上手／下手</b>（形容詞，用 が）vs <b>〜ことが できる</b>（能力）。"}]},{"no":2,"title":"問題2","instr":"★に 入る ものは どれですか。1・2・3・4から いちばん いい ものを 一つ えらんで ください。","items":[{"q":"ちち は <span class=\"bk\">　　</span> <span class=\"bk\">　　</span> <span class=\"star\">★</span> <span class=\"bk\">　　</span> ことが あります。","c":["きょねん","いちど","日本へ","行った"],"a":2,"e":"正しい順序：父は <b>きょねん いちど 日本へ 行った</b> ことが あります。＝我爸爸去年去過一次日本。<br>「た形＋ことが あります」＝有過…的經驗，所以最後一格一定是 行った。時間（きょねん）→ 次數（いちど）→ 方向（日本へ）→ 動詞。<br>★的位置是第三格，答案是「日本へ」。"},{"q":"先生、 <span class=\"bk\">　　</span> <span class=\"bk\">　　</span> <span class=\"star\">★</span> <span class=\"bk\">　　</span> ください。","c":["この かんじの","よみかたを","ゆっくり","教えて"],"a":2,"e":"正しい順序：先生、<b>この かんじの よみかたを ゆっくり 教えて</b> ください。＝老師，請慢慢告訴我這個漢字怎麼唸。<br>名詞接名詞用 の（かんじの よみかた），受詞用 を，副詞（ゆっくり）放在動詞前面。<br>★的位置是第三格，答案是「ゆっくり」。"},{"q":"きのうは <span class=\"bk\">　　</span> <span class=\"bk\">　　</span> <span class=\"star\">★</span> <span class=\"bk\">　　</span> 出ました。","c":["ねぼうして","いつもより","おそく","うちを"],"a":2,"e":"正しい順序：きのうは <b>ねぼうして いつもより おそく うちを</b> 出ました。＝昨天睡過頭，比平常晚出門。<br>原因（ねぼうして）→ 比較基準（いつもより）→ 副詞（おそく）→ 出發點（うちを）＋出ます。<br>★的位置是第三格，答案是「おそく」。"},{"q":"あの <span class=\"bk\">　　</span> <span class=\"bk\">　　</span> <span class=\"star\">★</span> <span class=\"bk\">　　</span> 人です。","c":["せが 高くて","めがねを","かけて いる","やさしい"],"a":2,"e":"正しい順序：あの <b>せが 高くて めがねを かけて いる やさしい</b> 人です。＝那位是個子高、戴眼鏡、很溫柔的人。<br>い形容詞連接用て形（高くて），動詞修飾名詞用普通形（かけて いる），最後一個形容詞直接接名詞。<br>★的位置是第三格，答案是「かけて いる」。"}]},{"no":3,"title":"問題3","instr":"つぎの 文章を 読んで、【　】に 入る ものを1・2・3・4から 一つ えらんで ください。","items":[{"pass":"わたしの 父は 毎朝 五時に おきます。おきて すぐ、近くの 川まで 走りに 【1】。<br>一時間ぐらい 走って から、うちへ 帰って シャワーを あびます。そして 新聞を 読み【2】 朝ごはんを 食べます。<br>父は 「からだを 動かすと、一日 げんきに いられる」と 言って います。【3】、わたしは 朝が よわいですから、まだ 一度も いっしょに 行った ことが ありません。<br>来月から わたしも 早く おきて、父と いっしょに 走り【4】です。","passZh":"我爸爸每天早上五點起床。起床後馬上去附近的河邊跑步。跑一個小時左右之後回家沖澡。然後一邊看報紙一邊吃早餐。爸爸說「只要活動身體，一整天都會很有精神」。不過我早上很不行，所以還一次都沒有跟他一起去過。從下個月起我也想早點起床，和爸爸一起跑步。（【1】＝行きます、【2】＝ながら、【3】＝でも、【4】＝たい）","q":"【1】","c":["行って","行った","行きます","行き"],"a":2,"e":"「ます形＋に 行きます」＝去做某事。走りに 行きます＝去跑步，句尾要用 行きます。<br>其他選項：行って・行った・行き 都不能當句尾。<br><b>答案在哪一句</b>：第一段「近くの 川まで 走りに 【1】」—— 句號前面要是完整的句尾。"},{"pass":"わたしの 父は 毎朝 五時に おきます。おきて すぐ、近くの 川まで 走りに 【1】。<br>一時間ぐらい 走って から、うちへ 帰って シャワーを あびます。そして 新聞を 読み【2】 朝ごはんを 食べます。<br>父は 「からだを 動かすと、一日 げんきに いられる」と 言って います。【3】、わたしは 朝が よわいですから、まだ 一度も いっしょに 行った ことが ありません。<br>来月から わたしも 早く おきて、父と いっしょに 走り【4】です。","passZh":"我爸爸每天早上五點起床。起床後馬上去附近的河邊跑步。跑一個小時左右之後回家沖澡。然後一邊看報紙一邊吃早餐。爸爸說「只要活動身體，一整天都會很有精神」。不過我早上很不行，所以還一次都沒有跟他一起去過。從下個月起我也想早點起床，和爸爸一起跑步。（【1】＝行きます、【2】＝ながら、【3】＝でも、【4】＝たい）","q":"【2】","c":["ないで","たり","ても","ながら"],"a":3,"e":"兩件事同時做用「ます形＋ながら」：新聞を 読みながら 朝ごはんを 食べます。<br>其他選項：ないで＝不做…就…、たり＝舉例、ても＝即使，意思都不通。<br><b>答案在哪一句</b>：第二段。看到「読み」這個ます形語幹就知道後面要接 ながら。"},{"pass":"わたしの 父は 毎朝 五時に おきます。おきて すぐ、近くの 川まで 走りに 【1】。<br>一時間ぐらい 走って から、うちへ 帰って シャワーを あびます。そして 新聞を 読み【2】 朝ごはんを 食べます。<br>父は 「からだを 動かすと、一日 げんきに いられる」と 言って います。【3】、わたしは 朝が よわいですから、まだ 一度も いっしょに 行った ことが ありません。<br>来月から わたしも 早く おきて、父と いっしょに 走り【4】です。","passZh":"我爸爸每天早上五點起床。起床後馬上去附近的河邊跑步。跑一個小時左右之後回家沖澡。然後一邊看報紙一邊吃早餐。爸爸說「只要活動身體，一整天都會很有精神」。不過我早上很不行，所以還一次都沒有跟他一起去過。從下個月起我也想早點起床，和爸爸一起跑步。（【1】＝行きます、【2】＝ながら、【3】＝でも、【4】＝たい）","q":"【3】","c":["でも","そして","だから","それから"],"a":0,"e":"爸爸很有精神、但我早上起不來，<b>前後相反</b> → でも。<br>其他選項：そして・それから 是順著接、だから 是因果。<br><b>答案在哪一句</b>：第三段開頭。前一句是正面、後一句是負面，就是轉折。"},{"pass":"わたしの 父は 毎朝 五時に おきます。おきて すぐ、近くの 川まで 走りに 【1】。<br>一時間ぐらい 走って から、うちへ 帰って シャワーを あびます。そして 新聞を 読み【2】 朝ごはんを 食べます。<br>父は 「からだを 動かすと、一日 げんきに いられる」と 言って います。【3】、わたしは 朝が よわいですから、まだ 一度も いっしょに 行った ことが ありません。<br>来月から わたしも 早く おきて、父と いっしょに 走り【4】です。","passZh":"我爸爸每天早上五點起床。起床後馬上去附近的河邊跑步。跑一個小時左右之後回家沖澡。然後一邊看報紙一邊吃早餐。爸爸說「只要活動身體，一整天都會很有精神」。不過我早上很不行，所以還一次都沒有跟他一起去過。從下個月起我也想早點起床，和爸爸一起跑步。（【1】＝行きます、【2】＝ながら、【3】＝でも、【4】＝たい）","q":"【4】","c":["ましょう","たい","ほしい","たいで"],"a":1,"e":"「ます形＋たいです」＝想做…。走ります → 走りたいです。<br>其他選項：ましょう＝邀約、ほしい 要接名詞、たいで 形態不對。<br><b>答案在哪一句</b>：最後一句「わたしも …… 走り【4】です」。"}]},{"no":4,"title":"問題4","instr":"つぎの 文を 読んで、しつもんに こたえて ください。こたえは 1・2・3・4から いちばん いい ものを 一つ えらんで ください。","items":[{"pass":"（教室の ドアに はり紙が あります）<br>「あしたの じゅぎょうは 301の 教室では ありません。205の 教室で します。<br>　じしょを わすれないで 持って きて ください。　田中」","passZh":"（教室門上貼著公告）「明天的課不在 301 教室，在 205 教室上。請不要忘記帶字典來。 田中」","q":"あした 学生は 何を 持って 行きますか。","c":["きょうかしょ","ノート","じしょ","えんぴつ"],"a":2,"e":"「じしょを わすれないで 持って きて ください」。<br>其他選項：課本、筆記本、鉛筆，公告都沒有提到。<br><b>答案在哪一句</b>：最後一行。<b>陷阱</b>：301 是<b>被否定掉</b>的教室，不要看到數字就選。"},{"pass":"わたしの うちには ねこが 二ひき います。<br>あさは わたしの へやで ねて いますが、よるに なると 外へ 出て 行きます。<br>そして あさ、わたしが おきる まえに かならず 帰って きます。","passZh":"我家有兩隻貓。早上在我房間睡覺，一到晚上就會跑到外面去。然後早上在我起床之前一定會回來。","q":"ねこは よる どこに いますか。","c":["この 人の へや","だいどころ","となりの うち","外"],"a":3,"e":"「よるに なると 外へ 出て 行きます」＝晚上到外面去。<br>其他選項：房間是<b>早上</b>睡覺的地方；廚房和鄰居家文章都沒提到。<br><b>答案在哪一句</b>：第二句。<b> r":"F","t":"じゃ、持って 行きます。"},{"r":"N","t":"女の人は あした じしょを どう しますか。"}],"q":"女の人は あした じしょを どう しますか。","a":2,"gap":10,"zh":"女：明天的考試要帶什麼去？／男：聽說只要鉛筆和橡皮擦就好。／女：字典呢？／男：啊，老師說字典可以用。／女：那我帶去。","e":"<b>關鍵句</b>：「<b>じしょは 使っても いい</b>」＋「<b>じゃ、持って 行きます</b>」。<br>其他選項：えんぴつ 是本來就要帶的、ノート 和 きょうかしょ 沒提到。<br><b>提醒</b>：問的是「じしょ 怎麼處理」，答案在女生最後那句決定。","c":["ノート","えんぴつ","じしょ","きょうかしょ"]},{"n":5,"play":[{"r":"N","t":"5ばん。"},{"r":"N","t":"女の人は これから 何を しますか。"},{"p":12},{"r":"M","t":"かおいろが わるいですね。だいじょうぶですか。"},{"r":"F","t":"ちょっと ねつが あるんです。"},{"r":"M","t":"それは たいへんですね。きょうは 休んだ ほうが いいですよ。"},{"r":"F","t":"ええ。でも、その 前に びょういんへ 行って きます。"},{"r":"M","t":"そう ですね。その ほうが いいです。"},{"r":"N","t":"女の人は これから 何を しますか。"}],"q":"女の人は これから 何を しますか。","a":3,"gap":10,"zh":"男：你臉色很差呢，還好嗎？／女：我有點發燒。／男：那很不妙呢，今天還是休息比較好喔。／女：嗯。不過在那之前我要先去醫院。／男：也對，那樣比較好。","e":"<b>關鍵句</b>：「<b>その 前に びょういんへ 行って きます</b>」＝先去醫院。<br>其他選項：<b>うちで ねます 是去完醫院「之後」的事</b>（その 前に 的「その」指的就是休息）；上班和買藥都沒提到。<br><b>提醒</b>：「その 前に」會把順序整個翻過來，是這一類題目最常見的陷阱。","c":["うちで ねます","かいしゃへ 行きます","くすりを 買います","びょういんへ 行きます"]},{"n":6,"play":[{"r":"N","t":"6ばん。"},{"r":"N","t":"女の人は いくら はらいますか。"},{"p":12},{"r":"F","t":"すみません、この りんごは いくらですか。"},{"r":"M","t":"一つ 二百円です。三つ 買うと、五百円に なりますよ。"},{"r":"F","t":"じゃ、三つ ください。あ、この みかんも 一つ。"},{"r":"M","t":"みかんは 一つ 二百円です。ぜんぶで 七百円です。"},{"r":"F","t":"はい。"},{"r":"N","t":"女の人は いくら はらいますか。"}],"q":"女の人は いくら はらいますか。","a":0,"gap":10,"zh":"女：不好意思，這個蘋果多少錢？／男：一個兩百圓。買三個的話是五百圓喔。／女：那請給我三個。啊，這個橘子也要一個。／男：橘子一個兩百圓。總共七百圓。／女：好的。","e":"<b>關鍵句</b>：蘋果三個 500 ＋ 橘子一個 200 ＝ <b>七百円</b>，店員最後也說了一次。<br>其他選項：五百円 是只買蘋果、六百円 是三個蘋果不打折、八百円 是四樣都算兩百。<br><b>提醒</b>：三個蘋果<b>有優惠</b>（600→500），不能直接乘。","c":["七百円","五百円","六百円","八百円"]}]},{"no":3,"title":"問題3　発話表現","instr":"問題3では、えを 見ながら しつもんを 聞いて ください。やじるしの 人は 何と 言いますか。1から3の 中から、いちばん いい ものを 一つ えらんで ください。","ex":{"ex":true,"scene":"img/mock/l3-04.png","q":"ごはんを 食べる まえに、何と 言いますか。","c":["いただきます。","ごちそうさまでした。","おねがいします。"],"a":0,"zh":"旁白：吃飯之前要說什麼？","play":[{"r":"N","t":"れい。"},{"r":"N","t":"ごはんを 食べる まえに、何と 言いますか。"},{"r":"N","t":"1ばん。"},{"r":"M","t":"いただきます。"},{"r":"N","t":"2ばん。 <br>其他選項：ごめんなさい＝對不起（做錯事）、おじゃまします＝打擾了，用在<b>進別人家裡</b>。<br><b>陷阱</b>：おじゃまします 和 しつれいします 都是進門說的，差別在<b>場合</b> ——私人住家用 おじゃまします、學校或公司用 しつれいします。","hideChoices":true},{"n":5,"scene":"img/mock/l3-14.png","play":[{"r":"N","t":"5ばん。"},{"r":"N","t":"はじめて 会う 人に あいさつを します。何と 言いますか。"},{"r":"N","t":"1ばん。"},{"r":"M","t":"はじめまして。"},{"r":"N","t":"2ばん。"},{"r":"F","t":"おひさしぶりです。"},{"r":"N","t":"3ばん。"},{"r":"M","t":"こちらこそ。"}],"q":"何と 言いますか。","c":["おひさしぶりです。","はじめまして。","こちらこそ。"],"a":1,"gap":8,"zh":"旁白：向第一次見面的人打招呼。這時候要說什麼？","e":"第一次見面說「<b>はじめまして</b>」。<br>其他選項：おひさしぶりです＝好久不見（<b>見過</b>的人）、こちらこそ＝彼此彼此（是<b>回應</b>對方的話）。<br><b>陷阱</b>：こちらこそ 要在對方先說了「よろしく」之後才用，不能當開場白。","hideChoices":true}]},{"no":4,"title":"問題4　即時応答","instr":"問題4では、えなどが ありません。ぶんを 聞いて、1から3の 中から、いちばん いい ものを 一つ えらんで ください。","ex":{"ex":true,"q":"（へんじを えらんで ください）","c":["ええ、そうですね。","ええ、てんきです。","いいえ、ちがいます。"],"a":0,"zh":"男：今天天氣真好呢。","play":[{"r":"N","t":"れい。"},{"r":"M","t":"きょうは いい てんきですね。"},{"r":"F","t":"ええ、そうですね。"},{"r":"F","t":"ええ、てんきです。"},{"r":"F","t":"いいえ、ちがいます。"},{"r":"N","t":"いちばん いい ものは 1ばんです。"}]},"items":[{"n":1,"play":[{"r":"N","t":"1ばん。"},{"r":"F","t":"この しりょう、コピーしましょうか。"},{"r":"M","t":"はい、おねがいします。"},{"r":"M","t":"はい、コピーしました。"},{"r":"M","t":"いいえ、コピーします。"}],"q":"（へんじを えらんで ください）","c":["はい、コピーしました。","いいえ、コピーします。","はい、おねがいします。"],"a":2,"gap":8,"zh":"女：這份資料要我幫你影印嗎？","e":"「〜ましょうか」是<b>主動提議幫忙</b>，接受就說「はい、おねがいします」。<br>其他選項：「コピーしました」＝我印好了（<b>時態和主客都不對</b>）；「いいえ、コピーします」拒絕卻又說要印，前後矛盾。","hideChoices":true},{"n":2,"play":[{"r":"N","t":"2ばん。"},{"r":"M","t":"すみません、この へんに ゆうびんきょくは ありますか。"},{"r":"F","t":"あの ビルの となりに ありますよ。"},{"r":"F","t":"ゆうびんきょくへ 行きます。"},{"r":"F","t":"はい、ゆうびんきょくです。"}],"q":"（へんじを えらんで ください）","c":["あの ビルの となりに ありますよ。","ゆうびんきょくへ 行きます。","はい、ゆうびんきょくです。"],"a":0,"gap":8,"zh":"男：不好意思，這附近有郵局嗎？","e":"問「有沒有」，要回答<b>位置</b>。<br>其他選項：「ゆうびんきょくへ 行きます」是說自己要去（答非所問）；「はい、ゆうびんきょくです」是回答「這裡是哪裡」。<br><b>陷阱</b>：三個答案都有「ゆうびんきょく」，只有第一個回答到「在不在、在哪裡」。","hideChoices":true},{"n":3,"play":[{"r":"N","t":"3ばん。"},{"r":"F","t":"しゅくだいは いつまでですか。"},{"r":"M","t":"来週の 月よう日までです。"} <script>
/* ══════════════════════════════════════════════════════════════
   N5 模擬考（正式版）
   - 題目與選項都固定（paper-A.json 在產檔時就排好順序），所以不管哪台裝置、考幾次，內容都一樣。
   - 計分照正式 N5 的兩個得分區分：言語知識（文字語彙＋文法）・読解 120 分、聴解 60 分。
     合格 = 總分 ≥80 且 兩個區分都 ≥ 基準分（38／19）。
     正式考試用的是 IRT 尺度得点，複製不了，這裡用「答對題數 × 滿分 ÷ 題數」四捨五入，標示為參考分數。
   - 聴解：音檔一次播到底、不能重聽；題目全部列出來，播放中隨時可以改任何一題，自己按交卷。
   - 考試中重新整理 = 該份作廢（正式考試沒有第二次機會）。
   ══════════════════════════════════════════════════════════════ */
const PAPERS = {};
['A', 'B', 'C'].forEach(id => {
  const el = document.getElementById('paper-' + id);
  try{ PAPERS[id] = el ? JSON.parse(el.textContent) : {}; }catch(e){ PAPERS[id] = {}; }
});
const SAY = JSON.parse(document.getElementById('mf-say').textContent);
const AUDIO_BASE = 'audio/mockfull/';
const BREAK_SEC = 20 * 60;          /* 兩科之間的休息，依官方時程表 */
/* 說明→例題→第一題 之間要留白，不然會聽不出來從哪裡開始換段（2026-10-11 使用者要求） */
const P_OPENING = 1500, P_INSTR = 2000, P_EX = 2500;
const HIST_KEY = p => 'mf_hist_' + p;
const RUN_KEY = 'mf_running';
const MAXHIST = 20;

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s);
let paper = null, state = null, timer = null, player = null;

/* ───────── 小工具 ───────── */
function mmss(s){ s = Math.max(0, s|0); return (s/60|0) + ':' + String(s%60).padStart(2,'0'); }
function today(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function loadHist(id){ try{ return JSON.parse(localStorage.getItem(HIST_KEY(id))) || []; }catch(e){ return []; } }
function saveHist(id, list){ try{ localStorage.setItem(HIST_KEY(id), JSON.stringify(list.slice(0, MAXHIST))); }catch(e){} }
function allItems(p){
  const out = [];
  p.sections.forEach((sec, si) => sec.parts.forEach((part, pi) =>
    part.items.forEach((it, ii) => out.push({it, si, pi, ii, key: si+'-'+pi+'-'+ii}))));
  return out;
}
function show(view){
  ['home','exam','brk','result','review'].forEach(v => $(v).hidden = (v !== view));
  $('foot').hidden = true; $('foot').innerHTML = '';
  window.scrollTo(0, 0);
}
function foot(buttons){
  const f = $('foot'); f.innerHTML = ''; f.hidden = false;
  buttons.forEach(([label, cls, fn]) => {
    const b = document.createElement('button');
    b.textContent = label; if (cls) b.className = cls;
    b.addEventListener('click', fn); f.appendChild(b);
  });
}

/* ───────── 計分 ───────── */
function grade(p, ans){
  let a = 0, b = 0, aN = 0, bN = 0;
  const per = [];
  p.sections.forEach((sec, si) => sec.parts.forEach((part, pi) => part.items.forEach((it, ii) => {
    const k = si+'-'+pi+'-'+ii, got = ans[k], ok = (got === it.a);
    if (sec.key === 'choukai'){ bN++; if (ok) b++; } else { aN++; if (ok) a++; }
    per.push({k, ok, got});
  })));
  const sa = Math.round(a * 120 / aN), sb = Math.round(b * 60 / bN);
  const pass = (sa + sb) >= p.pass.total && sa >= p.pass.a && sb >= p.pass.b;
  return {a, aN, b, bN, sa, sb, total: sa + sb, pass, per};
}

/* ───────── 選卷頁 ───────── */
function renderHome(msg){
  const el = $('home');
  let h = '';
  if (msg) h += '<div class="rule"><b>' + msg + '</b></div>';
  h += '<div class="rule"><b>考試方式</b>'
     + '<ul><li>三科依序作答：文字・語彙 <b>20 分</b>、文法・読解 <b>40 分</b>、聴解（音檔播完為止）。</li>'
     + '<li>每科之間有 <b>20 分鐘</b>休息，可以跳過。</li>'
     + '<li>聴解的音檔<b>一次播到底、不能重聽</b>；播放中可以隨時回頭改任何一題，播完自己按交卷。</li>'
     + '<li>計分照正式考試：言語知識・読解 <b>120 分</b>、聴解 <b>60 分</b>，'
     + '合格是<b>總分 ≥80 且兩個區分都過基準分（38／19）</b>。</li>'
     + '<li>考試中重新整理或關掉分頁，該份<b>作廢</b>。</li></ul></div>';
  ['A','B','C'].forEach(id => {
    const p = PAPERS[id];
    if (!p || !p.sections){
      h += '<div class="paper off"><h2>' + id + ' 卷 <span class="note">（整理中）</span></h2>'
         + '<div class="meta">67 題 · 90 分鐘</div></div>';
      return;
    }
    const hist = loadHist(id);
    h += '<div class="paper"><h2>' + esc(p.name) + '</h2>'
       + '<div class="meta">' + p.sections.map(s => esc(s.label) + ' ' + s.n + ' 題').join(' · ')
       + ' · 共 67 題</div>'
       + '<button class="btn-primary" data-start="' + id + '">開始考試</button>'
       + '<div class="hist"><b>歷史紀錄</b>'
       + (hist.length ? ' <button class="clr" data-clear="' + id + '">清空紀錄</button>' : '');
    if (!hist.length) h += '<div class="none">還沒有考過。</div>';
    else {
      h += '<table>';
      hist.forEach((r, i) => {
        h += '<tr><td class="d">' + esc(r.date) + '</td>';
        if (r.void) h += '<td class="void" colspan="3">未完成（作廢）</td>';
        else h += '<td class="num">' + r.total + ' / 180</td>'
                + '<td class="' + (r.pass ? 'pass' : 'fail') + '">' + (r.pass ? '合格' : '不合格') + '</td>'
                + '<td style="text-align:right"><button data-review="' + id + ':' + i + '">看詳解</button></td>';
        h += '</tr>';
      });
      h += '</table>';
    }
    h += '</div></div>';
  });
  el.innerHTML = h;
  el.querySelectorAll('[data-start]').forEach(b => b.addEventListener('click', () => startExam(b.dataset.start)));
  el.querySelectorAll('[data-clear]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.clear;
    if (!confirm(id + ' 卷的歷史紀錄會全部刪掉，確定嗎？')) return;
    try{ localStorage.removeItem(HIST_KEY(id)); }catch(e){}
    renderHome(id + ' 卷的歷史紀錄已經清空。');
  }));
  el.querySelectorAll('[data-review]').forEach(b => b.addEventListener('click', () => {
    const [id, i] = b.dataset.review.split(':');
    openReview(id, loadHist(id)[+i]);
  }));
  show('home');
}

/* ───────── 題目畫面 ───────── */
function itemHTML(o, n, mode, ans, res){
  const it = o.it, k = o.key;
  const isEx = mode === 'ex';
  const hide = it.hideChoices && mode === 'exam';
  let h = '<div class="q' + (isEx ? ' exq' : '') + '" id="q-' + k + '"><div class="text">'
        + '<span class="no">' + n + (isEx ? '' : '.') + '</span> '
        + (isEx ? '<span class="extag">例題・不計分</span> ' : '');
  if (it.img) h += '</div><img class="qimg" src="' + esc(it.img) + '" alt="1〜4 の え">';
  else if (it.scene) h += '</div><div class="scene"><img src="' + esc(it.scene) + '" alt="場面"></div>';
  else h += esc(it.q) + '</div>';
  if (it.img || it.scene) h += '<div class="text" style="font-size:15px">' + esc(it.q) + '</div>';
  const fixed = (it.c.length === 4 && it.c[0] === '1');
  const cls = 'ch' + (fixed || hide ? (it.c.length === 3 ? ' row3' : ' row') : '');
  h += '<ol class="' + cls + '">';
  it.c.forEach((c, i) => {
    const sel = ans[k] === i;
    let bc = sel ? ' sel' : '';
    if (mode === 'review'){
      if (i === it.a) bc = ' ok';
      else if (sel) bc = ' ng';
    }
    if (isEx && i === it.a) bc = ' ok';
    const label = (hide && mode === 'exam') ? '' : esc(c);
    h += '<li><button class="' + bc + '" data-pick="' + k + ':' + i + '"'
       + (mode === 'review' || isEx ? ' disabled' : '') + '>'
       + '<span class="n">' + (i+1) + '</span>' + (fixed ? '' : '<span>' + label + '</span>') + '</button></li>';
  });
  h += '</ol>';
  if (isEx){
    h += '<div class="exp"><b>正解：' + (it.a + 1) + '</b>　'
       + '（這一題只是示範，旁白會公布答案，不列入分數）' + (it.zh ? '<br>' + esc(it.zh) : '') + '</div>';
  }
  if (mode === 'review'){
    if (it.play) h += '<button class="playone" data-replay="' + k + '">🔊 重聽這一題</button>';
    if (it.zh) h += '<div class="zh">' + esc(it.zh) + '</div>';
    h += '<div class="exp"><b>正解：' + (it.a + 1) + '</b>　' + it.e + '</div>';
  }
  return h + '</div>';
}

function renderSection(si, mode, ans, res){
  const sec = paper.sections[si];
  let h = '', n = 0, lastPass = null;
  sec.parts.forEach((part, pi) => {
    h += '<div class="part"><h3>' + esc(part.title) + '</h3><div class="instr">' + esc(part.instr) + '</div></div>';
    if (part.ex && mode !== 'review')
      h += itemHTML({it: part.ex, si, pi, ii: 'ex', key: si+'-'+pi+'-ex'}, '例', 'ex', ans, res);
    lastPass = null;
    part.items.forEach((it, ii) => {
      n++;
      if (it.pass && it.pass !== lastPass){ h += '<div class="pass">' + it.pass + '</div>'; lastPass = it.pass; }
      h += itemHTML({it, si, pi, ii, key: si+'-'+pi+'-'+ii}, n, mode, ans, res);
    });
  });
  return h;
}

function wirePicks(root, ans, onPick){
  root.querySelectorAll('[data-pick]').forEach(b => b.addEventListener('click', () => {
    const [k, i] = b.dataset.pick.split(':');
    ans[k] = +i;
    b.closest('ol').querySelectorAll('button').forEach(x => x.classList.remove('sel'));
    b.classList.add('sel');
    if (onPick) onPick();
  }));
}

/* ───────── 考試流程 ───────── */
function startExam(id){
  paper = PAPERS[id];
  state = {id, ans: {}, si: 0, started: today()};
  try{ localStorage.setItem(RUN_KEY, id); }catch(e){}
  runSection(0);
}

function runSection(si){
  state.si = si;
  const sec = paper.sections[si];
  show('exam');
  $('secname').textContent = '試験' + 'ⅠⅡⅢ'[si] + '　' + sec.label;
  $('secmeta').textContent = sec.n + ' 題';
  $('qbody').innerHTML = renderSection(si, 'exam', state.ans);
  wirePicks($('qbody'), state.ans, () => { if (sec.key === 'choukai') updateAnswered(); });
  if (sec.key === 'choukai') startListening(sec);
  else startTimed(sec);
}

function startTimed(sec){
  $('clock').hidden = false; $('prog').hidden = true; $('barwrap').hidden = true;
  let left = sec.min * 60;
  const tick = () => {
    $('clock').textContent = mmss(left);
    $('clock').classList.toggle('warn', left <= 60);
    if (left <= 0){ clearInterval(timer); finishSection(true); }
    left--;
  };
  tick();
  clearInterval(timer); timer = setInterval(tick, 1000);
  foot([['交卷，進入下一科', 'btn-danger', () => {
    if (confirm('交卷後就不能回到這一科，確定嗎？')) { clearInterval(timer); finishSection(false); }
  }]]);
}

function updateAnswered(){
  const sec = paper.sections[2];
  let done = 0;
  sec.parts.forEach((p, pi) => p.items.forEach((it, ii) => { if (state.ans['2-'+pi+'-'+ii] != null) done++; }));
  $('secmeta').textContent = '已作答 ' + done + ' / ' + sec.n + ' 題';
}

/* ── 聴解：一次播到底 ── */
function clipURL(r, t){
  const id = SAY[r + '|' + t];
  return id ? AUDIO_BASE + id + '.ogg' : null;
}
function playClip(r, t){
  return new Promise(res => {
    const u = clipURL(r, t);
    if (!u) return res();
    player.src = u;
    player.onended = player.onerror = () => res();
    const pr = player.play();
    if (pr && pr.catch) pr.catch(() => res());
  });
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
const si = (sec, part) => '2-' + sec.parts.indexOf(part);

async function startListening(sec){
  $('clock').hidden = true; $('prog').hidden = false; $('barwrap').hidden = false;
  updateAnswered();
  if (!player){ player = new Audio(); player.preload = 'auto'; }
  foot([['交卷，看成績', 'btn-danger', () => {
    if (confirm('交卷後就不能再作答，確定嗎？')) { state.stop = true; player.pause(); finishSection(false); }
  }]]);
  $('prog').textContent = '音檔載入中…';
  await preload(sec);
  const bn = document.createElement('div');
  bn.className = 'banner';
  bn.textContent = '現在播放的是考試說明與例題（不計分）—— 可以趁這個時候把音量調好。';
  $('qbody').prepend(bn);
  if (sec.opening){
    $('prog').textContent = '考試說明';
    await playClip('N', sec.opening);
    await sleep(P_OPENING);
  }
  const total = sec.parts.reduce((a, p) => a + p.items.length, 0);
  let n = 0;
  for (const part of sec.parts){
    if (state.stop) return;
    $('prog').textContent = part.title + '　說明';
    for (const l of part.instr_lines) { if (state.stop) return; await playClip(l.r, l.t); }
    if (state.stop) return;
    await sleep(P_INSTR);                       /* 說明唸完，停一下再進例題 */
    if (part.ex){
      $('prog').textContent = part.title + '　例題（不計分）';
      const exc = $('q-' + si(sec, part) + '-ex');
      if (exc) exc.scrollIntoView({behavior: 'smooth', block: 'center'});
      for (const l of part.ex.play){ if (state.stop) return; await (l.p ? sleep(l.p * 1000) : playClip(l.r, l.t)); }
      await sleep(P_EX);                        /* 例題公布答案後再停一下，才開始正式題 */
    }
    for (const it of part.items){
      if (state.stop) return;
      n++;
      if (bn.parentNode) bn.remove();
      $('prog').textContent = '第 ' + n + ' 題 / ' + total;
      $('bar').style.width = (n / total * 100) + '%';
      const card = $('q-2-' + sec.parts.indexOf(part) + '-' + part.items.indexOf(it));
      if (card) card.scrollIntoView({behavior: 'smooth', block: 'center'});
      for (const l of it.play){ if (state.stop) return; await (l.p ? sleep(l.p * 1000) : playClip(l.r, l.t)); }
      await sleep(it.gap * 1000);
    }
  }
  if (bn.parentNode) bn.remove();
  if (!state.stop && sec.closing){ await sleep(1500); await playClip('N', sec.closing); }
  if (!state.stop){
    $('prog').textContent = '音檔播完了，請按下面的「交卷」';
    $('bar').style.width = '100%';
  }
}
async function preload(sec){
  /* file:// 下 fetch 會被瀏覽器擋（而且本機開檔本來就不用預載），直接跳過 */
  if (location.protocol === 'file:') return;
  const urls = new Set();
  if (sec.opening){ const u = clipURL('N', sec.opening); if (u) urls.add(u); }
  if (sec.closing){ const u = clipURL('N', sec.closing); if (u) urls.add(u); }
  sec.parts.forEach(p => {
    p.instr_lines.forEach(l => { const u = clipURL(l.r, l.t); if (u) urls.add(u); });
    if (p.ex) p.ex.play.forEach(l => { if (l.p) return; const u = clipURL(l.r, l.t); if (u) urls.add(u); });
    p.items.forEach(it => it.play.forEach(l => { if (l.p) return; const u = clipURL(l.r, l.t); if (u) urls.add(u); }));
  });
  const list = [...urls]; let done = 0;
  await Promise.all(list.map(u => fetch(u).then(r => r.blob()).catch(() => null)
    .then(() => { done++; $('bar').style.width = (done / list.length * 100) + '%'; })));
  $('bar').style.width = '0%';
}

function finishSection(auto){
  clearInterval(timer);
  const next = state.si + 1;
  if (next >= paper.sections.length) return finishExam();
  if (auto) alert('時間到，自動交卷。');
  startBreak(next);
}

function startBreak(nextSi){
  show('brk');
  $('brknext').textContent = '下一科：試験' + 'ⅠⅡⅢ'[nextSi] + '　' + paper.sections[nextSi].label
    + (paper.sections[nextSi].key === 'choukai'
       ? '（聴解：音檔會一次播到底，請戴耳機；手機切到別的 App 或鎖螢幕音檔會停）' : '');
  let left = BREAK_SEC;
  const tick = () => {
    $('brkclock').textContent = mmss(left);
    if (left <= 0){ clearInterval(timer); runSection(nextSi); }
    left--;
  };
  tick();
  clearInterval(timer); timer = setInterval(tick, 1000);
  $('brkskip').onclick = () => { clearInterval(timer); runSection(nextSi); };
}

function finishExam(){
  clearInterval(timer);
  try{ localStorage.removeItem(RUN_KEY); }catch(e){}
  const res = grade(paper, state.ans);
  const rec = {date: today(), ans: state.ans, total: res.total, sa: res.sa, sb: res.sb, pass: res.pass};
  const hist = loadHist(state.id); hist.unshift(rec); saveHist(state.id, hist);
  renderResult(res, rec);
}

function renderResult(res, rec){
  show('result');
  const p = paper;
  $('result').innerHTML =
    '<div class="score"><div class="note">' + esc(p.name) + '　' + esc(rec.date) + '</div>'
    + '<div class="total">' + res.total + ' <span class="note">/ 180</span>'
    + '<span class="judge ' + (res.pass ? 'y' : 'n') + '">' + (res.pass ? '合格' : '不合格') + '</span></div>'
    + '<table><tr><th>得点区分</th><th>答對</th><th class="num">分數</th><th class="num">基準分</th><th></th></tr>'
    + '<tr><td>言語知識（文字・語彙・文法）・読解</td><td>' + res.a + ' / ' + res.aN + '</td>'
    + '<td class="num">' + res.sa + ' / 120</td><td class="num">' + p.pass.a + '</td>'
    + '<td class="' + (res.sa >= p.pass.a ? 'pass' : 'fail') + '">' + (res.sa >= p.pass.a ? '○' : '×') + '</td></tr>'
    + '<tr><td>聴解</td><td>' + res.b + ' / ' + res.bN + '</td>'
    + '<td class="num">' + res.sb + ' / 60</td><td class="num">' + p.pass.b + '</td>'
    + '<td class="' + (res.sb >= p.pass.b ? 'pass' : 'fail') + '">' + (res.sb >= p.pass.b ? '○' : '×') + '</td></tr>'
    + '</table>'
    + '<p class="note">合格條件：總分 ≥ ' + p.pass.total + ' 且兩個區分都達到基準分。'
    + '正式考試用的是尺度得点（IRT），這裡是用答對題數換算的參考分數。</p></div>';
  foot([['看詳解', 'btn-primary', () => openReview(state.id, rec)],
        ['回選卷頁', '', () => { paper = null; state = null; renderHome(); }]]);
}

/* ───────── 檢討 ───────── */
function openReview(id, rec){
  paper = PAPERS[id];
  const ans = rec.ans || {};
  const res = grade(paper, ans);
  let h = '<div class="score"><div class="note">' + esc(paper.name) + '　' + esc(rec.date) + '　'
        + '總分 ' + res.total + ' / 180　' + (res.pass ? '合格' : '不合格') + '</div>'
        + '<p class="note">正解用綠色、你選錯的用紅色標出來。聴解可以單題重聽。</p></div>';
  paper.sections.forEach((sec, si) => {
    h += '<div class="part"><h3>試験' + 'ⅠⅡⅢ'[si] + '　' + esc(sec.label) + '</h3></div>';
    h += renderSection(si, 'review', ans, res);
  });
  $('review').innerHTML = h;
  show('review');
  if (!player){ player = new Audio(); player.preload = 'auto'; }
  $('review').querySelectorAll('[data-replay]').forEach(b => b.addEventListener('click', async () => {
    const [si, pi, ii] = b.dataset.replay.split('-').map(Number);
    const it = paper.sections[si].parts[pi].items[ii];
    b.disabled = true; b.textContent = '🔊 播放中…';
    for (const l of it.play) if (!l.p) await playClip(l.r, l.t);   /* 檢討時不用等那段留白 */
    b.disabled = false; b.textContent = '🔊 重聽這一題';
  }));
  foot([['回選卷頁', 'btn-primary', () => { paper = null; renderHome(); }]]);
}

/* ───────── 啟動 ───────── */
(function init(){
  /* 每個大題的說明旁白：說明文字本身就是要唸的句子 */
  Object.values(PAPERS).forEach(p => {
    if (!p.sections) return;
    p.sections.forEach(sec => sec.parts.forEach(part => {
      part.instr_lines = [{r: 'N', t: part.instr}];
    }));
  });
  let msg = '';
  try{
    const running = localStorage.getItem(RUN_KEY);
    if (running){
      localStorage.removeItem(RUN_KEY);
      const hist = loadHist(running);
      hist.unshift({date: today(), void: true});
      saveHist(running, hist);
      msg = '上一次考到一半離開了，那一份已作廢（正式考試沒有第二次機會）。';
    }
  }catch(e){}
  window.addEventListener('beforeunload', e => {
    if (state && !$('exam').hidden){ e.preventDefault(); e.returnValue = ''; }
  });
  renderHome(msg);
})();
</script>
