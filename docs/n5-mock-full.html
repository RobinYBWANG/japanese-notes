<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N5 模擬考（正式版）</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  :root{
    --bg:#f7f5f0; --card:#ffffff; --ink:#2b2b2b; --sub:#6b6b6b;
    --accent:#c0392b; --accent2:#2e7d6b; --line:#e6e2d8;
    --jp:#1a3a5c; --shadow:0 1px 3px rgba(0,0,0,.07);
    --ok:#2e7d6b; --ng:#c0392b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Hiragino Sans","Noto Sans TC","Microsoft JhengHei",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.7;font-size:16px}
  .wrap{max-width:760px;margin:0 auto;padding:28px 20px 140px}
  h1{font-size:26px;margin:0 0 4px;color:var(--accent);letter-spacing:2px}
  .sub{color:var(--sub);font-size:14px;margin-bottom:22px}
  .homelnk{display:inline-block;font-size:13px;color:var(--sub);text-decoration:none;margin-bottom:16px}
  .homelnk:hover{color:var(--accent)}
  a{color:var(--jp)}
  button{font-family:inherit;font-size:15px;border:1px solid var(--line);background:#fff;
    color:var(--ink);border-radius:8px;padding:8px 16px;cursor:pointer}
  button:hover{background:#f0ece3}
  button:disabled{opacity:.45;cursor:default}
  .btn-primary{background:var(--jp);border-color:var(--jp);color:#fff;font-weight:700}
  .btn-primary:hover{background:#15304d}
  .btn-danger{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  .btn-danger:hover{background:#a33225}

  /* ── 選卷頁 ── */
  .paper{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
  .paper h2{margin:0 0 2px;font-size:20px;color:var(--jp)}
  .paper .meta{color:var(--sub);font-size:13px;margin-bottom:12px}
  .paper.off{opacity:.5}
  .hist{border-top:1px dashed var(--line);margin-top:12px;padding-top:10px;font-size:14px}
  .hist table{width:100%;border-collapse:collapse}
  .hist td{padding:4px 6px;border-bottom:1px solid #f0ece3}
  .hist td.d{color:var(--sub);font-size:13px;white-space:nowrap}
  .hist .pass{color:var(--ok);font-weight:700}
  .hist .fail{color:var(--ng);font-weight:700}
  .hist .void{color:var(--sub)}
  .hist .none{color:var(--sub);font-size:13px}
  .hist .clr{font-size:12px;padding:2px 10px;margin-left:8px;color:var(--sub)}
  .rule{background:#fffdf7;border:1px solid var(--line);border-left:4px solid var(--accent2);
    border-radius:0 8px 8px 0;padding:12px 16px;margin:18px 0;font-size:14px;color:#3a4750}
  .rule b{color:var(--jp)}
  .rule ul{margin:6px 0 0;padding-left:20px}

  /* ── 作答區 ── */
  .examtop{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0 8px;
    border-bottom:1px solid var(--line);margin-bottom:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .examtop .name{font-weight:700;color:var(--jp)}
  .clock{margin-left:auto;font-variant-numeric:tabular-nums;font-size:20px;font-weight:700;color:var(--jp)}
  .clock.warn{color:var(--accent)}
  .prog{margin-left:auto;font-size:14px;color:var(--sub)}
  .bar{height:6px;background:#e6e2d8;border-radius:3px;overflow:hidden;flex:1 1 100%;margin-top:4px}
  .bar i{display:block;height:100%;background:var(--accent2);width:0;transition:width .3s linear}

  .part{margin:26px 0 10px}
  .part h3{margin:0;font-size:17px;color:var(--accent);letter-spacing:1px}
  .part .instr{font-size:14px;color:var(--sub);margin-top:2px}
  .pass{background:#fffdf7;border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:12px 0;
    font-size:15px;line-height:2}
  .pass table.info{border-collapse:collapse;margin:8px 0;font-size:14px;width:100%}
  .pass table.info th,.pass table.info td{border:1px solid var(--line);padding:4px 8px;text-align:center}
  .q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;
    margin-bottom:12px;box-shadow:var(--shadow)}
  .q .no{display:inline-block;min-width:34px;font-weight:700;color:var(--accent);font-size:14px}
  .q .text{font-size:17px;line-height:1.9;margin-bottom:10px}
  .ul{text-decoration:underline;text-underline-offset:3px;font-weight:700;color:var(--jp)}
  .bk{display:inline-block;min-width:54px;border-bottom:1px solid var(--jp);text-align:center}
  .star{display:inline-block;min-width:54px;border-bottom:1px solid var(--accent);
    text-align:center;color:var(--accent);font-weight:700}
  .qimg{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px;
    margin:6px auto 10px;background:#fff}
  .scene img{display:block;max-width:300px;width:100%;height:auto;border:1px solid var(--line);
    border-radius:8px;margin:6px auto 10px;background:#fff}
  ol.ch{list-style:none;margin:0;padding:0;display:grid;gap:7px}
  ol.ch.row{grid-template-columns:repeat(4,1fr)}
  ol.ch.row3{grid-template-columns:repeat(3,1fr)}
  ol.ch li button{width:100%;text-align:left;display:flex;gap:8px;align-items:flex-start;line-height:1.6}
  ol.ch.row li button,ol.ch.row3 li button{justify-content:center}
  ol.ch .n{color:var(--sub);font-weight:700;flex:0 0 auto}
  ol.ch li button.sel{border-color:var(--jp);background:#eaf1f8;font-weight:700}
  ol.ch li button.ok{border-color:var(--ok);background:#eaf7f2}
  ol.ch li button.ng{border-color:var(--ng);background:#fdeeee}
  .exp{margin-top:10px;padding:10px 12px;background:#fbf9f4;border-left:3px solid var(--accent2);
    border-radius:0 6px 6px 0;font-size:14px;line-height:1.9;color:#3a4750}
  .exp b{color:var(--jp)}
  .zh{font-size:14px;color:#3a4750;margin-top:8px;padding:8px 12px;background:#f4f7f5;border-radius:6px}
  .playone{font-size:13px;padding:4px 10px;margin-top:8px}
  .q.exq{background:#fbf9f4;border-style:dashed}
  .q.exq .no{color:var(--accent2)}
  .extag{display:inline-block;font-size:12px;font-weight:700;color:var(--accent2);
    border:1px solid var(--accent2);border-radius:999px;padding:0 8px;margin-left:8px}
  .banner{background:#eaf1f8;border:1px solid var(--jp);border-radius:8px;padding:10px 14px;
    margin-bottom:14px;font-size:14px;color:var(--jp);font-weight:700}

  /* ── 休息 ── */
  .center{text-align:center;padding:60px 0}
  .big{font-size:52px;font-weight:700;color:var(--jp);font-variant-numeric:tabular-nums;letter-spacing:2px}
  .brkmusic{max-width:560px;margin:18px auto 6px}
  .brkmusic h3{margin:0 0 10px;font-size:18px;color:var(--jp)}
  .brkmusic .yt{position:relative;padding-top:56.25%;border-radius:10px;overflow:hidden;background:#000}
  .brkmusic iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

  /* ── 成績 ── */
  .score{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;
    box-shadow:var(--shadow);margin-bottom:16px}
  .score .total{font-size:34px;font-weight:700;color:var(--jp)}
  .score table{width:100%;border-collapse:collapse;margin-top:12px;font-size:15px}
  .score th,.score td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left}
  .score td.num{text-align:right;font-variant-numeric:tabular-nums}
  .judge{display:inline-block;padding:4px 14px;border-radius:999px;font-weight:700;margin-left:10px}
  .judge.y{background:#eaf7f2;color:var(--ok);border:1px solid var(--ok)}
  .judge.n{background:#fdeeee;color:var(--ng);border:1px solid var(--ng)}
  .foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
    padding:10px 16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;z-index:30}
  .note{font-size:13px;color:var(--sub)}
  @media(max-width:520px){
    .wrap{padding:20px 14px 150px}
    ol.ch.row{grid-template-columns:repeat(2,1fr)}
    .big{font-size:40px}
  }
</style>

<div class="wrap">
  <a class="homelnk" href="index.html">🏠 首頁</a>
  <h1>N5 模擬考（正式版）</h1>
  <div class="sub" id="sub">比照正式考試的題數、時間與流程</div>

  <!-- ══ 選卷頁 ══ -->
  <div id="home"></div>

  <!-- ══ 作答 ══ -->
  <div id="exam" hidden>
    <div class="examtop">
      <span class="name" id="secname"></span>
      <span id="secmeta" class="note"></span>
      <span class="clock" id="clock"></span>
      <span class="prog" id="prog"></span>
      <span class="bar" id="barwrap" hidden><i id="bar"></i></span>
    </div>
    <div id="qbody"></div>
  </div>

  <!-- ══ 休息 ══ -->
  <div id="brk" hidden>

        <div class="yt" id="brkyt"></div>

      <p class="note">正式考試兩科之間會休息（含收發考卷）。不想等可以直接跳過。</p>
      <button class="btn-primary" id="brkskip">跳過休息，直接開始</button>
    </div>
  </div>

  <!-- ══ 成績 ══ -->
  <div id="result" hidden></div>

  <!-- ══ 檢討 ══ -->
  <div id="review" hidden></div>

<script id="paper-A" type="application/json">{"id":"A","name":"A 卷","pass":{"total":80,"a":38,"b":19},"sections":[{"key":"moji","label":"言語知識（文字・語彙）","min":20,"parts":[{"no":1,"title":"問題1","instr":"＿＿の ことばは ひらがなで どう 書きますか。1・2・3・4から いちばん いい ものを 一つ えらんで ください。","items":[{"q":"<span class=\"ul\">母</span>は りょうりが 上手です。","c":["はは","ちち","あね","あに"],"a":0,"e":"母＝はは，對外講自己的媽媽。<br>其他選項：ちち＝父（爸爸）、あね＝姉（姊姊）、あに＝兄（哥哥）。<br><b>容易選錯的地方</b>：はは／ちち 這一對很常一起出。講別人的媽媽、或在家裡叫媽媽，要用 お母さん（おかあさん）。"},{"q":"じゅぎょうは <span class=\"ul\">午後</span> 一時からです。","c":["ごぜん","ごご","ごこ","こご"],"a":1,"e":"午後＝ごご（下午）。<br>其他選項：ごぜん＝午前（上午）、ごこ・こご 不是詞。<br><b>容易選錯的地方</b>：午前／午後 只差一個字，意思卻相反；「午」單獨唸 ご，不要受到「牛（うし）」的字形影響。"},{"q":"ゆうびんきょくは <span class=\"ul\">左</span>に あります。","c":["みぎ","さ","ひだり","ちだり"],"a":2,"e":"左＝ひだり。<br>其他選項：みぎ＝右（相反方向）、さ 是音讀（左右＝さゆう 才會這樣唸）、ちだり 不是詞。<br><b>容易選錯的地方</b>：左右兩個字形很像，記法是「左」裡面有「工」、「右」裡面有「口」。"},{"q":"<span class=\"ul\">十日</span>に 国へ かえります。","c":["じゅうにち","とうか","じゅうか","とおか"],"a":3,"e":"十日＝とおか（十號／十天）。<br>其他選項：じゅうにち・じゅうか・とうか 都不是正確唸法。<br><b>容易選錯的地方</b>：一號到十號的唸法全部是特殊的 —— ついたち、ふつか、みっか、よっか、いつか、むいか、なのか、ようか、ここのか、とおか，只能整組背。十四日（じゅうよっか）、二十日（はつか）也是特例。"},{"q":"けさから <span class=\"ul\">雨</span>が ふって います。","c":["あめ","あま","う","ゆき"],"a":0,"e":"雨＝あめ。<br>其他選項：ゆき＝雪、う 是音讀（雨天＝うてん）、あま 只出現在 雨水（あまみず）這種複合詞裡。<br><b>容易選錯的地方</b>：「あめ」還有「飴（糖果）」的意思，兩個同音不同漢字，看漢字判斷就不會錯。"},{"q":"まいばん 七時に ばんごはんを <span class=\"ul\">食べます</span>。","c":["しょくべます","たべます","たばます","のべます"],"a":1,"e":"食べます＝たべます。<br>其他選項：しょく 是音讀（食堂＝しょくどう）、たばます・のべます 不是詞。<br><b>容易選錯的地方</b>：同一個「食」字，單獨當動詞唸訓讀 た，放進詞裡唸音讀 しょく（食事・食堂）。"},{"q":"友だちが うちへ <span class=\"ul\">来ます</span>。","c":["らいます","くます","きます","いきます"],"a":2,"e":"来ます＝きます（來）。<br>其他選項：いきます＝行きます（去，方向相反）、らい 是音讀（来月＝らいげつ）、くます 不是詞。<br><b>容易選錯的地方</b>：来ます 是不規則動詞，ます形唸 き、辭書形唸 くる、否定唸 こない，三種唸法都不一樣，要整組記。"}]},{"no":2,"title":"問題2","instr":"＿＿の ことばは どう 書きますか。1・2・3・4から いちばん いい ものを 一つ えらんで ください。","items":[{"q":"きのう <span class=\"ul\">ともだち</span>と 会いました。","c":["有だち","方だち","反だち","友だち"],"a":3,"e":"友だち（ともだち）＝朋友。<br>其他選項：有・方・反 都是和「友」長得像的字，湊成的詞都不存在。<br><b>容易選錯的地方</b>：「友」和「有」上半部一樣，差在下面 —— 友 是「又」、有 是「月」。N5 考卷習慣寫成 友だち。"},{"q":"その <span class=\"ul\">ほん</span>を 見せて ください。","c":["本","木","体","休"],"a":0,"e":"本（ほん）＝書。<br>其他選項：木＝き（樹）、体＝からだ（身體）、休＝やすみ（休息）。<br><b>容易選錯的地方</b>：「本」就是「木」多一橫，「休」是人字旁加木，四個字都繞著「木」打轉。"},{"q":"<span class=\"ul\">みぎ</span>の 手を 上げて ください。","c":["石","右","左","名"],"a":1,"e":"右（みぎ）＝右邊。<br>其他選項：石＝いし（石頭）、左＝ひだり（左邊，方向相反）、名＝な（名前 的名）。<br><b>容易選錯的地方</b>：右 和 左 上半部一樣，差在下面 —— 右 是「口」、左 是「工」。石 只差一撇，也常拿來混。"},{"q":"大きい こえで <span class=\"ul\">くち</span>を あけて ください。","c":["日","目","口","田"],"a":2,"e":"口（くち）＝嘴巴。<br>其他選項：日＝ひ（太陽、日子）、目＝め（眼睛）、田＝た（田）。<br><b>容易選錯的地方</b>：這四個字都是方框，差別只在裡面有沒有橫線、幾條橫線 —— 口沒有、日一條、目兩條。"},{"q":"なつやすみに <span class=\"ul\">かわ</span>で およぎます。","c":["州","山","水","川"],"a":3,"e":"川（かわ）＝河。<br>其他選項：州＝しゅう（州）、山＝やま、水＝みず。<br><b>容易選錯的地方</b>：川 是三條直線；州 是在三條線中間多了點，字形很像但不是河。"}]},{"no":3,"title":"問題3","instr":"（　）に 何を 入れますか。1・2・3・4から いちばん いい ものを 一つ えらんで ください。","items":[{"q":"あついですから、エアコンを <span class=\"bk\">　　</span>。","c":["つけます","けします","あけます","しめます"],"a":0,"e":"電器要「打開」用 つけます。<br>其他選項：けします＝關掉（電器）、あけます＝打開（門窗）、しめます＝關（門窗）。<br><b>容易選錯的地方</b>：中文都說「開」，日文卻分成兩組 —— <b>電器</b>用 つける／けす、<b>門窗</b>用 あける／しめる。"},{"q":"きってを はって、てがみを <span class=\"bk\">　　</span>。","c":["入れます","出します","あけます","もらいます"],"a":1,"e":"信要「寄出」用 出します。<br>其他選項：入れます＝放進去、あけます＝打開、もらいます＝收到（方向相反）。<br><b>容易選錯的地方</b>：「ポストに 入れます」（投進郵筒）也說得通，但整句是「貼了郵票之後」，指的是寄出這個動作，所以 出します 才完整。"},{"q":"おふろに <span class=\"bk\">　　</span>から、ねます。","c":["出て","のって","入って","あがって"],"a":2,"e":"泡澡是「おふろに 入ります」。<br>其他選項：出て＝出來、のって＝搭乘、あがって＝上去。<br><b>容易選錯的地方</b>：おふろ 要配 に＋入る，不是 を；「おふろを 出ます」才是洗完出來。"},{"q":"この じしょは <span class=\"bk\">　　</span>ですから、よく つかいます。","c":["ゆうめい","しずか","げんき","べんり"],"a":3,"e":"字典好用＝べんり（方便）。<br>其他選項：ゆうめい＝有名、しずか＝安靜、げんき＝有精神，都不能拿來形容字典好不好用。<br><b>容易選錯的地方</b>：四個都是な形容詞，光看詞性分不出來，要看前面的名詞「じしょ」和後面的「よく つかいます」。"},{"q":"たんじょうびに 友だちから プレゼントを <span class=\"bk\">　　</span>。","c":["もらいました","あげました","かしました","おくりました"],"a":0,"e":"「友だちから」＝從朋友那裡，所以是收到 → もらいました。<br>其他選項：あげました＝給出去、かしました＝借出、おくりました＝寄送，方向都相反。<br><b>容易選錯的地方</b>：看助詞判斷方向 —— <b>から／に＋もらう</b>是進來、<b>に＋あげる</b>是出去。"},{"q":"きょうは しごとが <span class=\"bk\">　　</span>ですから、はやく かえります。","c":["いそがしい","ひま","たいへん","だいじ"],"a":1,"e":"沒事做＝ひま，才能早點回家。<br>其他選項：いそがしい＝忙（那就不能早回家）、たいへん＝辛苦、だいじ＝重要。<br><b>容易選錯的地方</b>：ひま 是な形容詞、いそがしい 是い形容詞，後面都接 ですから，從詞形看不出來，要靠「早く 帰ります」這個結果反推。"}]},{"no":4,"title":"問題4","instr":"＿＿の ぶんと だいたい 同じ いみの ぶんが あります。1・2・3・4から いちばん いい ものを 一つ えらんで ください。","items":[{"q":"きょうは 学校を <span class=\"ul\">休みました</span>。","c":["きょうは 学校で べんきょうしました。","きょうは 学校が ありました。","きょうは 学校へ 行きませんでした。","きょうは 学校まで あるきました。"],"a":2,"e":"「学校を 休みます」＝請假不去學校＝学校へ 行きませんでした。<br>其他選項：2 在學校唸書、3 有課、4 走路到學校，都代表人有去，意思相反。<br><b>容易選錯的地方</b>：「休みます」看起來像「休息」，但接在「学校を」後面是<b>缺席</b>的意思，助詞用 を。"},{"q":"ここは <span class=\"ul\">でぐち</span>です。","c":["ここから 中へ 入ります。","ここで きっぷを 買います。","ここで 電車を まちます。","ここから 外へ 出ます。"],"a":3,"e":"出口＝從這裡出去。<br>其他選項：2 是入口（いりぐち）、3 是售票處、4 是月台，都不是出口。<br><b>容易選錯的地方</b>：出口／入口 的漢字只差一個字，「出」是往外、「入」是往內，可以配合動詞 出ます／入ります 一起記。"},{"q":"きのうは <span class=\"ul\">あめ</span>でした。","c":["きのう あめが ふりました。","きのう あめが ふりませんでした。","きのうは いい 天気でした。","きのう ゆきが ふりました。"],"a":0,"e":"「あめでした」＝那天是雨天＝下了雨。<br>其他選項：2 是沒下雨（否定）、3 是好天氣（相反）、4 下的是雪不是雨。<br><b>容易選錯的地方</b>：名詞句「〜でした」和動詞句「〜が ふりました」講的是同一件事，考的就是會不會把兩種說法對起來。"}]}],"n":21},{"key":"bunpou","label":"言語知識（文法）・読解","min":40,"parts":[{"no":1,"title":"問題1","instr":"（　）に 何を 入れますか。1・2・3・4から いちばん いい ものを 一つ えらんで ください。","items":[{"q":"この かばんは 五千円<span class=\"bk\">　　</span> 買いました。","c":["に","で","を","が"],"a":1,"e":"花多少錢買的，金額用 <b>で</b>（表示手段・範圍）。<br>其他選項：に 是時間或到達點、を 是受詞（かばんを 買いました）、が 是主語。<br><b>同類對照</b>：「二人で 行きます」（以兩個人的狀態）、「百円で 買えます」（用一百圓就買得到），都是同一個「範圍・手段」的 で。"},{"q":"田中さんは きょう 学校<span class=\"bk\">　　</span> 休みました。","c":["に","で","を","へ"],"a":2,"e":"「〜を 休みます」是固定用法，請假缺席的對象用 を。<br>其他選項：に 是時間（一時に）、で 是場所（学校で べんきょうします）、へ 是方向（学校へ 行きます）。<br><b>同類對照</b>：同樣用 を 但不是受詞的還有「公園を 散歩します」「電車を おります」。"},{"q":"あしたは 雨が ふります<span class=\"bk\">　　</span>、かさを もって 行きます。","c":["が","まで","でも","から"],"a":3,"e":"前面是理由、後面是結果 → <b>から</b>（因為…所以…）。<br>其他選項：が＝但是（前後要相反）、まで＝到…為止、でも＝但是（放句首）。<br><b>同類對照</b>：から 放在<b>理由</b>後面，ので 也是理由但語氣客氣；が 和 でも 都是轉折，這句前後不矛盾所以不能用。"},{"q":"この もんだいは かんたん<span class=\"bk\">　　</span>、すぐ できました。","c":["で","くて","だから","なので"],"a":0,"e":"な形容詞要接下一句時用 <b>で</b>：かんたんで、すぐ できました。<br>其他選項：くて 是<b>い形容詞</b>的接法（やすくて おいしい）、だから・なので 是普通形的用法，不能直接接在「かんたん」後面當連接。<br><b>同類對照</b>：い形容詞 → 〜くて（おいしくて）、な形容詞・名詞 → 〜で（しずかで／学生で）。"},{"q":"リンさんは 日本語<span class=\"bk\">　　</span> 上手です。","c":["を","が","に","で"],"a":1,"e":"「〜が 上手です／下手です／好きです／きらいです」的對象一律用 <b>が</b>。<br>其他選項：を 用在動詞的受詞，但 上手 是形容詞不是動詞；に 是對象或時間；で 是手段。<br><b>同類對照</b>：同一組還有「〜が わかります」「〜が できます」「〜が ほしいです」，中文都會講成「把／對」，日文卻一律是 が。"},{"q":"まだ 子どもですから、おさけを 飲む こと<span class=\"bk\">　　</span> できません。","c":["を","に","が","は"],"a":2,"e":"「辭書形＋ことが できます」是固定句型，中間一定是 <b>が</b>。<br>其他選項：を 是受詞（おさけを 飲む 那一段已經用過了）、に 是對象、は 是主題。<br><b>同類對照</b>：「ことが できます」＝能力或許可，和 ⑤ 的「〜が 上手です」一樣，能力相關的句型都站在 が 這一邊。"},{"q":"この 車は 父<span class=\"bk\">　　</span> もらいました。","c":["を","が","で","に"],"a":3,"e":"もらいます 的「給的人」用 <b>に</b>（也可以用 から）。<br>其他選項：を 是收到的東西（車を）、が 是主語、で 是手段。<br><b>同類對照</b>：あげます 的對象也是 に，但方向相反（東西從我這裡出去）；對方是公司、學校這種團體時 もらう 只能用 から。"},{"q":"わたしは あさごはんを 食べない<span class=\"bk\">　　</span>、会社へ 行きました。","c":["で","くて","ので","から"],"a":0,"e":"「ない形＋で」＝沒有做…就…。食べないで 行きました＝沒吃早餐就去上班。<br>其他選項：くて 是い形容詞的接法；ので・から 是理由，接在 ない 後面會變成「因為不吃所以去公司」，意思不通。<br><b>同類對照</b>：なくて 也接得上，但那是<b>原因</b>（食べなくて、おなかが すきました＝因為沒吃所以餓），這句講的是<b>狀態</b>，所以用 ないで。"},{"q":"この へやは とても しずかです<span class=\"bk\">　　</span>、すこし せまいです。","c":["から","が","ので","そして"],"a":1,"e":"安靜是優點、狹小是缺點，前後相反 → <b>が</b>（但是）。<br>其他選項：から・ので 是理由（安靜不是狹小的原因）、そして 是順著接下去，要放句首而且前後不能矛盾。<br><b>同類對照</b>：が 接在<b>句尾</b>；放句首的轉折是 でも／しかし。"}]},{"no":2,"title":"問題2","instr":"★に 入る ものは どれですか。1・2・3・4から いちばん いい ものを 一つ えらんで ください。","items":[{"q":"田中さんは <span class=\"bk\">　　</span> <span class=\"bk\">　　</span> <span class=\"star\">★</span> <span class=\"bk\">　　</span> です。","c":["せが","高くて","かみが","ながい"],"a":2,"e":"正しい順序：田中さんは <b>せが 高くて かみが ながい</b>です。＝田中先生個子高、頭髮長。<br>い形容詞要接下一句用て形（高い → 高くて）；兩個特徵各自有自己的主語，所以用兩個 が。<br>★的位置是第三格，答案是「かみが」。"},{"q":"わたしは <span class=\"bk\">　　</span> <span class=\"bk\">　　</span> <span class=\"star\">★</span> <span class=\"bk\">　　</span> ことが あります。","c":["いちど","日本で","すしを","食べた"],"a":2,"e":"正しい順序：わたしは <b>いちど 日本で すしを 食べた</b> ことが あります。＝我在日本吃過一次壽司。<br>「た形＋ことが あります」＝有過…的經驗，所以最後一格一定是 食べた。次數（いちど）放最前面、場所（日本で）在受詞（すしを）前面。<br>★的位置是第三格，答案是「すしを」。"},{"q":"すみません、<span class=\"bk\">　　</span> <span class=\"bk\">　　</span> <span class=\"star\">★</span> <span class=\"bk\">　　</span> ください。","c":["もう","すこし","ゆっくり","話して"],"a":2,"e":"正しい順序：すみません、<b>もう すこし ゆっくり 話して</b> ください。＝不好意思，請再說慢一點。<br>「もう すこし」是一組（再一點點），後面接副詞 ゆっくり，最後是「て形＋ください」。<br>★的位置是第三格，答案是「ゆっくり」。"},{"q":"きょうは <span class=\"bk\">　　</span> <span class=\"bk\">　　</span> <span class=\"star\">★</span> <span class=\"bk\">　　</span> かえります。","c":["しごとが","ありませんから","はやく","うちへ"],"a":2,"e":"正しい順序：きょうは <b>しごとが ありませんから はやく うちへ</b> かえります。＝今天沒工作，所以早點回家。<br>から 前面是理由，後面是結果；結果的部分依序是 副詞（早く）→ 方向（うちへ）→ 動詞。<br>★的位置是第三格，答案是「はやく」。"}]},{"no":3,"title":"問題3","instr":"つぎの 文章を 読んで、【　】に 入る ものを1・2・3・4から 一つ えらんで ください。","items":[{"pass":"わたしは 先月 日本へ 来ました。いまは 大学の ちかくの アパートに 【1】 います。<br>へやは あまり ひろく ありませんが、まどから 山が 見えて、あさは とりの こえが 聞こえます。<br>まいあさ 六時に おきて、ちかくの こうえんを さんぽ 【2】 から、大学へ 行きます。じゅぎょうは 九時からですが、わたしは いつも 八時半ごろ きょうしつに つきます。<br>日本語の べんきょうは やさしく ありません。かんじも たくさん おぼえなければ なりません。【3】、先生も クラスの 友だちも しんせつですから、まいにち たのしいです。<br>来月は 友だちと いっしょに きょうとへ 行きます。きょうとは はじめてですから、いまから とても 行き【4】です。","passZh":"我上個月來到日本。現在住在大學附近的公寓。房間不太寬敞，但從窗戶看得到山，早上聽得到鳥叫聲。每天早上六點起床，在附近的公園散步之後去大學。課是九點開始，但我總是八點半左右就到教室。日文不好學，漢字也得背很多。不過老師和班上的朋友都很親切，所以每天都很開心。下個月要和朋友一起去京都。京都我是第一次去，所以現在就非常想去。（【1】＝すんで、【2】＝して、【3】＝でも、【4】＝たい）","q":"【1】","c":["すみ","すむ","すんで","すんだ"],"a":2,"e":"「〜て います」表示<b>持續的狀態</b>（住在某處），前面一定接て形：すむ → すんで。<br>其他選項：すみ 是ます形的語幹、すむ 是辭書形、すんだ 是た形，都接不上 います。<br><b>答案在哪一句</b>：第一段「アパートに 【1】 います」—— 看到 います 就知道要て形。"},{"pass":"わたしは 先月 日本へ 来ました。いまは 大学の ちかくの アパートに 【1】 います。<br>へやは あまり ひろく ありませんが、まどから 山が 見えて、あさは とりの こえが 聞こえます。<br>まいあさ 六時に おきて、ちかくの こうえんを さんぽ 【2】 から、大学へ 行きます。じゅぎょうは 九時からですが、わたしは いつも 八時半ごろ きょうしつに つきます。<br>日本語の べんきょうは やさしく ありません。かんじも たくさん おぼえなければ なりません。【3】、先生も クラスの 友だちも しんせつですから、まいにち たのしいです。<br>来月は 友だちと いっしょに きょうとへ 行きます。きょうとは はじめてですから、いまから とても 行き【4】です。","passZh":"我上個月來到日本。現在住在大學附近的公寓。房間不太寬敞，但從窗戶看得到山，早上聽得到鳥叫聲。每天早上六點起床，在附近的公園散步之後去大學。課是九點開始，但我總是八點半左右就到教室。日文不好學，漢字也得背很多。不過老師和班上的朋友都很親切，所以每天都很開心。下個月要和朋友一起去京都。京都我是第一次去，所以現在就非常想去。（【1】＝すんで、【2】＝して、【3】＝でも、【4】＝たい）","q":"【2】","c":["し","する","した","して"],"a":3,"e":"「〜て から」＝做完…之後，前面接<b>て形</b>。さんぽする → さんぽして。<br>其他選項：し・する・した 都接不上 から（「〜てから」是固定組合）。<br><b>容易搞混的</b>：「〜から」接在<b>句尾</b>是理由（九時からですが 的 から 又是另一回事 ——那是「從…開始」）。同一個 から 有三種用法，靠前面接什麼分辨。"},{"pass":"わたしは 先月 日本へ 来ました。いまは 大学の ちかくの アパートに 【1】 います。<br>へやは あまり ひろく ありませんが、まどから 山が 見えて、あさは とりの こえが 聞こえます。<br>まいあさ 六時に おきて、ちかくの こうえんを さんぽ 【2】 から、大学へ 行きます。じゅぎょうは 九時からですが、わたしは いつも 八時半ごろ きょうしつに つきます。<br>日本語の べんきょうは やさしく ありません。かんじも たくさん おぼえなければ なりません。【3】、先生も クラスの 友だちも しんせつですから、まいにち たのしいです。<br>来月は 友だちと いっしょに きょうとへ 行きます。きょうとは はじめてですから、いまから とても 行き【4】です。","passZh":"我上個月來到日本。現在住在大學附近的公寓。房間不太寬敞，但從窗戶看得到山，早上聽得到鳥叫聲。每天早上六點起床，在附近的公園散步之後去大學。課是九點開始，但我總是八點半左右就到教室。日文不好學，漢字也得背很多。不過老師和班上的朋友都很親切，所以每天都很開心。下個月要和朋友一起去京都。京都我是第一次去，所以現在就非常想去。（【1】＝すんで、【2】＝して、【3】＝でも、【4】＝たい）","q":"【3】","c":["でも","そして","だから","それから"],"a":0,"e":"前面說「日文不好學、漢字要背很多」，後面說「每天很開心」，<b>前後相反</b> → でも。<br>其他選項：そして・それから 是順著接下去、だから 是因果（不好學 ≠ 很開心的原因）。<br><b>答案在哪一句</b>：第三段。判斷關鍵是前一句是負面、後一句是正面。"},{"pass":"わたしは 先月 日本へ 来ました。いまは 大学の ちかくの アパートに 【1】 います。<br>へやは あまり ひろく ありませんが、まどから 山が 見えて、あさは とりの こえが 聞こえます。<br>まいあさ 六時に おきて、ちかくの こうえんを さんぽ 【2】 から、大学へ 行きます。じゅぎょうは 九時からですが、わたしは いつも 八時半ごろ きょうしつに つきます。<br>日本語の べんきょうは やさしく ありません。かんじも たくさん おぼえなければ なりません。【3】、先生も クラスの 友だちも しんせつですから、まいにち たのしいです。<br>来月は 友だちと いっしょに きょうとへ 行きます。きょうとは はじめてですから、いまから とても 行き【4】です。","passZh":"我上個月來到日本。現在住在大學附近的公寓。房間不太寬敞，但從窗戶看得到山，早上聽得到鳥叫聲。每天早上六點起床，在附近的公園散步之後去大學。課是九點開始，但我總是八點半左右就到教室。日文不好學，漢字也得背很多。不過老師和班上的朋友都很親切，所以每天都很開心。下個月要和朋友一起去京都。京都我是第一次去，所以現在就非常想去。（【1】＝すんで、【2】＝して、【3】＝でも、【4】＝たい）","q":"【4】","c":["たいで","たい","ほしい","ましょう"],"a":1,"e":"「ます形＋たいです」＝想做…。行きます → 行きたいです。<br>其他選項：たいで 形態不對；ほしい 要接名詞（京都が ほしい 意思完全不同）；ましょう 是邀約，主語不能是「わたし一個人的心情」。<br><b>答案在哪一句</b>：最後一句「いまから とても 行き【4】です」。"}]},{"no":4,"title":"問題4","instr":"つぎの 文を 読んで、しつもんに こたえて ください。こたえは 1・2・3・4から いちばん いい ものを 一つ えらんで ください。","items":[{"pass":"（会社の つくえの 上に メモが あります）<br>「山田さん<br>　きょうの かいぎは ちゅうしに なりました。<br>　来週の 月よう日の おなじ 時間に します。<br>　しりょうは そのままで いいです。　　田中」","passZh":"（公司桌上有一張便條）「山田先生：今天的會議取消了。改到下週一的同一時間。資料維持原樣就可以了。 田中」","q":"山田さんは きょう 何を しますか。","c":["かいぎに 出ます。","しりょうを つくりなおします。","かいぎには 出ません。","田中さんに 電話します。"],"a":2,"e":"「中止に なりました」＝取消了，所以今天沒有會議。<br>其他選項：2 和取消矛盾；3 便條說「そのままで いい」＝不用改；4 便條沒有要他回電。<br><b>答案在哪一句</b>：第二行「きょうの 会議は 中止に なりました」。"},{"pass":"わたしは コーヒーが すきです。でも、よる 飲むと ねむれません。<br>ですから、よるは おちゃを 飲みます。おちゃの 中でも、あまり つよく ない ものを えらびます。","passZh":"我喜歡咖啡。不過晚上喝了會睡不著。所以晚上我喝茶。茶裡面也會挑不太濃的。","q":"この 人は よる 何を 飲みますか。","c":["コーヒー","つよい おちゃ","何も 飲みません","あまり つよく ない おちゃ"],"a":3,"e":"最後兩句：晚上喝茶，而且挑不濃的。<br>其他選項：2 咖啡晚上喝了會睡不著（被否定）、3 和「つよく ない」相反、4 文章沒說不喝。<br><b>答案在哪一句</b>：第三、四句「よるは お茶を 飲みます」「あまり つよく ない ものを えらびます」。"}]},{"no":5,"title":"問題5","instr":"つぎの 文章を 読んで、しつもんに こたえて ください。こたえは 1・2・3・4から いちばん いい ものを 一つ えらんで ください。","items":[{"pass":"わたしは 先月 この まちに ひっこして きました。<br>まえに すんで いた まちは えきが ちかくて、買いものも べんりでしたが、いつも 人が 多くて、休みの 日も しずかに 休む ことが できませんでした。<br>いまの まちは えきまで あるいて 二十分 かかります。大きい 店も ちかくに ありませんから、買いものは 週に 一かい、車で 行きます。<br>でも、まわりに 山が 見えて、空気が とても きれいです。あさ はやく おきて、まどを あけると、とりの こえが 聞こえます。よるは くらいですが、ほしが たくさん 見えます。<br>ふべんな ことも ありますが、わたしは この まちが すきに なりました。来年は この まちで 小さい 店を はじめたいと おもって います。","passZh":"我上個月搬到這個城鎮。之前住的城鎮車站很近、買東西也方便，但人總是很多，連假日都沒辦法安靜地休息。現在的城鎮走到車站要二十分鐘，附近也沒有大店，所以買東西是一週一次開車去。不過周圍看得到山，空氣非常乾淨。早上早起打開窗戶，聽得到鳥叫聲。晚上雖然很暗，卻看得到很多星星。雖然有不方便的地方，我卻喜歡上了這個城鎮。明年想在這個城鎮開一家小店。","q":"まえの まちは どんな まちでしたか。","c":["べんりでしたが、人が 多かったです。","ふべんで、人も 少なかったです。","えきから とおくて、しずかでした。","山が 見えて、空気が きれいでした。"],"a":0,"e":"第二段：車站近、買東西方便，但人多到假日都沒辦法好好休息。<br>其他選項：2・3 講的是現在的城鎮（店少、離車站遠）、4 也是現在城鎮的優點。<br><b>答案在哪一句</b>：第二段整段，關鍵是「べんりでしたが、いつも 人が 多くて」這個轉折。"},{"pass":"わたしは 先月 この まちに ひっこして きました。<br>まえに すんで いた まちは えきが ちかくて、買いものも べんりでしたが、いつも 人が 多くて、休みの 日も しずかに 休む ことが できませんでした。<br>いまの まちは えきまで あるいて 二十分 かかります。大きい 店も ちかくに ありませんから、買いものは 週に 一かい、車で 行きます。<br>でも、まわりに 山が 見えて、空気が とても きれいです。あさ はやく おきて、まどを あけると、とりの こえが 聞こえます。よるは くらいですが、ほしが たくさん 見えます。<br>ふべんな ことも ありますが、わたしは この まちが すきに なりました。来年は この まちで 小さい 店を はじめたいと おもって います。","passZh":"我上個月搬到這個城鎮。之前住的城鎮車站很近、買東西也方便，但人總是很多，連假日都沒辦法安靜地休息。現在的城鎮走到車站要二十分鐘，附近也沒有大店，所以買東西是一週一次開車去。不過周圍看得到山，空氣非常乾淨。早上早起打開窗戶，聽得到鳥叫聲。晚上雖然很暗，卻看得到很多星星。雖然有不方便的地方，我卻喜歡上了這個城鎮。明年想在這個城鎮開一家小店。","q":"この 人は 来年 何を したいですか。","c":["まえの まちに もどりたいです。","この まちで 店を はじめたいです。","もっと べんりな まちへ ひっこしたいです。","車を 買いたいです。"],"a":1,"e":"最後一句「来年は この 町で 小さい 店を はじめたいと 思って います」。<br>其他選項：2・3 和「この 町が 好きに なりました」矛盾；4 的車是現在就在用的（買いものは 車で 行きます），不是明年的計畫。<br><b>答案在哪一句</b>：最後一句。"}]},{"no":6,"title":"問題6","instr":"つぎの お知らせを 見て、しつもんに こたえて ください。こたえは 1・2・3・4から いちばん いい ものを 一つ えらんで ください。","items":[{"pass":"<b>みどりし しみんプール　ごりよう あんない</b><table class=\"info\"><tr><th></th><th>へいじつ</th><th>土・日・しゅくじつ</th></tr><tr><td>時間</td><td>10:00〜21:00</td><td>9:00〜17:00</td></tr><tr><td>大人（16さい〜）</td><td>400円</td><td>500円</td></tr><tr><td>子ども（6〜15さい）</td><td>200円</td><td>250円</td></tr><tr><td>65さい〜</td><td>むりょう</td><td>200円</td></tr></table>※ 毎週 水よう日は 休みです。<br>※ 5さいまでの 子どもは 入る ことが できません。<br>※ プールに 入る ときは、かならず ぼうしを かぶって ください。ぼうしは 入口で 200円で 買う ことが できます。<br>※ 10人より 多い グループは、一週間 まえまでに 電話で れんらくして ください。","passZh":"綠市市民游泳池使用說明。平日 10:00〜21:00，六日與假日 9:00〜17:00。大人（16 歲以上）平日 400 圓、假日 500 圓；兒童（6〜15 歲）平日 200 圓、假日 250 圓；65 歲以上平日免費、假日 200 圓。※每週三公休。※五歲以下的兒童不能入場。※下水時請務必戴泳帽，入口可以用 200 圓購買。※超過十人的團體請在一週前用電話聯絡。","q":"日よう日に 大人 一人と 11さいの 子ども 二人で 行きます。ぜんぶで いくらですか。","c":["800円","900円","1000円","1250円"],"a":2,"e":"星期日是假日價：大人 500＋兒童 250×2＝1000 圓。11 歲屬於「6〜15さい」的兒童票。<br>其他選項：800 是平日價（400＋200×2）、900 是大人假日票配兒童平日票、1250 是把三個人都算成大人。<br><b>答案在哪一句</b>：表格的「土・日・祝」那一欄，大人與子ども 各看一列。<br><b>陷阱</b>：年齡分三段（〜5／6〜15／16〜／65〜），要先確認 11 歲落在哪一段再去查價錢。"}]}],"n":22},{"key":"choukai","label":"聴解","min":null,"opening":"これから、ちょうかいしけんを はじめます。もんだいようしに メモを とっても かまいません。","closing":"これで ちょうかいしけんを おわります。","parts":[{"no":1,"title":"問題1　課題理解","instr":"問題1では、はじめに しつもんを 聞いて ください。それから 話を 聞いて、もんだいようしの 1から4の 中から、いちばん いい ものを 一つ えらんで ください。","ex":{"ex":true,"q":"女の人は あした 何を しますか。","c":["1","2","3","4"],"a":0,"zh":"男：明天要不要去看電影？／女：抱歉，我明天要在家打掃。","play":[{"r":"N","t":"れい。"},{"r":"N","t":"女の人は あした 何を しますか。"},{"p":5},{"r":"M","t":"あした、えいがを 見に 行きませんか。"},{"r":"F","t":"すみません、あしたは うちの そうじを します。"},{"r":"N","t":"女の人は あした 何を しますか。"},{"r":"N","t":"いちばん いい ものは 1ばんです。"}],"img":"img/mock/l2-08.png"},"items":[{"n":1,"play":[{"r":"N","t":"1ばん。"},{"r":"N","t":"女の人は この あと どこへ 行きますか。"},{"p":5},{"r":"F","t":"もしもし、田中さん。今 バスていの 前に いますが、バスが なかなか 来ません。"},{"r":"M","t":"そうですか。この 時間は バスが 少ないんですよ。"},{"r":"F","t":"そうなんですか。じゃ、どう しましょうか。"},{"r":"M","t":"えきの 前まで あるいて 来て ください。わたしは そこで まって いますから。"},{"r":"F","t":"わかりました。十分ぐらいで 行きます。"},{"r":"N","t":"女の人は この あと どこへ 行きますか。"}],"q":"女の人は この あと どこへ 行きますか。","a":1,"gap":10,"zh":"女：喂，田中先生。我現在在公車站牌前，可是公車一直不來。／男：這樣啊，這個時間公車很少喔。／女：原來如此。那我該怎麼辦？／男：你走到車站前面來吧，我在那裡等你。／女：知道了，大概十分鐘過去。","e":"<b>關鍵句</b>：「<b>えきの 前まで 歩いて 来て ください</b>」＝叫她走到車站前面。<br>→ 正解は 2 の 絵（えきの 前）。<br>其他選項：1 的辦公大樓前沒出現；<b>3 的公車站牌是她「現在」的位置</b>，問的是「この あと」要去哪裡，這是最常見的陷阱；4 的家裡沒提到。","img":"img/mock/l1-10.png","c":["1","2","3","4"]},{"n":2,"play":[{"r":"N","t":"2ばん。"},{"r":"N","t":"男の人は これから 何を しますか。"},{"p":5},{"r":"F","t":"山田さん、きのう おねがいした しりょう、コピーは もう しましたか。"},{"r":"M","t":"はい、けさ しました。つくえの 上に おいて あります。"},{"r":"F","t":"ありがとう ございます。じゃ、三時から かいぎしつで せつめいを おねがいできますか。"},{"r":"M","t":"はい、だいじょうぶです。じゅんびして おきます。"},{"r":"F","t":"おねがいします。"},{"r":"N","t":"男の人は これから 何を しますか。"}],"q":"男の人は これから 何を しますか。","a":2,"gap":10,"zh":"女：山田先生，昨天拜託你的資料影印好了嗎？／男：是的，今天早上印好了，放在桌上。／女：謝謝。那三點開始可以麻煩你在會議室說明嗎？／男：好的，沒問題，我會先準備。／女：麻煩你了。","e":"<b>關鍵句</b>：「<b>三時から 会議室で せつめいを おねがいできますか</b>」＋「はい、だいじょうぶです」。<br>→ 正解は 3 の 絵（会議）。<br>其他選項：<b>1 的影印已經「けさ しました」＝做完了</b>，不是接下來的動作；2 看文件、4 寫文件對話都沒提到。","img":"img/mock/l1-11.png","c":["1","2","3","4"]},{"n":3,"play":[{"r":"N","t":"3ばん。"},{"r":"N","t":"女の人は まず 何を しますか。"},{"p":5},{"r":"M","t":"すみません、にもつが とどきましたよ。"},{"r":"F","t":"あ、ありがとう ございます。どこに おきましょうか。"},{"r":"M","t":"そこで いいですよ。あ、サインの まえに、中を かくにんして ください。"},{"r":"F","t":"わかりました。じゃ、あけて みますね。"},{"r":"M","t":"おねがいします。"},{"r":"N","t":"女の人は まず 何を しますか。"}],"q":"女の人は まず 何を しますか。","a":0,"gap":10,"zh":"男：不好意思，行李送到了喔。／女：啊，謝謝。要放哪裡？／男：放那裡就好。啊，簽名之前請先確認裡面。／女：知道了，那我打開看看。／男：麻煩了。","e":"<b>關鍵句</b>：「<b>サインの まえに、中を かくにんして ください</b>」＝先確認裡面。<br>→ 正解は 1 の 絵（はこを あける）。<br>其他選項：2 的櫃台付錢沒提到；3 看書沒提到；4 寄包裹方向相反（這是收到不是寄出）。<br><b>提醒</b>：問「まず」就是問<b>第一件事</b>，簽名是確認之後才做的。","img":"img/mock/l1-12.png","c":["1","2","3","4"]},{"n":4,"play":[{"r":"N","t":"4ばん。"},{"r":"N","t":"女の人は これから 何を しますか。"},{"p":5},{"r":"M","t":"ただいま。やさいと にく、買って きましたよ。"},{"r":"F","t":"ありがとう。じゃ、わたしが カレーを つくりますね。"},{"r":"M","t":"てつだいましょうか。"},{"r":"F","t":"だいじょうぶです。その あいだに へやを かたづけて ください。"},{"r":"M","t":"はい、わかりました。"},{"r":"N","t":"女の人は これから 何を しますか。"}],"q":"女の人は これから 何を しますか。","a":0,"gap":10,"zh":"男：我回來了。蔬菜和肉買回來了喔。／女：謝謝。那我來做咖哩吧。／男：要我幫忙嗎？／女：不用，你趁這時候整理一下房間。／男：好，我知道了。","e":"<b>關鍵句</b>：「<b>わたしが カレーを 作りますね</b>」＝她要做菜。<br>→ 正解は 1 の 絵（りょうりを 作る）。<br>其他選項：2 吃飯是做完之後；<b>3 的買菜是男生已經做完的事</b>（買って きました）；4 出門沒提到。<b>整理房間是男生要做的</b>，不要跟女生的動作搞混。","img":"img/mock/l1-13.png","c":["1","2","3","4"]},{"n":5,"play":[{"r":"N","t":"5ばん。"},{"r":"N","t":"女の人は どこで さとうさんに 会いましたか。"},{"p":5},{"r":"M","t":"きのう、さとうさんに 会いましたか。"},{"r":"F","t":"ええ、会いましたよ。"},{"r":"M","t":"どこで 会いましたか。会社ですか。"},{"r":"F","t":"いいえ。えきへ 行く とちゅうの 道で ぐうぜん 会って、十分ぐらい 話しました。"},{"r":"M","t":"そうですか。げんきそうでしたか。"},{"r":"N","t":"女の人は どこで さとうさんに 会いましたか。"}],"q":"女の人は どこで さとうさんに 会いましたか。","a":2,"gap":10,"zh":"男：昨天見到佐藤小姐了嗎？／女：嗯，見到了喔。／男：在哪裡見到的？公司嗎？／女：不是。在去車站的路上碰巧遇到，聊了十分鐘左右。／男：這樣啊。她看起來還好嗎？","e":"<b>關鍵句</b>：「<b>道で ぐうぜん 会って、十分ぐらい 話しました</b>」。<br>→ 正解は 3 の 絵（道で 話して いる）。<br>其他選項：<b>1 的公司被「いいえ」否定掉了</b>；2 店門口沒提到；4 在家裡也沒提到。<br><b>提醒</b>：「えきへ 行く とちゅう」是在<b>路上</b>，不是在車站。","img":"img/mock/l1-14.png","c":["1","2","3","4"]},{"n":6,"play":[{"r":"N","t":"6ばん。"},{"r":"N","t":"二人は しごとの あとで 何を しますか。"},{"p":5},{"r":"F","t":"山田さん、しごとは まだ おわりませんか。"},{"r":"M","t":"あと 少しです。レポートを 書いて いますから。"},{"r":"F","t":"そうですか。じゃ、おわったら おちゃでも 飲みに 行きませんか。"},{"r":"M","t":"いいですね。三十分ぐらいで おわりますから、まって いて ください。"},{"r":"F","t":"わかりました。下の きっさてんで まって います。"},{"r":"N","t":"二人は しごとの あとで 何を しますか。"}],"q":"二人は しごとの あとで 何を しますか。","a":3,"gap":10,"zh":"女：山田先生，工作還沒結束嗎？／男：還差一點，我在寫報告。／女：這樣啊。那結束之後要不要去喝杯茶？／男：好啊。大概三十分鐘會結束，請等我一下。／女：知道了，我在樓下的咖啡店等你。","e":"<b>關鍵句</b>：「<b>お茶でも 飲みに 行きませんか</b>」＋「いいですね」＝兩人都同意。<br>→ 正解は 4 の 絵（二人で お茶を 飲む）。<br>其他選項：<b>1 用電腦是「現在」還在做的工作</b>（レポートを 書いて います）；2 購物、3 躺沙發都沒提到。","img":"img/mock/l1-15.png","c":["1","2","3","4"]},{"n":7,"play":[{"r":"N","t":"7ばん。"},{"r":"N","t":"男の人は いつも 何で 会社へ 来ますか。"},{"p":5},{"r":"F","t":"山田さんは まいにち 電車で 会社へ 来て いますか。"},{"r":"M","t":"いいえ。うちから えきまで とおいですから、じてんしゃで 来て います。"},{"r":"F","t":"そうですか。雨の 日は どう しますか。"},{"r":"M","t":"雨の 日だけ バスに のります。でも、バスは 時間が かかりますね。"},{"r":"F","t":"たいへんですね。"},{"r":"N","t":"男の人は いつも 何で 会社へ 来ますか。"}],"q":"男の人は いつも 何で 会社へ 来ますか。","a":2,"gap":10,"zh":"女：山田先生每天都搭電車來公司嗎？／男：不，從家裡到車站很遠，所以我都騎腳踏車。／女：這樣啊。下雨天怎麼辦？／男：只有下雨天搭公車。不過公車很花時間呢。／女：真辛苦。","e":"<b>關鍵句</b>：「<b>じてんしゃで 来て います</b>」——「〜て います」表示<b>平常的習慣</b>。<br>→ 正解は 3 の 絵（じてんしゃ）。<br>其他選項：1 的公車是<b>「雨の 日だけ」</b>的例外；2 計程車沒提到；4 的電車在第一句就被「いいえ」否定了。<br><b>提醒</b>：問「いつも」就是問<b>平常</b>，不要被例外那句騙走。","img":"img/mock/l2-06.png","c":["1","2","3","4"]}]},{"no":2,"title":"問題2　ポイント理解","instr":"問題2では、はじめに しつもんを 聞いて ください。それから 話を 聞いて、もんだいようしの 1から4の 中から、いちばん いい ものを 一つ えらんで ください。","ex":{"ex":true,"q":"女の人は けさ 何時に おきましたか。","c":["六時","六時半","七時","七時半"],"a":1,"zh":"男：今天早上幾點起床？／女：六點半。","play":[{"r":"N","t":"れい。"},{"r":"N","t":"女の人は けさ 何時に おきましたか。"},{"p":12},{"r":"M","t":"けさ、何時に おきましたか。"},{"r":"F","t":"六時半です。"},{"r":"N","t":"女の人は けさ 何時に おきましたか。"},{"r":"N","t":"いちばん いい ものは 2ばんです。"}]},"items":[{"n":1,"play":[{"r":"N","t":"1ばん。"},{"r":"N","t":"女の人は あした 何時に うちを 出ますか。"},{"p":12},{"r":"M","t":"あしたの あさ、何時に うちを 出ますか。"},{"r":"F","t":"そうですね。八時の 電車に のりたいですから、七時には 出ます。"},{"r":"M","t":"えきまで 二十分 かかりますからね。"},{"r":"F","t":"ええ。ですから 六時に おきないと いけません。"},{"r":"M","t":"はやいですね。"},{"r":"N","t":"女の人は あした 何時に うちを 出ますか。"}],"q":"女の人は あした 何時に うちを 出ますか。","a":3,"gap":10,"zh":"男：明天早上幾點出門？／女：嗯…我想搭八點的電車，所以七點就要出門。／男：到車站要二十分鐘嘛。／女：對。所以我得六點起床。／男：真早呢。","e":"<b>關鍵句</b>：「<b>七時には 出ます</b>」＝七點出門。<br>其他選項：六時 是<b>起床</b>時間、八時 是<b>電車</b>的時間、九時 完全沒出現。<br><b>提醒</b>：這種題目一定會出現三四個時間，要聽清楚每個時間各自配哪個動作。","c":["六時","八時","九時","七時"]},{"n":2,"play":[{"r":"N","t":"2ばん。"},{"r":"N","t":"女の人は どうして かおいろが わるいですか。"},{"p":12},{"r":"M","t":"どう しましたか。かおいろが わるいですよ。"},{"r":"F","t":"けさから あたまが いたいんです。"},{"r":"M","t":"ねつは ありますか。"},{"r":"F","t":"いいえ、ねつは ありません。きのう おそくまで しごとを して、あまり ねて いませんから。"},{"r":"M","t":"じゃ、きょうは はやく かえった ほうが いいですよ。"},{"r":"N","t":"女の人は どうして かおいろが わるいですか。"}],"q":"女の人は どうして かおいろが わるいですか。","a":0,"gap":10,"zh":"男：怎麼了？你臉色不太好喔。／女：從今天早上開始頭就很痛。／男：有發燒嗎？／女：沒有，沒發燒。昨天工作到很晚，沒什麼睡。／男：那今天早點回去比較好喔。","e":"<b>關鍵句</b>：「<b>けさから あたまが いたいんです</b>」＝頭痛。<br>其他選項：<b>ねつ 被「ねつは ありません」否定掉了</b>（這是最常見的陷阱）；かぜ（感冒）沒提到；工作忙是<b>頭痛的原因</b>，不是臉色差的直接回答——問的是「どうして かおいろが わるい」。","c":["あたまが いたいから","ねつが あるから","かぜを ひいたから","しごとが いそがしいから"]},{"n":3,"play":[{"r":"N","t":"3ばん。"},{"r":"N","t":"女の人は いくら はらいますか。"},{"p":12},{"r":"F","t":"すみません、この ノートは いくらですか。"},{"r":"M","t":"一さつ 四百円です。"},{"r":"F","t":"じゃ、三さつ ください。"},{"r":"M","t":"ありがとう ございます。ぜんぶで 千二百円です。ふくろは いりますか。"},{"r":"F","t":"いいえ、けっこうです。"},{"r":"N","t":"女の人は いくら はらいますか。"}],"q":"女の人は いくら はらいますか。","a":1,"gap":10,"zh":"女：不好意思，這個筆記本多少錢？／男：一本四百圓。／女：那請給我三本。／男：謝謝。總共一千兩百圓。需要袋子嗎？／女：不用，謝謝。","e":"<b>關鍵句</b>：四百円 × 三さつ＝<b>千二百円</b>，店員最後也說了一次。<br>其他選項：千円 和 二千円 都是湊整數的干擾項；八百円 是只算兩本。<br><b>提醒</b>：數字題常常要自己算一次，不一定會把答案直接唸出來。","c":["千円","千二百円","八百円","二千円"]},{"n":4,"play":[{"r":"N","t":"4ばん。"},{"r":"N","t":"女の人は 日よう日 どこへ 行きますか。"},{"p":12},{"r":"M","t":"日よう日、いっしょに デパートへ 行きませんか。"},{"r":"F","t":"すみません、日よう日は ちょっと…。"},{"r":"M","t":"何か ようじが ありますか。"},{"r":"F","t":"ええ、来週 テストが ありますから、としょかんで べんきょうします。"},{"r":"M","t":"そうですか。じゃ、また こんど さそいますね。"},{"r":"N","t":"女の人は 日よう日 どこへ 行きますか。"}],"q":"女の人は 日よう日 どこへ 行きますか。","a":2,"gap":10,"zh":"男：星期天要不要一起去百貨公司？／女：抱歉，星期天有點…／男：有什麼事嗎？／女：嗯，下週有考試，我要在圖書館唸書。／男：這樣啊。那下次再約你。","e":"<b>關鍵句</b>：「<b>としょかんで べんきょうします</b>」。<br>其他選項：<b>デパート 是被婉拒的邀約</b>；えいがかん、びょういん 完全沒提到。<br><b>提醒</b>：「ちょっと…」沒說完就是<b>委婉拒絕</b>，後面才會講真正的理由。","c":["デパート","えいがかん","としょかん","びょういん"]},{"n":5,"play":[{"r":"N","t":"5ばん。"},{"r":"N","t":"二人は どの シャツを 買いますか。"},{"p":12},{"r":"F","t":"この しろい シャツ、どうですか。"},{"r":"M","t":"うーん、わたしは あおの ほうが すきです。"},{"r":"F","t":"そうですか。でも、しろいのも きれいですよ。"},{"r":"M","t":"ええ。でも、しろいのは すぐ よごれますから。"},{"r":"F","t":"それも そうですね。じゃ、こっちに します。"},{"r":"N","t":"二人は どの シャツを 買いますか。"}],"q":"二人は どの シャツを 買いますか。","a":3,"gap":10,"zh":"女：這件白襯衫怎麼樣？／男：嗯…我比較喜歡藍色的。／女：這樣啊。可是白的也很好看喔。／男：是啊。不過白的很快就髒了。／女：說得也是。那就選這件吧。","e":"<b>關鍵句</b>：「<b>あおの ほうが 好きです</b>」＋最後「こっちに します」＝決定買藍的。<br>其他選項：<b>しろい 被「すぐ よごれますから」否定掉了</b>；くろい・あかい 沒提到。<br><b>提醒</b>：「〜に します」＝決定選…，這句一出現就是答案；而且它出現在<b>最後</b>，不能聽到一半就作答。","c":["しろい シャツ","くろい シャツ","あかい シャツ","あおい シャツ"]},{"n":6,"play":[{"r":"N","t":"6ばん。"},{"r":"N","t":"テストは 何よう日に ありますか。"},{"p":12},{"r":"M","t":"テストは 水よう日でしたね。"},{"r":"F","t":"いいえ、水よう日じゃ ありません。木よう日ですよ。"},{"r":"M","t":"あ、そうでしたか。"},{"r":"F","t":"あ、でも きのう 先生が、木よう日から 金よう日に かわりますと 言って いました。"},{"r":"M","t":"そうですか。あぶなかったです。"},{"r":"N","t":"テストは 何よう日に ありますか。"}],"q":"テストは 何よう日に ありますか。","a":0,"gap":10,"zh":"男：考試是星期三對吧。／女：不，不是星期三，是星期四喔。／男：啊，這樣啊。／女：啊，不過昨天老師說，從星期四改到星期五了。／男：這樣啊，好險。","e":"<b>關鍵句</b>：「<b>木よう日から 金よう日に かわります</b>」——「AからBに かわる」＝從A改成B，<b>B 才是現在的</b>。<br>其他選項：もくよう日 是改之前的、すいよう日 是男生一開始記錯的、どよう日 沒出現。<br><b>提醒</b>：這題連續修正了兩次（水→木→金），要聽到<b>最後一次</b>才是答案。","c":["きんよう日","もくよう日","すいよう日","どよう日"]}]},{"no":3,"title":"問題3　発話表現","instr":"問題3では、えを 見ながら しつもんを 聞いて ください。やじるしの 人は 何と 言いますか。1から3の 中から、いちばん いい ものを 一つ えらんで ください。","ex":{"ex":true,"scene":"img/mock/l3-20.png","q":"ともだちに プレゼントを わたします。何と 言いますか。","c":["どうぞ。","どうも。","おねがいします。"],"a":0,"zh":"旁白：要把禮物交給朋友。這時候要說什麼？","play":[{"r":"N","t":"れい。"},{"r":"N","t":"ともだちに プレゼントを わたします。何と 言いますか。"},{"r":"N","t":"1ばん。"},{"r":"M","t":"どうぞ。"},{"r":"N","t":"2ばん。"},{"r":"F","t":"どうも。"},{"r":"N","t":"3ばん。"},{"r":"M","t":"おねがいします。"},{"r":"N","t":"いちばん いい ものは 1ばんです。"}]},"items":[{"n":1,"scene":"img/mock/l3-02.png","play":[{"r":"N","t":"1ばん。"},{"r":"N","t":"はじめて ともだちの うちへ 行きました。げんかんで 何と 言いますか。"},{"r":"N","t":"1ばん。"},{"r":"M","t":"おじゃまします。"},{"r":"N","t":"2ばん。"},{"r":"F","t":"いらっしゃいませ。"},{"r":"N","t":"3ばん。"},{"r":"M","t":"おかえりなさい。"}],"q":"何と 言いますか。","c":["おじゃまします。","いらっしゃいませ。","おかえりなさい。"],"a":0,"gap":8,"zh":"旁白：要進朋友家。這時候要說什麼？","e":"進別人家說「<b>おじゃまします</b>」＝打擾了。<br>其他選項：いらっしゃいませ＝歡迎光臨，是<b>店員</b>對客人說的；おかえりなさい＝你回來啦，是<b>在家的人</b>對回家的人說的。<br><b>陷阱</b>：三個都是「門口會聽到的話」，差別在<b>誰說</b>——箭頭指的是要進門的客人。","hideChoices":true},{"n":2,"scene":"img/mock/l3-09.png","play":[{"r":"N","t":"2ばん。"},{"r":"N","t":"レストランで ちゅうもんを したいです。店の 人に 何と 言いますか。"},{"r":"N","t":"1ばん。"},{"r":"M","t":"すみません。"},{"r":"N","t":"2ばん。"},{"r":"F","t":"ごめんなさい。"},{"r":"N","t":"3ばん。"},{"r":"M","t":"しつれいしました。"}],"q":"何と 言いますか。","c":["ごめんなさい。","すみません。","しつれいしました。"],"a":1,"gap":8,"zh":"旁白：在餐廳要叫店員。這時候要說什麼？","e":"叫人、搭話用「<b>すみません</b>」。<br>其他選項：ごめんなさい＝對不起（做錯事時的道歉）、しつれいしました＝失禮了（做了失禮的事之後）。<br><b>陷阱</b>：すみません 有「不好意思／抱歉／謝謝」三種用法，這裡是<b>叫人</b>的那一種；另外兩個都只能用在道歉。","hideChoices":true},{"n":3,"scene":"img/mock/l3-12.png","play":[{"r":"N","t":"3ばん。"},{"r":"N","t":"しごとが おわって、先に かえります。何と 言いますか。"},{"r":"N","t":"1ばん。"},{"r":"M","t":"おさきに しつれいします。"},{"r":"N","t":"2ばん。"},{"r":"F","t":"いってらっしゃい。"},{"r":"N","t":"3ばん。"},{"r":"M","t":"おつかれさまでした。"}],"q":"何と 言いますか。","c":["いってらっしゃい。","おつかれさまでした。","おさきに しつれいします。"],"a":2,"gap":8,"zh":"旁白：工作結束，要比別人先下班。這時候要說什麼？","e":"比別人早走說「<b>おさきに しつれいします</b>」。<br>其他選項：いってらっしゃい＝慢走（<b>送人</b>的人說的）、おつかれさまでした＝辛苦了（是<b>留下來的人</b>回應先走的人的話）。<br><b>陷阱</b>：おつかれさまでした 在辦公室很常聽到，但在這個場景是<b>別人回你</b>的話，不是你說的。","hideChoices":true},{"n":4,"scene":"img/mock/l3-15.png","play":[{"r":"N","t":"4ばん。"},{"r":"N","t":"ともだちが りょこうに 行きます。何と 言いますか。"},{"r":"N","t":"1ばん。"},{"r":"M","t":"いってらっしゃい。"},{"r":"N","t":"2ばん。"},{"r":"F","t":"いって きます。"},{"r":"N","t":"3ばん。"},{"r":"M","t":"ただいま。"}],"q":"何と 言いますか。","c":["いってらっしゃい。","いって きます。","ただいま。"],"a":0,"gap":8,"zh":"旁白：朋友要去旅行。這時候要說什麼？","e":"送人出發說「<b>いってらっしゃい</b>」。<br>其他選項：いって きます＝我出門了（<b>要走的人</b>說的）、ただいま＝我回來了。<br><b>陷阱</b>：いってらっしゃい 和 いって きます 只差幾個音，但說話的人完全相反 ——<b>箭頭指的是留下來的人</b>，所以要說 いってらっしゃい。","hideChoices":true},{"n":5,"scene":"img/mock/l3-08.png","play":[{"r":"N","t":"5ばん。"},{"r":"N","t":"ともだちから プレゼントを もらいました。何と 言いますか。"},{"r":"N","t":"1ばん。"},{"r":"M","t":"ありがとう ございます。"},{"r":"N","t":"2ばん。"},{"r":"F","t":"おめでとう ございます。"},{"r":"N","t":"3ばん。"},{"r":"M","t":"どう いたしまして。"}],"q":"何と 言いますか。","c":["おめでとう ございます。","ありがとう ございます。","どう いたしまして。"],"a":1,"gap":8,"zh":"旁白：收到朋友送的禮物。這時候要說什麼？","e":"收到東西道謝「<b>ありがとう ございます</b>」。<br>其他選項：おめでとう ございます＝恭喜（<b>祝賀別人</b>）、どう いたしまして＝不客氣（是<b>被道謝的人</b>回的話）。<br><b>陷阱</b>：どう いたしまして 是「ありがとう」的回答，順序顛倒了。","hideChoices":true}]},{"no":4,"title":"問題4　即時応答","instr":"問題4では、えなどが ありません。ぶんを 聞いて、1から3の 中から、いちばん いい ものを 一つ えらんで ください。","ex":{"ex":true,"q":"（へんじを えらんで ください）","c":["山田です。","はじめまして。","そうです。"],"a":0,"zh":"女：請問您貴姓？","play":[{"r":"N","t":"れい。"},{"r":"F","t":"おなまえは。"},{"r":"M","t":"山田です。"},{"r":"M","t":"はじめまして。"},{"r":"M","t":"そうです。"},{"r":"N","t":"いちばん いい ものは 1ばんです。"}]},"items":[{"n":1,"play":[{"r":"N","t":"1ばん。"},{"r":"F","t":"この まどを あけても いいですか。"},{"r":"M","t":"ええ、どうぞ。"},{"r":"M","t":"ええ、あけました。"},{"r":"M","t":"いいえ、あけます。"}],"q":"（へんじを えらんで ください）","c":["ええ、あけました。","いいえ、あけます。","ええ、どうぞ。"],"a":2,"gap":8,"zh":"女：這扇窗戶可以打開嗎？","e":"「〜ても いいですか」是<b>請求許可</b>，答應就說「ええ、どうぞ」。<br>其他選項：「あけました」＝我開了，<b>主客顛倒</b>（要開的是問的人）；「いいえ、あけます」前後矛盾（拒絕卻又說要開）。","hideChoices":true},{"n":2,"play":[{"r":"N","t":"2ばん。"},{"r":"M","t":"おしごとは 何ですか。"},{"r":"F","t":"きょうしです。"},{"r":"F","t":"かいしゃの 前です。"},{"r":"F","t":"九時からです。"}],"q":"（へんじを えらんで ください）","c":["きょうしです。","かいしゃの 前です。","九時からです。"],"a":0,"gap":8,"zh":"男：請問您從事什麼工作？","e":"問職業，要回答<b>職業名稱</b>。<br>其他選項：「かいしゃの 前です」是回答<b>地點</b>（どこですか）、「九時からです」是回答<b>時間</b>（何時からですか）。<br><b>陷阱</b>：三個答案都和「工作」有關，但只有第一個回答到「是什麼工作」。","hideChoices":true},{"n":3,"play":[{"r":"N","t":"3ばん。"},{"r":"F","t":"しゅうまつ どこかへ 行きましたか。"},{"r":"M","t":"いいえ、どこへも 行きませんでした。"},{"r":"M","t":"はい、どこも 行きました。"},{"r":"M","t":"いいえ、だれも 行きました。"}],"q":"（へんじを えらんで ください）","c":["はい、どこも 行きました。","いいえ、どこへも 行きませんでした。","いいえ、だれも 行きました。"],"a":1,"gap":8,"zh":"女：週末有去哪裡嗎？","e":"「どこか」的否定回答是「<b>どこへも 行きませんでした</b>」。<br>其他選項：「どこも 行きました」—— 疑問詞＋も <b>一定要配否定</b>，接肯定是錯的；「だれも」問的是人不是地方，而且同樣接了肯定。<br><b>陷阱</b>：どこか（某處）↔ どこも／どこへも（哪裡都…不），回答時要跟著換。","hideChoices":true},{"n":4,"play":[{"r":"N","t":"4ばん。"},{"r":"M","t":"あそこの かばんは だれのですか。"},{"r":"F","t":"わたしのです。"},{"r":"F","t":"わたしです。"},{"r":"F","t":"わたしへです。"}],"q":"（へんじを えらんで ください）","c":["わたしです。","わたしへです。","わたしのです。"],"a":2,"gap":8,"zh":"男：那邊那個包包是誰的？","e":"問「だれの」要用「<b>〜の</b>」回答＝我的。<br>其他選項：「わたしです」是回答<b>「だれですか」</b>（是誰）；「わたしへです」不成句。<br><b>陷阱</b>：差一個 の，問的東西就完全不同 ——「だれ」問人、「だれの」問所有者。","hideChoices":true},{"n":5,"play":[{"r":"N","t":"5ばん。"},{"r":"F","t":"もう しゅくだいを しましたか。"},{"r":"M","t":"いいえ、まだです。"},{"r":"M","t":"いいえ、しませんでした。"},{"r":"M","t":"はい、まだです。"}],"q":"（へんじを えらんで ください）","c":["いいえ、まだです。","いいえ、しませんでした。","はい、まだです。"],"a":0,"gap":8,"zh":"女：作業已經寫了嗎？","e":"「もう〜ましたか」的否定回答是「<b>まだです</b>」＝還沒（等一下會做）。<br>其他選項：「しませんでした」＝<b>當時沒做</b>，語氣是已經結束、不會再做了；「はい、まだです」前後矛盾。<br><b>陷阱</b>：中文都講「還沒寫」，日文卻分成「まだです」（之後會做）和「〜ませんでした」（那時候沒做）兩種。","hideChoices":true},{"n":6,"play":[{"r":"N","t":"6ばん。"},{"r":"M","t":"にもつが 多いですね。手つだいましょうか。"},{"r":"F","t":"ありがとう ございます。おねがいします。"},{"r":"F","t":"いいえ、手つだいます。"},{"r":"F","t":"はい、多いです。"}],"q":"（へんじを えらんで ください）","c":["いいえ、手つだいます。","ありがとう ございます。おねがいします。","はい、多いです。"],"a":1,"gap":8,"zh":"男：行李很多呢。要我幫忙嗎？","e":"「〜ましょうか」是<b>主動提議幫忙</b>，接受就道謝並說「おねがいします」。<br>其他選項：「いいえ、手つだいます」變成<b>你要去幫對方</b>（主客顛倒）；「はい、多いです」只回答了行李多不多，<b>沒有回應「要不要幫忙」</b>。","hideChoices":true}]}],"n":24}]}</script>
<script id="paper-B" type="application/json">{"id":"B","name":"B 卷","pass":{"total":80,"a":38,"b":19},"sections":[{"key":"moji","label":"言語知識（文字・語彙）","min":20,"parts":[{"no":1,"title":"問題1","instr":"＿＿の ことばは ひらがなで どう 書きますか。1・2・3・4から いちばん いい ものを 一つ えらんで ください。","items":[{"q":"あの <span class=\"ul\">男</span>の 子は だれですか。","c":["おとこ","おんな","だん","おとうと"],"a":0,"e":"男＝おとこ。<br>其他選項：おんな＝女（意思相反）、だん 是音讀（男子＝だんし）、おとうと＝弟（弟弟）。<br><b>容易選錯的地方</b>：男の子／女の子、男の人／女の人 都要成對記；「男」上面是田、下面是力。"},{"q":"<span class=\"ul\">午前</span> 十時に 来て ください。","c":["ごご","ごぜん","ぜんご","ごせん"],"a":1,"e":"午前＝ごぜん（上午）。<br>其他選項：ごご＝午後（下午，意思相反）、ぜんご＝前後、ごせん 不是詞。<br><b>容易選錯的地方</b>：午前／午後 只差一個字，考試很愛出。「前」在這裡唸 ぜん（音讀），單獨當「前面」時唸 まえ。"},{"q":"つくえの <span class=\"ul\">下</span>に かばんが あります。","c":["うえ","か","した","もと"],"a":2,"e":"下＝した（下面）。<br>其他選項：うえ＝上（上面，意思相反）、か 是音讀（地下＝ちか）、もと 是另一種訓讀（用在 足もと 這種詞）。<br><b>容易選錯的地方</b>：上・下・中・外 這組位置詞常一起考，而且「下」在 地下鉄（ちかてつ）裡唸 か，單獨用才唸 した。"},{"q":"りんごを <span class=\"ul\">四つ</span> ください。","c":["よんつ","しつ","よつ","よっつ"],"a":3,"e":"四つ＝よっつ。<br>其他選項：よんつ・しつ・よつ 都不是正確唸法。<br><b>容易選錯的地方</b>：一つ〜十 的唸法全部特殊 —— ひとつ、ふたつ、みっつ、よっつ、いつつ、むっつ、ななつ、やっつ、ここのつ、とお，而且「四」在這裡唸 よ 不唸 し。"},{"q":"しゅうまつの <span class=\"ul\">天気</span>は どうでしょうか。","c":["てんき","でんき","てんけ","あまき"],"a":0,"e":"天気＝てんき（天氣）。<br>其他選項：でんき＝電気（電燈、電力）、てんけ・あまき 不是詞。<br><b>容易選錯的地方</b>：てんき 和 でんき 只差濁音，聽和讀都容易混，看第一個字是「天」還是「電」。"},{"q":"まいばん ラジオを <span class=\"ul\">聞きます</span>。","c":["もんきます","ききます","きさます","ぶんきます"],"a":1,"e":"聞きます＝ききます（聽；也有「問」的意思）。<br>其他選項：もん・ぶん 是音讀（新聞＝しんぶん）、きさます 不是詞。<br><b>容易選錯的地方</b>：「聞きます」同時有「聽」和「問」兩個意思，靠助詞分辨 ——音楽<b>を</b> 聞きます（聽）／先生<b>に</b> 聞きます（問）。"},{"q":"ノックを してから へやに <span class=\"ul\">入ります</span>。","c":["いります","でります","はいります","にゅうります"],"a":2,"e":"入ります＝はいります（進去）。<br>其他選項：いります＝要ります（需要，漢字不同）、でります 不是詞、にゅう 是音讀（入口 也不這樣唸，是 いりぐち）。<br><b>容易選錯的地方</b>：「入」單獨當動詞唸 はい，在 入口（いりぐち）裡唸 いり，兩種都是 N5 會考的。"}]},{"no":2,"title":"問題2","instr":"＿＿の ことばは どう 書きますか。1・2・3・4から いちばん いい ものを 一つ えらんで ください。","items":[{"q":"<span class=\"ul\">あし</span>が いたいです。","c":["手","耳","目","足"],"a":3,"e":"足（あし）＝腳。<br>其他選項：手＝て、耳＝みみ、目＝め，都是身體部位。<br><b>容易選錯的地方</b>：身體部位的漢字常常整組出現，先把「足」上面是「口」下面是「止」記起來。"},{"q":"<span class=\"ul\">そら</span>が きれいですね。","c":["空","雲","気","天"],"a":0,"e":"空（そら）＝天空。<br>其他選項：雲＝くも、気＝き（元気 的気）、天＝てん（天気 的天）。<br><b>容易選錯的地方</b>：「空」還可以唸 くう（空気＝くうき）、から（空＝空的），一個字三種唸法。"},{"q":"ここから <span class=\"ul\">きた</span>へ 行きます。","c":["比","北","化","東"],"a":1,"e":"北（きた）＝北。<br>其他選項：東＝ひがし、比・化 字形相近但不是方位。<br><b>容易選錯的地方</b>：東西南北 四個字要一起背 —— 東（ひがし）、西（にし）、南（みなみ）、北（きた）。"},{"q":"<span class=\"ul\">ちち</span>は かいしゃいんです。","c":["文","交","父","夫"],"a":2,"e":"父（ちち）＝（自己的）爸爸。<br>其他選項：文＝ぶん、交＝こう、夫＝おっと（丈夫），字形都很像。<br><b>容易選錯的地方</b>：講別人的爸爸要用「お父さん」，講自己的爸爸對外要用「父」。"},{"q":"おんがくが 大きくて、<span class=\"ul\">みみ</span>が いたいです。","c":["目","貝","自","耳"],"a":3,"e":"耳（みみ）＝耳朵。<br>其他選項：目＝め、貝＝かい（貝殼）、自＝じ（自分 的自），四個字形都很接近。<br><b>容易選錯的地方</b>：「耳」和「目」只差一筆和方向，是考試常見的一組。"}]},{"no":3,"title":"問題3","instr":"（　）に 何を 入れますか。1・2・3・4から いちばん いい ものを 一つ えらんで ください。","items":[{"q":"でんわばんごうを <span class=\"bk\">　　</span> ください。","c":["おしえて","ならって","つくって","もらって"],"a":0,"e":"請對方告訴你電話號碼 → おしえて ください。<br>其他選項：ならって＝（我）跟人學、つくって＝做、もらって＝收下，方向或意思都不對。<br><b>容易選錯的地方</b>：教えます 除了「教」還有「告訴」的意思，問路、問電話號碼都用這個字。"},{"q":"かぜを ひきましたから、くすりを <span class=\"bk\">　　</span>。","c":["食べます","飲みます","します","入れます"],"a":1,"e":"日文的「吃藥」是<b>くすりを 飲みます</b>（喝藥）。<br>其他選項：食べます＝吃（日文不這樣講藥）、します＝做、入れます＝放進去。<br><b>容易選錯的地方</b>：中文說「吃藥」，日文一律用 飲む，這是固定搭配，背起來就好。"},{"q":"あめが ふって いますから、<span class=\"bk\">　　</span>を もって 行きます。","c":["ぼうし","かばん","かさ","くつ"],"a":2,"e":"下雨要帶傘 → かさ。<br>其他選項：ぼうし＝帽子、かばん＝包包、くつ＝鞋子，和下雨沒有直接關係。<br><b>容易選錯的地方</b>：這類題目要抓前半句的情境詞（あめが ふって います），再去選對應的東西。"},{"q":"えきの 前で ともだちを <span class=\"bk\">　　</span>。","c":["のります","はいります","つきます","まちます"],"a":3,"e":"等人用 <b>まちます</b>，對象用 を。<br>其他選項：のります＝搭乘（電車<b>に</b> のります）、はいります＝進入（へや<b>に</b> はいります）、つきます＝到達（えき<b>に</b> つきます）—— 這三個都不配 を。<br><b>容易選錯的地方</b>：看助詞就能刪掉三個選項，只有 まちます 用 を。"},{"q":"たいせつな 話ですから、<span class=\"bk\">　　</span> 聞いて ください。","c":["よく","すぐ","もう","まだ"],"a":0,"e":"「よく 聞いて ください」＝仔細聽。<br>其他選項：すぐ＝馬上、もう＝已經、まだ＝還沒，放進來都不通。<br><b>容易選錯的地方</b>：よく 有「常常」和「仔細、好好地」兩個意思，這裡是後者。"},{"q":"この へやは でんきが ついて いますから、<span class=\"bk\">　　</span>です。","c":["くらい","あかるい","ひろい","せまい"],"a":1,"e":"燈亮著所以房間很亮 → あかるい。<br>其他選項：くらい＝暗（相反）、ひろい＝寬、せまい＝窄，後兩個和燈沒有關係。<br><b>容易選錯的地方</b>：要從「でんきが ついて います」這個原因反推結果，不是看房間本身。"}]},{"no":4,"title":"問題4","instr":"＿＿の ぶんと だいたい 同じ いみの ぶんが あります。1・2・3・4から いちばん いい ものを 一つ えらんで ください。","items":[{"q":"この みせは 十時に <span class=\"ul\">あきます</span>。","c":["この みせは 十時までです。","この みせは 十時に しまります。","この みせは 十時からです。","この みせは 十時に 休みます。"],"a":2,"e":"「十時に あきます」＝十點開門＝營業從十點開始。<br>其他選項：十時まで＝到十點為止（結束時間）、しまります＝關門（相反）、休みます＝公休。<br><b>容易選錯的地方</b>：あきます／しまります 是一組，から／まで 是一組，把「開門＝から」「關門＝まで」對起來就不會錯。"},{"q":"わたしは まいばん 十一時に <span class=\"ul\">ねます</span>。","c":["わたしは まいばん 十一時に おきます。","わたしは まいばん 十一時まで はたらきます。","わたしは まいばん 十一時に 出かけます。","わたしは まいばん 十一時に 休みます。"],"a":3,"e":"「ねます」＝就寢，和「休みます」（休息、就寢）意思相同。<br>其他選項：おきます＝起床（相反）、はたらきます＝工作、出かけます＝出門。<br><b>容易選錯的地方</b>：休みます 有「請假」「休息」「就寢」三個意思，這裡配「まいばん 十一時に」就是就寢。"},{"q":"山田さんは いま <span class=\"ul\">でかけて います</span>。","c":["山田さんは いま うちに いません。","山田さんは いま うちに います。","山田さんは いま ねて います。","山田さんは いま しごとを して います。"],"a":0,"e":"「でかけて います」＝出門了（現在不在）。<br>其他選項：2 在家（相反）、3 在睡覺、4 在工作，都不等於「出門不在」。<br><b>容易選錯的地方</b>：「〜て います」在這裡表示<b>動作之後的狀態</b>（出門了，所以現在不在），不是「正在出門」。"}]}],"n":21},{"key":"bunpou","label":"言語知識（文法）・読解","min":40,"parts":[{"no":1,"title":"問題1","instr":"（　）に 何を 入れますか。1・2・3・4から いちばん いい ものを 一つ えらんで ください。","items":[{"q":"つくえの 上に 本が ならべて <span class=\"bk\">　　</span>。","c":["います","あります","おきます","します"],"a":1,"e":"「他動詞て形＋あります」＝有人做好、現在是那個狀態。ならべて あります＝（被）排好了。<br>其他選項：います 用在有生命的東西；おきます・します 接不上 ならべて。<br><b>同類對照</b>：<b>〜て あります</b>（有人刻意做好的狀態）vs <b>〜て います</b>（正在做／自然的狀態）。"},{"q":"としょかんで 大きい こえで <span class=\"bk\">　　</span> いけません。","c":["話して","話す","話しては","話した"],"a":2,"e":"「て形＋は いけません」＝不可以…。話す → 話しては。<br>其他選項：話して 少了 は、話す 是辭書形、話した 是た形，都接不上 いけません。<br><b>同類對照</b>：<b>〜ては いけません</b>（禁止）↔ <b>〜ても いいです</b>（許可），兩個成對記。"},{"q":"ともだち<span class=\"bk\">　　</span> 本を かしました。","c":["を","が","で","に"],"a":3,"e":"借出去的對象用 <b>に</b>：友だちに 本を かしました＝把書借給朋友。<br>其他選項：を 是借出的東西（本を）、が 是主語、で 是手段。<br><b>同類對照</b>：<b>かします</b>（借出，對象用 に）↔ <b>かります</b>（借入，來源用 に／から）。"},{"q":"あの 人は だれ<span class=\"bk\">　　</span> しって いますか。","c":["か","が","を","は"],"a":0,"e":"疑問詞＋<b>か</b>＝不確定的內容（知不知道他是誰）。<br>其他選項：が・を・は 放在 だれ 後面會變成直接問「誰知道」，和句尾的「知って いますか」對不上。<br><b>同類對照</b>：疑問詞＋<b>か</b>（某個…）／＋<b>も</b>＋否定（都不…）／＋<b>でも</b>＋肯定（都…）。"},{"q":"へやに だれ<span class=\"bk\">　　</span> いませんでした。","c":["か","も","が","は"],"a":1,"e":"疑問詞＋<b>も</b>＋否定＝一個人也沒有。<br>其他選項：か 是「有沒有人」的疑問、が 是主語、は 是主題，後面都不會接否定的 いませんでした。<br><b>同類對照</b>：何も／どこへも／だれも ＋ 否定，是同一組用法。"},{"q":"すみません、もう いちど <span class=\"bk\">　　</span> ください。","c":["言い","言う","言って","言った"],"a":2,"e":"請求用「て形＋ください」。言う → 言って。<br>其他選項：言い 是ます形語幹、言う 是辭書形、言った 是た形，都接不上 ください。<br><b>同類對照</b>：<b>〜て ください</b>（請做）↔ <b>〜ないで ください</b>（請不要做）。"},{"q":"あしたは たぶん はれる<span class=\"bk\">　　</span>。","c":["ましょう","ください","ですか","でしょう"],"a":3,"e":"「たぶん〜でしょう」＝大概會…吧，用來推測。<br>其他選項：ましょう＝提議、ください＝請求、ですか＝疑問，都和「たぶん」搭不起來。<br><b>同類對照</b>：たぶん 一定配 でしょう；きっと 語氣更肯定。"},{"q":"ここで しゃしんを <span class=\"bk\">　　</span> ください。","c":["とらないで","とらなくて","とらない","とりません"],"a":0,"e":"請對方不要做某事用「ない形＋で ください」。とる → とらないで。<br>其他選項：とらなくて 是原因用法、とらない 是普通形、とりません 是句尾，都接不上 ください。<br><b>同類對照</b>：<b>ないで</b>（沒做…就…／請不要）vs <b>なくて</b>（因為沒有…）。"},{"q":"わたしは 本を 読む<span class=\"bk\">　　</span> すきです。","c":["ことが","のが","のを","ことを"],"a":1,"e":"把動作變成名詞再接「〜が 好きです」，用 <b>のが</b>：読むのが 好きです。<br>其他選項：ことが 多半配 できます（読む ことが できます）、のを・ことを 的 を 和形容詞 好き 不搭。<br><b>同類對照</b>：<b>〜のが 好き／上手／下手</b>（形容詞，用 が）vs <b>〜ことが できる</b>（能力）。"}]},{"no":2,"title":"問題2","instr":"★に 入る ものは どれですか。1・2・3・4から いちばん いい ものを 一つ えらんで ください。","items":[{"q":"ちち は <span class=\"bk\">　　</span> <span class=\"bk\">　　</span> <span class=\"star\">★</span> <span class=\"bk\">　　</span> ことが あります。","c":["きょねん","いちど","日本へ","行った"],"a":2,"e":"正しい順序：父は <b>きょねん いちど 日本へ 行った</b> ことが あります。＝我爸爸去年去過一次日本。<br>「た形＋ことが あります」＝有過…的經驗，所以最後一格一定是 行った。時間（きょねん）→ 次數（いちど）→ 方向（日本へ）→ 動詞。<br>★的位置是第三格，答案是「日本へ」。"},{"q":"先生、 <span class=\"bk\">　　</span> <span class=\"bk\">　　</span> <span class=\"star\">★</span> <span class=\"bk\">　　</span> ください。","c":["この かんじの","よみかたを","ゆっくり","おしえて"],"a":2,"e":"正しい順序：先生、<b>この かんじの よみかたを ゆっくり おしえて</b> ください。＝老師，請慢慢告訴我這個漢字怎麼唸。<br>名詞接名詞用 の（かんじの よみかた），受詞用 を，副詞（ゆっくり）放在動詞前面。<br>★的位置是第三格，答案是「ゆっくり」。"},{"q":"きのうは <span class=\"bk\">　　</span> <span class=\"bk\">　　</span> <span class=\"star\">★</span> <span class=\"bk\">　　</span> 出ました。","c":["ねぼうして","いつもより","おそく","うちを"],"a":2,"e":"正しい順序：きのうは <b>ねぼうして いつもより おそく うちを</b> 出ました。＝昨天睡過頭，比平常晚出門。<br>原因（ねぼうして）→ 比較基準（いつもより）→ 副詞（おそく）→ 出發點（うちを）＋出ます。<br>★的位置是第三格，答案是「おそく」。"},{"q":"あの <span class=\"bk\">　　</span> <span class=\"bk\">　　</span> <span class=\"star\">★</span> <span class=\"bk\">　　</span> 人です。","c":["せが 高くて","めがねを","かけて いる","やさしい"],"a":2,"e":"正しい順序：あの <b>せが 高くて めがねを かけて いる やさしい</b> 人です。＝那位是個子高、戴眼鏡、很溫柔的人。<br>い形容詞連接用て形（高くて），動詞修飾名詞用普通形（かけて いる），最後一個形容詞直接接名詞。<br>★的位置是第三格，答案是「かけて いる」。"}]},{"no":3,"title":"問題3","instr":"つぎの 文章を 読んで、【　】に 入る ものを1・2・3・4から 一つ えらんで ください。","items":[{"pass":"わたしの 父は まいあさ 五時に おきます。おきて すぐ、ちかくの 川まで はしりに 【1】。<br>一時間ぐらい はしって から、うちへ かえって シャワーを あびます。そして 新聞を 読み【2】 あさごはんを 食べます。<br>父は 「からだを うごかすと、一日 げんきに いられる」と 言って います。【3】、わたしは あさが よわいですから、まだ いちども いっしょに 行った ことが ありません。<br>来月から わたしも はやく おきて、父と いっしょに はしり【4】です。","passZh":"我爸爸每天早上五點起床。起床後馬上去附近的河邊跑步。跑一個小時左右之後回家沖澡。然後一邊看報紙一邊吃早餐。爸爸說「只要活動身體，一整天都會很有精神」。不過我早上很不行，所以還一次都沒有跟他一起去過。從下個月起我也想早點起床，和爸爸一起跑步。（【1】＝行きます、【2】＝ながら、【3】＝でも、【4】＝たい）","q":"【1】","c":["行って","行った","行きます","行き"],"a":2,"e":"「ます形＋に 行きます」＝去做某事。走りに 行きます＝去跑步，句尾要用 行きます。<br>其他選項：行って・行った・行き 都不能當句尾。<br><b>答案在哪一句</b>：第一段「近くの 川まで 走りに 【1】」—— 句號前面要是完整的句尾。"},{"pass":"わたしの 父は まいあさ 五時に おきます。おきて すぐ、ちかくの 川まで はしりに 【1】。<br>一時間ぐらい はしって から、うちへ かえって シャワーを あびます。そして 新聞を 読み【2】 あさごはんを 食べます。<br>父は 「からだを うごかすと、一日 げんきに いられる」と 言って います。【3】、わたしは あさが よわいですから、まだ いちども いっしょに 行った ことが ありません。<br>来月から わたしも はやく おきて、父と いっしょに はしり【4】です。","passZh":"我爸爸每天早上五點起床。起床後馬上去附近的河邊跑步。跑一個小時左右之後回家沖澡。然後一邊看報紙一邊吃早餐。爸爸說「只要活動身體，一整天都會很有精神」。不過我早上很不行，所以還一次都沒有跟他一起去過。從下個月起我也想早點起床，和爸爸一起跑步。（【1】＝行きます、【2】＝ながら、【3】＝でも、【4】＝たい）","q":"【2】","c":["ないで","たり","ても","ながら"],"a":3,"e":"兩件事同時做用「ます形＋ながら」：新聞を 読みながら 朝ごはんを 食べます。<br>其他選項：ないで＝不做…就…、たり＝舉例、ても＝即使，意思都不通。<br><b>答案在哪一句</b>：第二段。看到「読み」這個ます形語幹就知道後面要接 ながら。"},{"pass":"わたしの 父は まいあさ 五時に おきます。おきて すぐ、ちかくの 川まで はしりに 【1】。<br>一時間ぐらい はしって から、うちへ かえって シャワーを あびます。そして 新聞を 読み【2】 あさごはんを 食べます。<br>父は 「からだを うごかすと、一日 げんきに いられる」と 言って います。【3】、わたしは あさが よわいですから、まだ いちども いっしょに 行った ことが ありません。<br>来月から わたしも はやく おきて、父と いっしょに はしり【4】です。","passZh":"我爸爸每天早上五點起床。起床後馬上去附近的河邊跑步。跑一個小時左右之後回家沖澡。然後一邊看報紙一邊吃早餐。爸爸說「只要活動身體，一整天都會很有精神」。不過我早上很不行，所以還一次都沒有跟他一起去過。從下個月起我也想早點起床，和爸爸一起跑步。（【1】＝行きます、【2】＝ながら、【3】＝でも、【4】＝たい）","q":"【3】","c":["でも","そして","だから","それから"],"a":0,"e":"爸爸很有精神、但我早上起不來，<b>前後相反</b> → でも。<br>其他選項：そして・それから 是順著接、だから 是因果。<br><b>答案在哪一句</b>：第三段開頭。前一句是正面、後一句是負面，就是轉折。"},{"pass":"わたしの 父は まいあさ 五時に おきます。おきて すぐ、ちかくの 川まで はしりに 【1】。<br>一時間ぐらい はしって から、うちへ かえって シャワーを あびます。そして 新聞を 読み【2】 あさごはんを 食べます。<br>父は 「からだを うごかすと、一日 げんきに いられる」と 言って います。【3】、わたしは あさが よわいですから、まだ いちども いっしょに 行った ことが ありません。<br>来月から わたしも はやく おきて、父と いっしょに はしり【4】です。","passZh":"我爸爸每天早上五點起床。起床後馬上去附近的河邊跑步。跑一個小時左右之後回家沖澡。然後一邊看報紙一邊吃早餐。爸爸說「只要活動身體，一整天都會很有精神」。不過我早上很不行，所以還一次都沒有跟他一起去過。從下個月起我也想早點起床，和爸爸一起跑步。（【1】＝行きます、【2】＝ながら、【3】＝でも、【4】＝たい）","q":"【4】","c":["ましょう","たい","ほしい","たいで"],"a":1,"e":"「ます形＋たいです」＝想做…。走ります → 走りたいです。<br>其他選項：ましょう＝邀約、ほしい 要接名詞、たいで 形態不對。<br><b>答案在哪一句</b>：最後一句「わたしも …… 走り【4】です」。"}]},{"no":4,"title":"問題4","instr":"つぎの 文を 読んで、しつもんに こたえて ください。こたえは 1・2・3・4から いちばん いい ものを 一つ えらんで ください。","items":[{"pass":"（きょうしつの ドアに はりがみが あります）<br>「あしたの じゅぎょうは 301の きょうしつでは ありません。205の きょうしつで します。<br>　じしょを わすれないで もって きて ください。　田中」","passZh":"（教室門上貼著公告）「明天的課不在 301 教室，在 205 教室上。請不要忘記帶字典來。 田中」","q":"あした 学生は 何を もって 行きますか。","c":["きょうかしょ","ノート","じしょ","えんぴつ"],"a":2,"e":"「じしょを わすれないで 持って きて ください」。<br>其他選項：課本、筆記本、鉛筆，公告都沒有提到。<br><b>答案在哪一句</b>：最後一行。<b>陷阱</b>：301 是<b>被否定掉</b>的教室，不要看到數字就選。"},{"pass":"わたしの うちには ねこが 二ひき います。<br>あさは わたしの へやで ねて いますが、よるに なると 外へ 出て 行きます。<br>そして あさ、わたしが おきる まえに かならず かえって きます。","passZh":"我家有兩隻貓。早上在我房間睡覺，一到晚上就會跑到外面去。然後早上在我起床之前一定會回來。","q":"ねこは よる どこに いますか。","c":["この 人の へや","だいどころ","となりの うち","外"],"a":3,"e":"「よるに なると 外へ 出て 行きます」＝晚上到外面去。<br>其他選項：房間是< ":"N","t":"れい。"},{"r":"N","t":"男の人は 何さいですか。"},{"p":12},{"r":"F","t":"山田さんは 二十さいですか。"},{"r":"M","t":"いいえ、二十二さいです。"},{"r":"N","t":"男の人は 何さいですか。"},{"r":"N","t":"いちばん いい ものは 3ばんです。"}]},"items":[{"n":1,"play":[{"r":"N","t":"1ばん。"},{"r":"N","t":"パーティーに 何人 来ますか。"},{"p":12},{"r":"M","t":"あしたの パーティー、何人 来ますか。"},{"r":"F","t":"はじめは 六人の よていでしたが、二人 来られなく なりました。"},{"r":"M","t":"じゃ、四人ですね。"},{"r":"F","t":"あ、でも きのう 山田さんが 行きたいと 言って いましたよ。"},{"r":"M","t":"そうですか。じゃ、ちょうど いいですね。"},{"r":"N","t":"パーティーに 何人 来ますか。"}],"q":"パーティーに 何人 来ますか。","a":3,"gap":10,"zh":"男：明天的派對幾個人來？／女：原本預定六個人，但有兩個人不能來了。／男：那就是四個人囉。／女：啊，不過昨天山田先生說他想來喔。／男：這樣啊，那剛剛好呢。","e":"<b>關鍵句</b>：六人 − 二人 ＝ 四人、「<b>山田さんが 行きたいと 言って いました</b>」＋一人 ＝ <b>五人</b>。<br>其他選項：六人 是原本的預定、四人 是男生算到一半的數字、三人 沒出現。<br><b>提醒</b>：對話<b>最後</b>才追加的資訊常常改變答案，不能聽到一半就作答。","c":["三人","五人","六人","四人"]},{"n":2,"play":[{"r":"N","t":"2ばん。"},{"r":"N","t":"二人が 出かける とき、てんきは どうですか。"},{"p":12},{"r":"F","t":"あしたは どんな てんきに なりますか。"},{"r":"M","t":"あさは あめですが、ひるから はれるそうですよ。"},{"r":"F","t":"そうですか。じゃ、ひるから 出かけましょう。"},{"r":"M","t":"ええ、そう しましょう。"},{"r":"N","t":"二人が 出かける とき、てんきは どうですか。"}],"q":"二人が 出かける とき、てんきは どうですか。","a":0,"gap":10,"zh":"女：明天天氣會怎麼樣？／男：早上下雨，不過聽說中午之後會放晴喔。／女：這樣啊，那我們中午之後再出門吧。／男：嗯，就這麼辦。","e":"<b>關鍵句</b>：「<b>ひるから はれる</b>」＋「<b>ひるから 出かけましょう</b>」＝出門時是晴天。<br>其他選項：<b>あめ 是早上的天氣</b>，不是出門的時候；くもり・ゆき 完全沒提到。<br><b>提醒</b>：問的是「出門的時候」，要把時間和天氣對起來，不是聽到第一個天氣就選。","c":["はれ","あめ","くもり","ゆき"]},{"n":3,"play":[{"r":"N","t":"3ばん。"},{"r":"N","t":"男の人は あした 何時に 来ますか。"},{"p":12},{"r":"M","t":"あしたの かいぎは 十時からですね。"},{"r":"F","t":"ええ。でも、じゅんびが ありますから、三十分 前に 来て ください。"},{"r":"M","t":"わかりました。"},{"r":"F","t":"おねがいします。"},{"r":"N","t":"男の人は あした 何時に 来ますか。"}],"q":"男の人は あした 何時に 来ますか。","a":1,"gap":10,"zh":"男：明天的會議是十點開始對吧。／女：嗯。不過要準備，請提早三十分鐘來。／男：知道了。／女：麻煩你了。","e":"<b>關鍵句</b>：十時の <b>三十分 前</b> ＝ 九時半。<br>其他選項：十時 是會議開始的時間、九時 和 十時半 都沒出現。<br><b>提醒</b>：「〜分 前」要自己算，不會直接唸出答案。","c":["九時","九時半","十時","十時半"]},{"n":4,"play":[{"r":"N","t":"4ばん。"},{"r":"N","t":"女の人は あした じしょを どう しますか。"},{"p":12},{"r":"F","t":"あしたの テスト、何を もって 行きますか。"},{"r":"M","t":"えんぴつと けしゴムだけで いいそうですよ。"},{"r":"F","t":"じしょは。"},{"r":"M","t":"あ、じしょは つかっても いいと 先生が 言って いました。"},{"r":"F","t":"じゃ、もって 行きます。"},{"r":"N","t":"女の人は あした じしょを どう しますか。"}],"q":"女の人は あした じしょを どう しますか。","a":2,"gap":10,"zh":"女：明天的考試要帶什麼去？／男：聽說只要鉛筆和橡皮擦就好。／女：字典呢？／男：啊，老師說字典可以用。／女：那我帶去。","e":"<b>關鍵句</b>：「<b>じしょは 使っても いい</b>」＋「<b>じゃ、持って 行きます</b>」。<br>其他選項：えんぴつ 是本來就要帶的、ノート 和 きょうかしょ 沒提到。<br><b>提醒</b>：問的是「じしょ 怎麼處理」，答案在女生最後那句決定。","c":["ノート","えんぴつ","じしょ","きょうかしょ"]},{"n":5,"play":[{"r":"N","t":"5ばん。"},{"r":"N","t":"女の人は これから 何を しますか。"},{"p":12},{"r":"M","t":"かおいろが わるいですね。だいじょうぶですか。"},{"r":"F","t":"ちょっと ねつが あるんです。"},{"r":"M","t":"それは たいへんですね。きょうは 休んだ ほうが いいですよ。"},{"r":"F","t":"ええ。でも、その 前に びょういんへ 行って きます。"},{"r":"M","t":"そう ですね。その ほうが いいです。"},{"r":"N","t":"女の人は これから 何を しますか。"}],"q":"女の人は これから 何を しますか。","a":3,"gap":10,"zh":"男：你臉色很差呢，還好嗎？／女：我有點發燒。／男：那很不妙呢，今天還是休息比較好喔。／女：嗯。不過在那之前我要先去醫院。／男：也對，那樣比較好。","e":"<b>關鍵句</b>：「<b>その 前に びょういんへ 行って きます</b>」＝先去醫院。<br>其他選項：<b>うちで ねます 是去完醫院「之後」的事</b>（その 前に 的「その」指的就是休息）；上班和買藥都沒提到。<br><b>提醒</b>：「その 前に」會把順序整個翻過來，是這一類題目最常見的陷阱。","c":["うちで ねます","かいしゃへ 行きます","くすりを 買います","びょういんへ 行きます"]},{"n":6,"play":[{"r":"N","t":"6ばん。"},{"r":"N","t":"女の人は いくら はらいますか。"},{"p":12},{"r":"F","t":"すみません、この りんごは いくらですか。"},{"r":"M","t":"一つ 二百円です。三つ 買うと、五百円に なりますよ。"},{"r":"F","t":"じゃ、三つ ください。あ、この みかんも 一つ。"},{"r":"M","t":"みかんは 一つ 二百円です。ぜんぶで 七百円です。"},{"r":"F","t":"はい。"},{"r":"N","t":"女の人は いくら はらいますか。"}],"q":"女の人は いくら はらいますか。","a":0,"gap":10,"zh":"女：不好意思，這個蘋果多少錢？／男：一個兩百圓。買三個的話是五百圓喔。／女：那請給我三個。啊，這個橘子也要一個。／男：橘子一個兩百圓。總共七百圓。／女：好的。","e":"<b>關鍵句</b>：蘋果三個 500 ＋ 橘子一個 200 ＝ <b>七百円</b>，店員最後也說了一次。<br>其他選項：五百円 是只買蘋果、六百円 是三個蘋果不打折、八百円 是四樣都算兩百。<br><b>提醒</b>：三個蘋果<b>有優惠</b>（600→500），不能直接乘。","c":["七百円","五百円","六百円","八百円"]}]},{"no":3,"title":"問題3　発話表現","instr":"問題3では、えを 見ながら しつもんを 聞いて ください。やじるしの 人は 何と 言いますか。1から3の 中から、いちばん いい ものを 一つ えらんで ください。","ex":{"ex":true,"scene":"img/mock/l3-04.png","q":"ごはんを 食べる まえに、何と 言いますか。","c":["いただきます。","ごちそうさまでした。","おねがいします。"],"a":0,"zh":"旁白：吃飯之前要說什麼？","play":[{"r":"N","t":"れい。"},{"r":"N","t":"ごはんを 食べる まえに、何と 言いますか。"},{"r":"N","t":"1ばん。"},{"r":"M","t":"いただきます。"},{"r":"N","t":"2ばん。"},{"r":"F","t":"ごちそうさまでした。"},{"r":"N","t":"3ばん。"},{"r":"M","t":"おねがいします。"},{"r":"N","t":"いちばん いい ものは 1ばんです。"}]},"items":[{"n":1,"scene":"img/mock/l3-05.png","play":[{"r":"N","t":"1ばん。"},{"r":"N","t":"これから 会社へ 行きます。いえの 人に 何と 言いますか。"},{"r":"N","t":"1ばん。"},{"r":"M","t":"いって きます。"},{"r":"N","t":"2ばん。"},{"r":"F","t":"いって らっしゃい。"},{"r":"N","t":"3ばん。"},{"r":"M","t":"ただいま。"}],"q":"何と 言いますか。","c":["いって きます。","いって らっしゃい。","ただいま。"],"a":0,"gap":8,"zh":"旁白：現在要出門去公司。對家人要說什麼？","e":"出門的人說「<b>いって きます</b>」。<br>其他選項：いって らっしゃい＝慢走，是<b>送人的人</b>說的；ただいま＝我回來了。<br><b>陷阱</b>：いって きます 和 いって らっしゃい 只差幾個音，說話的人卻完全相反 ——箭頭指的是<b>要出門的人</b>。","hideChoices":true},{"n":2,"scene":"img/mock/l3-06.png","play":[{"r":"N","t":"2ばん。"},{"r":"N","t":"ねる 時間に なりました。いえの 人に 何と 言いますか。"},{"r":"N","t":"1ばん。"},{"r":"M","t":"おやすみなさい。"},{"r":"N","t":"2ばん。"},{"r":"F","t":"こんばんは。"},{"r":"N","t":"3ばん。"},{"r":"M","t":"おはよう ございます。"}],"q":"何と 言いますか。","c":["こんばんは。","おやすみなさい。","おはよう ございます。"],"a":1,"gap":8,"zh":"旁白：到睡覺的時間了。對家人要說什麼？","e":"睡前說「<b>おやすみなさい</b>」。<br>其他選項：こんばんは＝晚上<b>見面</b>時的招呼、おはよう ございます＝早安。<br><b>陷阱</b>：三個都和時間有關，但 こんばんは 是「見到人」時說的，不是「要去睡」時說的。","hideChoices":true},{"n":3,"scene":"img/mock/l3-11.png","play":[{"r":"N","t":"3ばん。"},{"r":"N","t":"ともだちが びょうきです。かえる とき 何と 言いますか。"},{"r":"N","t":"1ばん。"},{"r":"M","t":"おだいじに。"},{"r":"N","t":"2ばん。"},{"r":"F","t":"おめでとう ございます。"},{"r":"N","t":"3ばん。"},{"r":"M","t":"いらっしゃいませ。"}],"q":"何と 言いますか。","c":["おめでとう ございます。","いらっしゃいませ。","おだいじに。"],"a":2,"gap":8,"zh":"旁白：朋友生病了。要離開時說什麼？","e":"對生病的人說「<b>おだいじに</b>」＝請保重。<br>其他選項：おめでとう ございます＝恭喜、いらっしゃいませ＝歡迎光臨（店員說的）。<br><b>陷阱</b>：おだいじに 只用在對方身體不舒服的時候，是整組要背起來的說法。","hideChoices":true},{"n":4,"scene":"img/mock/l3-13.png","play":[{"r":"N","t":"4ばん。"},{"r":"N","t":"先生の へやの ドアを ノックしました。入る とき 何と 言いますか。"},{"r":"N","t":"1ばん。"},{"r":"M","t":"しつれいします。"},{"r":"N","t":"2ばん。"},{"r":"F","t":"ごめんなさい。"},{"r":"N","t":"3ばん。"},{"r":"M","t":"おじゃまします。"}],"q":"何と 言いますか。","c":["しつれいします。","ごめんなさい。","おじゃまします。"],"a":0,"gap":8,"zh":"旁白：敲了老師辦公室的門。要進去的時候說什麼？","e":"進老師、上司的房間說「<b>しつれいします</b>」。<br>其他選項：ごめんなさい＝對不起（做錯事）、おじゃまします＝打擾了，用在<b>進別人家裡</b>。<br><b>陷阱</b>：おじゃまします 和 しつれいします 都是進門說的，差別在<b>場合</b> ——私人住家用 おじゃまします、學校或公司用 しつれいします。","hideChoices":true},{"n":5,"scene":"img/mock/l3-14.png","play":[{"r":"N","t":"5ばん。"},{"r":"N","t":"はじめて 会う 人に あいさつを します。何と 言いますか。"},{"r":"N","t":"1ばん。"},{"r":"M","t":"はじめまして。"},{"r":"N","t":"2ばん。"},{"r":"F","t":"おひさしぶりです。"},{"r":"N","t":"3ばん。"},{"r":"M","t":"こちらこそ。"}],"q":"何と 言いますか。","c":["おひさしぶりです。","はじめまして。","こちらこそ。"],"a":1,"gap":8,"zh":"旁白：向第一次見面的人打招呼。這時候要說什麼？","e":"第一次見面說「<b>はじめまして</b>」。<br>其他選項：おひさしぶりです＝好久不見（<b>見過</b>的人）、こちらこそ＝彼此彼此（是<b>回應</b>對方的話）。<br><b>陷阱</b>：こちらこそ 要在對方先說了「よろしく」之後才用，不能當開場白。","hideChoices":true}]},{"no":4,"title":"問題4　即時応答","instr":"問題4では、えなどが ありません。ぶんを 聞いて、1から3の 中から、いちばん いい ものを 一つ えらんで ください。","ex":{"ex":true,"q":"（へんじを えらんで ください）","c":["ええ、そうですね。","ええ、てんきです。","いいえ、ちがいます。"],"a":0,"zh":"男：今天天氣真好呢。","play":[{"r":"N","t":"れい。"},{"r":"M","t":"きょうは いい てんきですね。"},{"r":"F","t":"ええ、そうですね。"},{"r":"F","t":"ええ、てんきです。"},{"r":"F","t":"いいえ、ちがいます。"},{"r":"N","t":"いちばん いい ものは 1ばんです。"}]},"items":[{"n":1,"play":[{"r":"N","t":"1ばん。"},{"r":"F","t":"この しりょう、コピーしましょうか。"},{"r":"M","t":"はい、おねがいします。"},{"r":"M","t":"はい、コピーしました。"},{"r":"M","t":"いいえ、コピーします。"}],"q":"（へんじを えらんで ください）","c":["はい、コピーしました。","いいえ、コピーします。","はい、おねがいします。"],"a":2,"gap":8,"zh":"女：這份資料要我幫你影印嗎？","e":"「〜ましょうか」是<b>主動提議幫忙</b>，接受就說「はい、おねがいします」。<br>其他選項：「コピーしました」＝我印好了（<b>時態和主客都不對</b>）；「いいえ、コピーします」拒絕卻又說要印，前後矛盾。","hideChoices":true},{"n":2,"play":[{"r":"N","t":"2ばん。"},{"r":"M","t":"すみません、この へんに ゆうびんきょくは ありますか。"},{"r":"F","t":"あの ビルの となりに ありますよ。"},{"r":"F","t":"ゆうびんきょくへ 行きます。"},{"r":"F","t":"はい、ゆうびんきょくです。"}],"q":"（へんじを えらんで ください）","c":["あの ビルの となりに ありますよ。","ゆうびんきょくへ 行きます。","はい、ゆうびんきょくです。"],"a":0,"gap":8,"zh":"男：不好意思，這附近有郵局嗎？","e":"問「有沒有」，要回答<b>位置</b>。<br>其他選項：「ゆうびんきょくへ 行きます」是說自己要去（答非所問）；「はい、ゆうびんきょくです」是回答「這裡是哪裡」。<br><b>陷阱</b>：三個答案都有「ゆうびんきょく」，只有第一個回答到「在不在、在哪裡」。","hideChoices":true},{"n":3,"play":[{"r":"N","t":"3ばん。"},{"r":"F","t":"しゅくだいは いつまでですか。"},{"r":"M","t":"来週の 月よう日までです。"},{"r":"M","t":"二時間 かかりました。"},{"r":"M","t":"先生に もらいました。"}],"q":"（へんじを えらんで ください）","c":["二時間 かかりました。","来週の 月よう日までです。","先生に もらいました。"],"a":1,"gap":8,"zh":"女：作業到什麼時候？","e":"「いつまで」問<b>期限</b>，要回答時間點。<br>其他選項：「二時間 かかりました」是回答<b>花了多久</b>（どのくらい）；「先生に もらいました」是回答<b>跟誰拿的</b>（だれに）。<br><b>陷阱</b>：まで＝到…為止（期限），和「どのくらい」（時間長度）是兩種問法。","hideChoices":true},{"n":4,"play":[{"r":"N","t":"4ばん。"},{"r":"M","t":"いっしょに ばんごはんを 食べに 行きませんか。"},{"r":"F","t":"ええ、行きましょう。"},{"r":"F","t":"ええ、食べました。"},{"r":"F","t":"いいえ、食べません。"}],"q":"（へんじを えらんで ください）","c":["ええ、食べました。","いいえ、食べません。","ええ、行きましょう。"],"a":2,"gap":8,"zh":"男：要不要一起去吃晚餐？","e":"「〜ませんか」是<b>邀約</b>，答應就用「ましょう」回。<br>其他選項：「食べました」是在講過去的事；「いいえ、食べません」雖然文法沒錯，但直接這樣拒絕很失禮，日文會說「すみません、ちょっと…」。<br><b>陷阱</b>：ませんか 形式上是否定疑問，意思卻是邀請，不要照字面回答。","hideChoices":true},{"n":5,"play":[{"r":"N","t":"5ばん。"},{"r":"F","t":"かばんは どこに おきましょうか。"},{"r":"M","t":"そこの いすの 上に おいて ください。"},{"r":"M","t":"かばんを 買いました。"},{"r":"M","t":"いいえ、おきません。"}],"q":"（へんじを えらんで ください）","c":["そこの いすの 上に おいて ください。","かばんを 買いました。","いいえ、おきません。"],"a":0,"gap":8,"zh":"女：包包要放哪裡？","e":"「どこに」問<b>地點</b>，要回答放的位置。<br>其他選項：「かばんを 買いました」答非所問；「いいえ、おきません」—— 對方問的不是要不要放，而是放哪裡，不能用 はい／いいえ 回答。<br><b>陷阱</b>：疑問詞的問句<b>不能用 はい／いいえ 回答</b>，這是最好用的刪去法。","hideChoices":true},{"n":6,"play":[{"r":"N","t":"6ばん。"},{"r":"M","t":"きのうの えいが、どうでしたか。"},{"r":"F","t":"とても おもしろかったです。"},{"r":"F","t":"ともだちと 見ました。"},{"r":"F","t":"八時からでした。"}],"q":"（へんじを えらんで ください）","c":["ともだちと 見ました。","とても おもしろかったです。","八時からでした。"],"a":1,"gap":8,"zh":"男：昨天的電影怎麼樣？","e":"「どうでしたか」問<b>感想</b>，要用形容詞回答，而且是過去式。<br>其他選項：「ともだちと 見ました」是回答<b>和誰看</b>（だれと）；「八時からでした」是回答<b>幾點</b>（何時から）。<br><b>陷阱</b>：三個答案都和電影有關，但只有第一個回答到「感覺如何」。","hideChoices":true}]}],"n":24}]}</script>
<script id="paper-C" type="application/json">{"id":"C","name":"C 卷","pass":{"total":80,"a":38,"b":19},"sections":[{"key":"moji","label":"言語知識（文字・語彙）","min":20,"parts":[{"no":1,"title":"問題1","instr":"＿＿の ことばは ひらがなで どう 書きますか。1・2・3・4から いちばん いい ものを 一つ えらんで ください。","items":[{"q":"きょうは <span class=\"ul\">火よう日</span>です。","c":["かようび","ひようび","かようひ","もくようび"],"a":0,"e":"火曜日＝かようび。<br>其他選項：もくようび＝木曜日、ひようび・かようひ 都不是正確唸法。<br><b>容易選錯的地方</b>：星期的「火」唸 か 不唸 ひ。七天要整組背：月（げつ）火（か）水（すい）木（もく）金（きん）土（ど）日（にち）。"},{"q":"<span class=\"ul\">百円</span> あります。","c":["びゃくえん","ひゃくえん","ひゃっえん","はくえん"],"a":1,"e":"百円＝ひゃくえん。<br>其他選項：びゃくえん・ひゃっえん・はくえん 都不是正確唸法。<br><b>容易選錯的地方</b>：百 在不同數字前會變音 —— 三百（さんびゃく）、六百（ろっぴゃく）、八百（はっぴゃく），只有單獨的 百 唸 ひゃく。"},{"q":"この <span class=\"ul\">花</span>は きれいですね。","c":["か","くさ","はな","はなし"],"a":2,"e":"花＝はな。<br>其他選項：か 是音讀（花瓶＝かびん）、くさ＝草、はなし＝話（說話，漢字不同）。<br><b>容易選錯的地方</b>：はな 同時是「花」和「鼻」，兩個同音不同漢字，看漢字就不會錯。"},{"q":"<span class=\"ul\">先生</span>に ききます。","c":["せんせえ","さきせい","せんしょう","せんせい"],"a":3,"e":"先生＝せんせい。<br>其他選項：せんせえ 是口語的聽感，寫法不對；さきせい・せんしょう 不是詞。<br><b>容易選錯的地方</b>：「先」單獨唸 さき（先に＝先），在 先生・先月 這種詞裡唸 せん。"},{"q":"あの <span class=\"ul\">白い</span> くつが ほしいです。","c":["しろい","くろい","はくい","しらい"],"a":0,"e":"白い＝しろい。<br>其他選項：くろい＝黒い（黑，意思相反）、はく 是音讀（白紙＝はくし）、しらい 不是詞。<br><b>容易選錯的地方</b>：顏色的形容詞 白い・黒い・赤い・青い 字形都是「顏色字＋い」，要連漢字一起記。"},{"q":"ノートに 名前を <span class=\"ul\">書きます</span>。","c":["しょきます","かきます","よみます","かいます"],"a":1,"e":"書きます＝かきます（寫）。<br>其他選項：しょ 是音讀（図書館＝としょかん）、よみます＝読みます（讀）、かいます＝買います（買）。<br><b>容易選錯的地方</b>：かきます 和 かいます 只差一個音，一個是寫、一個是買，看漢字就分得出來。"},{"q":"えきで 友だちに <span class=\"ul\">会いました</span>。","c":["かいました","あいしました","あいました","えました"],"a":2,"e":"会いました＝あいました（見面了）。<br>其他選項：かいました＝買いました（買了）、あいしました＝愛しました（愛過）、えました 不是詞。<br><b>容易選錯的地方</b>：「会」在 会社（かいしゃ）裡唸 かい，單獨當動詞唸 あ；見面的對象要用助詞 に。"}]},{"no":2,"title":"問題2","instr":"＿＿の ことばは どう 書きますか。1・2・3・4から いちばん いい ものを 一つ えらんで ください。","items":[{"q":"<span class=\"ul\">みなみ</span>の まどを しめます。","c":["北","東","西","南"],"a":3,"e":"南（みなみ）＝南。<br>其他選項：北＝きた、東＝ひがし、西＝にし。<br><b>容易選錯的地方</b>：方位四個字沒有共同部首，只能一個一個記；「南」裡面有「￥」的形狀可以當記號。"},{"q":"あの <span class=\"ul\">みせ</span>は 安いです。","c":["店","広","庄","占"],"a":0,"e":"店（みせ）＝店。<br>其他選項：広＝ひろい 的広（寬）、庄・占 字形相近但不是這個詞。<br><b>容易選錯的地方</b>：店・広・庄 外面都是「广」，店 裡面是「占」，記成「广＋占」。"},{"q":"<span class=\"ul\">やすみ</span>の 日は 何を しますか。","c":["体み","休み","休","仕み"],"a":1,"e":"休み（やすみ）＝休假、休息。<br>其他選項：体＝からだ（身體），和「休」只差一筆；「休」沒有送り仮名「み」就不是名詞。<br><b>容易選錯的地方</b>：休（にんべん＋木）和 体（にんべん＋本）差在最後那一橫。"},{"q":"あとで <span class=\"ul\">でんわ</span>します。","c":["雷話","電語","電話","電読"],"a":2,"e":"電話（でんわ）＝電話。<br>其他選項：雷＝かみなり（雷），和「電」只差下面那一筆；語・読 和 話 都是言字旁，湊成的詞不存在。<br><b>容易選錯的地方</b>：電 下面有一條彎鉤、雷 沒有；話 右邊是「舌」。"},{"q":"<span class=\"ul\">ごぜん</span> 八時に でかけます。","c":["牛前","午後","前午","午前"],"a":3,"e":"午前（ごぜん）＝上午。<br>其他選項：午後＝ごご（下午，意思相反）、「牛」是 うし 和「午」只差一筆、「前午」不是詞。<br><b>容易選錯的地方</b>：午 和 牛 的差別在最上面那一撇有沒有突出來。"}]},{"no":3,"title":"問題3","instr":"（　）に 何を 入れますか。1・2・3・4から いちばん いい ものを 一つ えらんで ください。","items":[{"q":"この <span class=\"bk\">　　</span>は とても おもしろいです。もう 三かい 読みました。","c":["本","えいが","おんがく","りょうり"],"a":0,"e":"後面說「読みました」（讀了），所以是書。<br>其他選項：えいが 要用 見ます、おんがく 用 聞きます、りょうり 用 食べます／作ります。<br><b>容易選錯的地方</b>：這類題目的線索常常在<b>後半句的動詞</b>，先看動詞再回頭選名詞。"},{"q":"しゅくだいを わすれましたから、先生に <span class=\"bk\">　　</span>。","c":["ほめられました","しかられました","たすけました","あいました"],"a":1,"e":"忘記寫作業會被老師罵 → しかられました。<br>其他選項：ほめられました＝被稱讚（相反）、たすけました＝（我）幫助了、あいました＝見面。<br><b>容易選錯的地方</b>：前半句是負面的原因，後半句要跟著是負面的結果。"},{"q":"この みちは <span class=\"bk\">　　</span>ですから、気を つけて ください。","c":["あんぜん","しずか","あぶない","きれい"],"a":2,"e":"因為危險才要小心 → あぶない。<br>其他選項：あんぜん＝安全（相反，那就不用小心）、しずか＝安靜、きれい＝乾淨。<br><b>容易選錯的地方</b>：要從後半句「気を つけて ください」反推前半句是負面的。"},{"q":"ふくが <span class=\"bk\">　　</span>ですから、あたらしいのを 買います。","c":["あたらしい","たかい","かるい","ふるい"],"a":3,"e":"因為衣服舊了才買新的 → ふるい。<br>其他選項：あたらしい 和後半句的「あたらしいのを 買います」重複、たかい＝貴（貴不是換新的理由）、かるい＝輕。<br><b>容易選錯的地方</b>：後半句已經出現「あたらしい」，前半句一定是它的相反詞。"},{"q":"えいがが はじまりますから、ケータイの でんげんを <span class=\"bk\">　　</span> ください。","c":["けして","つけて","あけて","かけて"],"a":0,"e":"電影開始前要把手機<b>關掉</b> → けして。<br>其他選項：つけて＝打開（電器）、あけて＝打開（門窗）、かけて＝打（電話）／戴（眼鏡）。<br><b>容易選錯的地方</b>：けす／つける 是電器那一組，あける／しめる 是門窗那一組，不要混用。"},{"q":"この しごとは 一人では <span class=\"bk\">　　</span>ですから、てつだって ください。","c":["かんたん","たいへん","べんり","じょうず"],"a":1,"e":"一個人做很吃力才需要幫忙 → たいへん。<br>其他選項：かんたん＝簡單（那就不用幫忙）、べんり＝方便、じょうず＝擅長。<br><b>容易選錯的地方</b>：線索在後半句「てつだって ください」（請幫忙）。"}]},{"no":4,"title":"問題4","instr":"＿＿の ぶんと だいたい 同じ いみの ぶんが あります。1・2・3・4から いちばん いい ものを 一つ えらんで ください。","items":[{"q":"この へやは <span class=\"ul\">ひろく ありません</span>。","c":["この へやは ひろいです。","この へやは あかるいです。","この へやは せまいです。","この へやは しずかです。"],"a":2,"e":"ひろく ない（不寬）＝せまい（窄）。<br>其他選項：ひろい 是相反、あかるい＝亮、しずか＝安靜，講的都不是大小。<br><b>容易選錯的地方</b>：い形容詞的否定「〜く ありません」＝「〜く ないです」，再換成相反的形容詞就是答案。"},{"q":"きのう 田中さんに <span class=\"ul\">本を かえしました</span>。","c":["きのう 田中さんに 本を かしました。","きのう 田中さんから 本を もらいました。","きのう 田中さんの 本を 買いました。","きのうまで 田中さんの 本を かりて いました。"],"a":3,"e":"「返しました」＝把借來的東西還回去，所以之前是跟對方借的。<br>其他選項：かしました＝借給對方（方向相反）、もらいました＝收下（不用還）、買いました＝買下來。<br><b>容易選錯的地方</b>：かります（借入）→ 返します（還）是一組；かします（借出）的相對動作是對方來還。"},{"q":"こんしゅうは <span class=\"ul\">まいにち ざんぎょうしました</span>。","c":["こんしゅうは とても いそがしかったです。","こんしゅうは ひまでした。","こんしゅうは 休みました。","こんしゅうは はやく かえりました。"],"a":0,"e":"每天加班＝非常忙。<br>其他選項：ひま＝有空（相反）、休みました＝請假、早く 帰りました＝早退，都和加班矛盾。<br><b>容易選錯的地方</b>：這類題目要把<b>具體的事</b>（每天加班）換成<b>抽象的描述</b>（很忙）。"}]}],"n":21},{"key":"bunpou","label":"言語知識（文法）・読解","min":40,"parts":[{"no":1,"title":"問題1","instr":"（　）に 何を 入れますか。1・2・3・4から いちばん いい ものを 一つ えらんで ください。","items":[{"q":"きのう デパート<span class=\"bk\">　　</span> くつを 買いました。","c":["に","で","へ","を"],"a":1,"e":"動作發生的場所用 <b>で</b>。<br>其他選項：に 是存在的地方或到達點、へ 是方向、を 是受詞（くつを 已經用了）。<br><b>同類對照</b>：<b>で</b>＝在哪裡做（デパートで 買います）vs <b>に</b>＝在哪裡有（デパートに あります）vs <b>へ</b>＝往哪裡去（デパートへ 行きます）。"},{"q":"わたしは まいあさ 新聞<span class=\"bk\">　　</span> 読みます。","c":["が","に","を","で"],"a":2,"e":"動詞的受詞用 <b>を</b>。<br>其他選項：が 是主語、に 是對象或時間、で 是場所或手段。<br><b>同類對照</b>：讀的東西用 を；但「〜が 好きです」「〜が わかります」這類形容詞句要用 が。"},{"q":"へやの でんきが <span class=\"bk\">　　</span> います。","c":["つけて","つく","つけ","ついて"],"a":3,"e":"「自動詞て形＋います」＝現在的狀態。でんきが ついて います＝燈亮著。<br>其他選項：つけて 是他動詞（人去開），要說「でんきを つけて います」；つく・つけ 接不上 います。<br><b>同類對照</b>：<b>〜が ついて います</b>（狀態）vs <b>〜を つけて います</b>（有人正在開）。"},{"q":"あした 雨が ふったら、どこへも <span class=\"bk\">　　</span>。","c":["行きません","行きます","行きました","行きましょう"],"a":0,"e":"「どこへも」後面一定接<b>否定</b>。<br>其他選項：行きます・行きました・行きましょう 都是肯定，和 どこへも 搭不起來。<br><b>同類對照</b>：疑問詞＋も＋否定（都不…）／疑問詞＋でも＋肯定（都…）。"},{"q":"この かんじは むずかしいですから、よく <span class=\"bk\">　　</span> ください。","c":["おぼえ","おぼえて","おぼえる","おぼえた"],"a":1,"e":"請求用「て形＋ください」。おぼえる → おぼえて。<br>其他選項：おぼえ 是ます形語幹、おぼえる 是辭書形、おぼえた 是た形。<br><b>同類對照</b>：<b>〜て ください</b>（請做）／<b>〜ないで ください</b>（請不要做）／<b>〜ても いいですか</b>（可以做嗎）。"},{"q":"うちへ かえる まえに、ぎんこう<span class=\"bk\">　　</span> 行きます。","c":["で","を","へ","が"],"a":2,"e":"移動的目的地用 <b>へ</b>（也可以用 に）。<br>其他選項：で 是動作的場所、を 是受詞或通過的場所、が 是主語。<br><b>同類對照</b>：「〜まえに」前面要用<b>辭書形</b>（帰る まえに），「〜てから」前面用<b>て形</b>（帰ってから）。"},{"q":"わたしは りょうりを つくる<span class=\"bk\">　　</span> すきです。","c":["ことを","のを","ために","のが"],"a":3,"e":"把動作名詞化再接「〜が すきです」，用 <b>のが</b>。<br>其他選項：ことを・のを 的 を 和形容詞 すき 不搭；ために 是目的。<br><b>同類對照</b>：<b>〜のが すき／上手</b>（形容詞，用 が）vs <b>〜ことが できる</b>（能力）。"},{"q":"きょうしつに 学生が 三人<span class=\"bk\">　　</span> いません。","c":["しか","だけ","ばかり","ほど"],"a":0,"e":"「〜しか」後面一定接<b>否定</b>，意思是「只有…（而已）」。三人しか いません＝只有三個人。<br>其他選項：だけ 後面接肯定（三人だけ います）、ばかり・ほど 的意思不對。<br><b>同類對照</b>：<b>だけ＋肯定</b>（只有，中性）vs <b>しか＋否定</b>（只有，帶「太少」的語氣）。"},{"q":"この みせの ケーキは おいしいです<span class=\"bk\">　　</span>、すこし 高いです。","c":["から","が","ので","そして"],"a":1,"e":"好吃是優點、貴是缺點，<b>前後相反</b> → が。<br>其他選項：から・ので 是理由、そして 是順著接下去，都接不起來。<br><b>同類對照</b>：が 接在<b>句尾</b>；放句首的轉折是 でも／しかし。"}]},{"no":2,"title":"問題2","instr":"★に 入る ものは どれですか。1・2・3・4から いちばん いい ものを 一つ えらんで ください。","items":[{"q":"わたしは <span class=\"bk\">　　</span> <span class=\"bk\">　　</span> <span class=\"star\">★</span> <span class=\"bk\">　　</span> あります。","c":["子どもの とき","いちど","この まちに","来た ことが"],"a":2,"e":"正しい順序：わたしは <b>子どもの とき いちど この まちに 来た ことが</b> あります。＝我小時候來過這個城鎮一次。<br>時間（子どもの とき）→ 次數（一度）→ 地點（この 町に）→「た形＋ことが あります」。<br>★的位置是第三格，答案是「この まちに」。"},{"q":"ここは <span class=\"bk\">　　</span> <span class=\"bk\">　　</span> <span class=\"star\">★</span> <span class=\"bk\">　　</span> ところです。","c":["ゆうめいな","おてらが","たくさん","ある"],"a":2,"e":"正しい順序：ここは <b>ゆうめいな おてらが たくさん ある</b> ところです。＝這裡是有很多有名寺廟的地方。<br>な形容詞修飾名詞加 な（ゆうめいな おてら），主語用 が，動詞用普通形修飾後面的名詞（ある ところ）。<br>★的位置是第三格，答案是「たくさん」。"},{"q":"あしたは <span class=\"bk\">　　</span> <span class=\"bk\">　　</span> <span class=\"star\">★</span> <span class=\"bk\">　　</span> つもりです。","c":["どこへも","行かないで","うちで","やすむ"],"a":2,"e":"正しい順序：あしたは <b>どこへも 行かないで うちで やすむ</b> つもりです。＝明天打算哪裡都不去，在家休息。<br>「ない形＋で」＝不做…就…，「辭書形＋つもりです」＝打算。<br>★的位置是第三格，答案是「うちで」。"},{"q":"すみません、 <span class=\"bk\">　　</span> <span class=\"bk\">　　</span> <span class=\"star\">★</span> <span class=\"bk\">　　</span> ますか。","c":["この かばんを","ちょっと","見せて","もらえ"],"a":2,"e":"正しい順序：すみません、<b>この かばんを ちょっと 見せて もらえ</b>ますか。＝不好意思，可以讓我看一下這個包包嗎？<br>「て形＋もらえますか」是比「〜て ください」更客氣的請求。<br>★的位置是第三格，答案是「見せて」。"}]},{"no":3,"title":"問題3","instr":"つぎの 文章を 読んで、【　】に 入る ものを1・2・3・4から 一つ えらんで ください。","items":[{"pass":"わたしの うちには 小さい にわが あります。<br>母は 花が すきですから、そこで いろいろな 花を 【1】 います。はるに なると、あかや 白の 花が さいて、とても きれいです。<br>土よう日の あさは、わたしも 母と いっしょに 水を やります。はじめは めんどうでしたが、いまは 花が すこしずつ 大きく なるのを 見るのが 【2】に なりました。<br>【3】、なつは むしが 多くて たいへんです。母は 「むしも いっしょに すんで いるんですよ」と 言って わらいます。<br>いつか わたしも、じぶんの へやの まどの そとに 花を 【4】です。","passZh":"我家有一個小庭院。媽媽喜歡花，所以在那裡種了各種花。到了春天，紅色和白色的花會開，非常漂亮。星期六早上我也會和媽媽一起澆水。一開始覺得麻煩，現在卻變得喜歡看花一點一點長大。不過夏天蟲很多，很辛苦。媽媽會笑著說「蟲也是一起住在這裡的呀」。哪天我也想在自己房間的窗外種花。（【1】＝そだてて、【2】＝すき、【3】＝でも、【4】＝そだてたい）","q":"【1】","c":["そだて","そだてる","そだてて","そだてた"],"a":2,"e":"「〜て います」表示持續在做，前面接て形：そだてる → そだてて。<br>其他選項：そだて 是ます形語幹、そだてる 是辭書形、そだてた 是た形，都接不上 います。<br><b>答案在哪一句</b>：第一段「いろいろな 花を 【1】 います」—— 看到 います 就知道要て形。"},{"pass":"わたしの うちには 小さい にわが あります。<br>母は 花が すきですから、そこで いろいろな 花を 【1】 います。はるに なると、あかや 白の 花が さいて、とても きれいです。<br>土よう日の あさは、わたしも 母と いっしょに 水を やります。はじめは めんどうでしたが、いまは 花が すこしずつ 大きく なるのを 見るのが 【2】に なりました。<br>【3】、なつは むしが 多くて たいへんです。母は 「むしも いっしょに すんで いるんですよ」と 言って わらいます。<br>いつか わたしも、じぶんの へやの まどの そとに 花を 【4】です。","passZh":"我家有一個小庭院。媽媽喜歡花，所以在那裡種了各種花。到了春天，紅色和白色的花會開，非常漂亮。星期六早上我也會和媽媽一起澆水。一開始覺得麻煩，現在卻變得喜歡看花一點一點長大。不過夏天蟲很多，很辛苦。媽媽會笑著說「蟲也是一起住在這裡的呀」。哪天我也想在自己房間的窗外種花。（【1】＝そだてて、【2】＝すき、【3】＝でも、【4】＝そだてたい）","q":"【2】","c":["すきな","すきで","すきだ","すき"],"a":3,"e":"「〜に なりました」前面接な形容詞的<b>語幹</b>：すきに なりました＝變得喜歡。<br>其他選項：すきな 是接名詞用的、すきで 是連接下一句用的、すきだ 是普通形。<br><b>答案在哪一句</b>：第二段最後。<b>同類對照</b>：い形容詞是「〜く なります」（大きく なる），な形容詞是「〜に なります」。"},{"pass":"わたしの うちには 小さい にわが あります。<br>母は 花が すきですから、そこで いろいろな 花を 【1】 います。はるに なると、あかや 白の 花が さいて、とても きれいです。<br>土よう日の あさは、わたしも 母と いっしょに 水を やります。はじめは めんどうでしたが、いまは 花が すこしずつ 大きく なるのを 見るのが 【2】に なりました。<br>【3】、なつは むしが 多くて たいへんです。母は 「むしも いっしょに すんで いるんですよ」と 言って わらいます。<br>いつか わたしも、じぶんの へやの まどの そとに 花を 【4】です。","passZh":"我家有一個小庭院。媽媽喜歡花，所以在那裡種了各種花。到了春天，紅色和白色的花會開，非常漂亮。星期六早上我也會和媽媽一起澆水。一開始覺得麻煩，現在卻變得喜歡看花一點一點長大。不過夏天蟲很多，很辛苦。媽媽會笑著說「蟲也是一起住在這裡的呀」。哪天我也想在自己房間的窗外種花。（【1】＝そだてて、【2】＝すき、【3】＝でも、【4】＝そだてたい）","q":"【3】","c":["でも","そして","だから","それから"],"a":0,"e":"前面在講庭院的好，後面說夏天蟲多很辛苦，<b>前後相反</b> → でも。<br>其他選項：そして・それから 是順著接、だから 是因果。<br><b>答案在哪一句</b>：第三段開頭。"},{"pass":"わたしの うちには 小さい にわが あります。<br>母は 花が すきですから、そこで いろいろな 花を 【1】 います。はるに なると、あかや 白の 花が さいて、とても きれいです。<br>土よう日の あさは、わたしも 母と いっしょに 水を やります。はじめは めんどうでしたが、いまは 花が すこしずつ 大きく なるのを 見るのが 【2】に なりました。<br>【3】、なつは むしが 多くて たいへんです。母は 「むしも いっしょに すんで いるんですよ」と 言って わらいます。<br>いつか わたしも、じぶんの へやの まどの そとに 花を 【4】です。","passZh":"我家有一個小庭院。媽媽喜歡花，所以在那裡種了各種花。到了春天，紅色和白色的花會開，非常漂亮。星期六早上我也會和媽媽一起澆水。一開始覺得麻煩，現在卻變得喜歡看花一點一點長大。不過夏天蟲很多，很辛苦。媽媽會笑著說「蟲也是一起住在這裡的呀」。哪天我也想在自己房間的窗外種花。（【1】＝そだてて、【2】＝すき、【3】＝でも、【4】＝そだてたい）","q":"【4】","c":["そだてましょう","そだてたい","そだてて ほしい","そだてた"],"a":1,"e":"「ます形＋たいです」＝自己想做…。<br>其他選項：ましょう 是邀約、〜て ほしい 是希望<b>別人</b>做、そだてた 是過去式。<br><b>答案在哪一句</b>：最後一句「いつか わたしも …… 花を 【4】です」。"}]},{"no":4,"title":"問題4","instr":"つぎの 文を 読んで、しつもんに こたえて ください。こたえは 1・2・3・4から いちばん いい ものを 一つ えらんで ください。","items":[{"pass":"（れいぞうこに メモが はって あります）<br>「ゆうこへ<br>　きょうは かえりが おそく なります。<br>　ばんごはんは テーブルの 上に あります。あたためて 食べて ください。　母」","passZh":"（冰箱上貼著便條）「給祐子：今天我會晚回家。晚餐在桌上，請加熱後再吃。 媽媽」","q":"ゆうこさんは ばんごはんを どう しますか。","c":["母と いっしょに 食べます。","外で 食べます。","あたためて 食べます。","じぶんで つくります。"],"a":2,"e":"「あたためて 食べて ください」。<br>其他選項：媽媽會晚回來所以不能一起吃；外食和自己煮都沒提到。<br><b>答案在哪一句</b>：最後一行。<b>陷阱</b>：「おそく なります」只是說晚回家，不是不回家。"},{"pass":"あしたの 山のぼりは あさ 六時に 駅の 前に あつまります。<br>あめの ときは ちゅうしですが、すこしの あめなら 行きます。<br>ちゅうしの ときは、あさ 五時までに れんらくします。","passZh":"明天的爬山早上六點在車站前集合。下雨的話取消，但如果只是小雨就會去。取消的話會在早上五點前聯絡。","q":"あした あさ 五時半まで れんらくが ありませんでした。どう しますか。","c":["うちで まちます。","五時に れんらくします。","山のぼりは ちゅうしです。","駅の 前へ 行きます。"],"a":3,"e":"取消會在五點前聯絡；過了五點半還沒接到聯絡，就代表照常舉行，要去集合。<br>其他選項：2・4 和「沒接到聯絡」矛盾；3 聯絡的是主辦方不是參加者。<br><b>答案在哪一句</b>：最後一句。<b>陷阱</b>：這題考的是「<b>沒有聯絡</b>」代表什麼。"}]},{"no":5,"title":"問題5","instr":"つぎの 文章を 読んで、しつもんに こたえて ください。こたえは 1・2・3・4から いちばん いい ものを 一つ えらんで ください。","items":[{"pass":"わたしは 本を 読むのが すきです。でも、いそがしくて、なかなか 時間が ありませんでした。<br>そこで 半年前から、電車の 中で 読む ことに しました。うちから 会社まで かたみち 四十分ですから、一日に 一時間 二十分 読む ことが できます。<br>はじめは、電車が こんで いて 本を ひらく ことも むずかしかったです。ですから、小さくて かるい 本を えらぶように しました。<br>いまは 一か月に 四さつぐらい 読んで います。前より ずっと 多く なりました。<br>友だちには 「電車の 中で 本を 読むと つかれるでしょう」と 言われますが、わたしには その 一時間 二十分が 一日で いちばん しずかな 時間です。","passZh":"我喜歡看書。但是太忙，一直沒什麼時間。所以半年前開始決定在電車上看。從家裡到公司單程四十分鐘，所以一天可以看一小時二十分。一開始電車很擠，連打開書都很困難。所以我改成挑小本又輕的書。現在一個月大概看四本，比以前多了很多。朋友會說「在電車上看書很累吧」，但對我來說那一小時二十分是一天中最安靜的時間。","q":"この 人は どうして 小さくて かるい 本を えらびますか。","c":["電車が こんで いるから","小さい 本の ほうが 安いから","かばんが 小さいから","友だちに 言われたから"],"a":0,"e":"第三段：電車很擠，連打開書都困難，所以改挑小本輕的。<br>其他選項：價錢、包包大小文章都沒提到；朋友說的是「看書很累」，不是叫他換書。<br><b>答案在哪一句</b>：第三段「電車が こんで いて …… ですから、小さくて かるい 本を」。"},{"pass":"わたしは 本を 読むのが すきです。でも、いそがしくて、なかなか 時間が ありませんでした。<br>そこで 半年前から、電車の 中で 読む ことに しました。うちから 会社まで かたみち 四十分ですから、一日に 一時間 二十分 読む ことが できます。<br>はじめは、電車が こんで いて 本を ひらく ことも むずかしかったです。ですから、小さくて かるい 本を えらぶように しました。<br>いまは 一か月に 四さつぐらい 読んで います。前より ずっと 多く なりました。<br>友だちには 「電車の 中で 本を 読むと つかれるでしょう」と 言われますが、わたしには その 一時間 二十分が 一日で いちばん しずかな 時間です。","passZh":"我喜歡看書。但是太忙，一直沒什麼時間。所以半年前開始決定在電車上看。從家裡到公司單程四十分鐘，所以一天可以看一小時二十分。一開始電車很擠，連打開書都很困難。所以我改成挑小本又輕的書。現在一個月大概看四本，比以前多了很多。朋友會說「在電車上看書很累吧」，但對我來說那一小時二十分是一天中最安靜的時間。","q":"この 人は 電車の 中の 時間を どう おもって いますか。","c":["つかれる 時間だと おもって います。","一日で いちばん しずかな 時間だと おもって います。","もったいない 時間だと おもって います。","みじかすぎると おもって います。"],"a":1,"e":"最後一句「わたしには その 一時間 二十分が 一日で いちばん しずかな 時間です」。<br>其他選項：<b>「つかれるでしょう」是朋友說的，不是作者的想法</b>（這是最常見的陷阱）；3・4 文章沒提到。<br><b>答案在哪一句</b>：最後一句，が 後面才是作者自己的意見。"}]},{"no":6,"title":"問題6","instr":"つぎの お たいから","ねつが あるから","あしが いたいから"]},{"n":4,"play":[{"r":"N","t":"4ばん。"},{"r":"N","t":"男の人は あした どう やって 来ますか。"},{"p":12},{"r":"F","t":"あしたの あさ、どう やって 来ますか。"},{"r":"M","t":"バスで 来ようと おもって いましたが、あさは こみますから…。"},{"r":"F","t":"うちから ここまで どのくらいですか。"},{"r":"M","t":"あるいて 二十分ぐらいです。"},{"r":"F","t":"じゃ、あるいた ほうが はやいですね。"},{"r":"M","t":"そう しますね。"},{"r":"N","t":"男の人は あした どう やって 来ますか。"}],"q":"男の人は あした どう やって 来ますか。","a":2,"gap":10,"zh":"女：明天早上你怎麼來？／男：本來想搭公車，不過早上很擠…／女：從你家到這裡多遠？／男：走路大概二十分鐘。／女：那走路還比較快呢。／男：那我就走路吧。","e":"<b>關鍵句</b>：「<b>歩いた ほうが 早いですね</b>」＋「<b>そう しますね</b>」＝決定走路。<br>其他選項：<b>バス 是本來的打算，被「あさは こみますから…」否定掉了</b>；でんしゃ・タクシー 沒提到。<br><b>提醒</b>：「〜ようと 思って いましたが」＝本來打算（但沒這麼做）。","c":["でんしゃ","バス","あるいて","タクシー"]},{"n":5,"play":[{"r":"N","t":"5ばん。"},{"r":"N","t":"レポートは いつまでに 出しますか。"},{"p":12},{"r":"M","t":"レポートは いつまでですか。"},{"r":"F","t":"もともとは 七日でしたが、先生が 二日 のばして くださいました。"},{"r":"M","t":"じゃ、九日ですね。"},{"r":"F","t":"ええ。でも 八日に 出す つもりです。"},{"r":"N","t":"レポートは いつまでに 出しますか。"}],"q":"レポートは いつまでに 出しますか。","a":3,"gap":10,"zh":"男：報告到什麼時候？／女：本來是七號，不過老師延後了兩天。／男：那就是九號囉。／女：嗯。不過我打算八號交。","e":"<b>關鍵句</b>：七日 ＋ 二日 ＝ <b>九日</b>，男生也確認了一次。<br>其他選項：七日 是原本的期限、八日 是<b>女生自己打算交的日子</b>（問的是期限不是她的打算）、十日 沒出現。<br><b>提醒</b>：問「いつまでに」＝<b>期限</b>，不要被「八日に 出す つもり」帶走。","c":["七日","八日","十日","九日"]},{"n":6,"play":[{"r":"N","t":"6ばん。"},{"r":"N","t":"あした 見学に 行くのは 何人ですか。"},{"p":12},{"r":"F","t":"あしたの 見学、ぜんぶで 何人ですか。"},{"r":"M","t":"学生が 六人と、先生が 一人です。"},{"r":"F","t":"わたしも 行きたいんですが。"},{"r":"M","t":"いいですよ。じゃ、八人ですね。"},{"r":"F","t":"あ、すみません、やっぱり 行けません。"},{"r":"N","t":"あした 見学に 行くのは 何人ですか。"}],"q":"あした 見学に 行くのは 何人ですか。","a":0,"gap":10,"zh":"女：明天的參觀總共幾個人？／男：學生六個人，老師一個人。／女：我也想去。／男：可以啊。那就是八個人。／女：啊，抱歉，我還是不能去。","e":"<b>關鍵句</b>：六人＋先生 一人 ＝ 七人。女生說想去（變八人），但<b>最後又說不能去</b>。<br>其他選項：八人 是女生加入時的數字、六人 是只算學生、九人 沒出現。<br><b>提醒</b>：最後一句常常把前面的結論推翻，一定要聽完。","c":["七人","六人","八人","九人"]}]},{"no":3,"title":"問題3　発話表現","instr":"問題3では、えを 見ながら しつもんを 聞いて ください。やじるしの 人は 何と 言いますか。1から3の 中から、いちばん いい ものを 一つ えらんで ください。","ex":{"ex":true,"scene":"img/mock/l3-19.png","q":"ごはんを 食べはじめます。何と 言いますか。","c":["いた
