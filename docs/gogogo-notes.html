<!DOCTYPE html>
<html lang="zh-Hant"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>【語音版】日本語GOGOGO 1 筆記</title>
<style>
  :root{
    --bg:#f4f6f8;--ink:#1f2933;--sub:#6b7580;--accent:#2e7d6b;--accent2:#c0392b;
    --line:#d8dee3;--head:#e8edf0;--sel:#ffe680;--jp:#1a3a5c;--stripe:#f9fafb;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei","Hiragino Sans",sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  #topbar{position:sticky;top:0;z-index:40;background:var(--bg);box-shadow:0 2px 6px rgba(0,0,0,.08)}
  header{background:#fff;border-bottom:1px solid var(--line);padding:10px 16px}
  .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  #zen{position:fixed;top:calc(var(--topbar-h,150px) + 8px);right:14px;z-index:80;width:34px;height:30px;border:1px solid var(--line);background:#fff;color:#3a4750;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 5px rgba(0,0,0,.14);transition:top .2s}
  #zen:hover{background:#eef4f9}
  body.zen #zen{background:#121417;color:#fff;border-color:#121417}
  body.zen #topbar{display:none}
  body.zen #zen{top:8px}
  #zen-save{position:fixed;top:8px;right:56px;z-index:80;width:34px;height:30px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:0 1px 5px rgba(0,0,0,.14);font-size:15px}
  body.zen #zen-save{display:flex}
  #zen-add{position:fixed;top:8px;right:98px;z-index:80;width:34px;height:30px;border:1px solid var(--line);background:#fff;color:#0a8a3c;border-radius:8px;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:0 1px 5px rgba(0,0,0,.14);font-size:22px;line-height:1;font-weight:700}
  body.zen #zen-add{display:flex}
  #zen-add:hover{background:#eef9f0}
  #zen-add:disabled{opacity:.4;cursor:not-allowed}
  #add,#save,#zen-add,#zen-save{display:none!important}
  #zen-save:hover{background:#eef4f9}
  #zen-save.need{background:#fff3e0;border-color:#f0c987}
  body.zen{padding-top:6px}
  h1{font-size:18px;margin:0;color:var(--accent);white-space:nowrap}
  .stat{font-size:12px;color:var(--sub);background:var(--head);padding:4px 10px;border-radius:12px}
  .search{flex:1;min-width:150px;padding:7px 12px;border:1px solid var(--line);border-radius:18px;font-size:14px;outline:none}
  .search:focus{border-color:var(--accent)}
  button{font-family:inherit;font-size:13px;cursor:pointer;border-radius:8px;padding:7px 12px;border:1px solid var(--line);background:#fff;transition:.15s;white-space:nowrap}
  button:hover{background:var(--head)}
  .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn-primary:hover{background:#26695a}
  .btn-danger{color:var(--accent2);border-color:#e6c3bd}
  .btn-danger:hover{background:#fbeceb}
  #save.need{background:#e67e22;border-color:#e67e22;color:#fff}
  #save.need:hover{background:#cf6f16}
  .wrap{padding:12px;overflow:visible}
  #bulkbar{display:none;align-items:center;gap:12px;background:#fff3e0;border:1px solid #f0c987;border-radius:10px;padding:8px 14px;margin:8px 12px 10px;font-size:13px}
  #bulkbar b{color:var(--accent2);font-size:15px}
  #bulkbar .grow{flex:1}
  #add:disabled{opacity:.5;cursor:not-allowed}
  table{border-collapse:collapse;background:#fff;table-layout:fixed;width:auto}
  th,td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left;overflow-wrap:break-word;word-break:break-word}
  th{background:var(--head);position:sticky;top:var(--topbar-h,132px);z-index:15;font-size:13px;color:#3a4750;white-space:nowrap}
  .resizer{position:absolute;top:0;right:-3px;width:8px;height:100%;cursor:col-resize;z-index:6;user-select:none}
  .resizer:hover,.resizer.active{background:var(--accent);opacity:.5}
  tbody tr:nth-child(even){background:var(--stripe)}
  tbody tr.sel{background:var(--sel)!important}
  tbody tr.sel td:first-child{box-shadow:inset 4px 0 0 var(--accent2)}
  td[contenteditable]{outline:none}
  td[contenteditable]:focus{background:#fffbe6;box-shadow:inset 0 0 0 2px #ffe08a}
  td.word{font-weight:700;font-size:15px}
  td.kana{color:#555;white-space:pre-line}
  td.cho{text-align:center;color:var(--accent2);font-weight:600}
  .panote{overflow-x:auto;white-space:nowrap}
  .pa2{display:inline-flex;align-items:flex-end}
  .pm{display:inline-block;text-align:center;margin:0 1px}
  .pm .nb{display:block;height:18px;position:relative;min-width:14px}
  .pm .note{position:absolute;left:0;right:0;font-size:13px;line-height:1}
  .pm .note.hi{top:0;color:var(--accent2)}
  .pm .note.lo{bottom:0;color:#1f2933}
  .pm .mk{display:block;font-size:12px;color:var(--jp);line-height:1.3}
  .col-chk{width:36px;text-align:center}
  .col-chk input{width:18px;height:18px;cursor:pointer;accent-color:var(--accent2)}
  .drag{text-align:center;color:#c2c8cd;cursor:grab;user-select:none;font-size:15px;line-height:1}
  .drag:hover{color:var(--accent)}
  tr.dragging{opacity:.4}
  tr.dropline td{box-shadow:inset 0 2px 0 var(--accent)}
  tr.dropline-b td{box-shadow:inset 0 -2px 0 var(--accent)}
  .spk-cell{text-align:center;padding:4px}
  .spk{border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 8px;font-size:16px;cursor:pointer;line-height:1;transition:.12s}
  .spk:hover{background:#e8f5ef;border-color:var(--accent)}
  .spk.playing{background:var(--accent);border-color:var(--accent);animation:pulse .8s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
  th small{font-weight:400;color:var(--sub);font-size:10px}
  .colh{cursor:grab}
  .colh[data-key="say"]{text-align:center}
  .colh[data-key="say"] .resizer{cursor:col-resize}
  .colh small{white-space:normal;display:inline-block;line-height:1.25}
  .colh.coldrag{opacity:.45}
  .colh.colover{box-shadow:inset 0 -3px 0 var(--accent2)}
  .empty{text-align:center;color:var(--sub);padding:30px}
  .hint{font-size:12px;color:var(--sub);margin-top:6px}
  .tabs{display:flex;gap:3px;overflow-x:auto;padding:10px 12px 0;background:var(--bg);border-bottom:1px solid var(--line)}
  .tab{padding:7px 15px;border:1px solid var(--line);border-bottom:none;border-radius:9px 9px 0 0;background:#e9eef1;color:var(--sub);cursor:pointer;white-space:nowrap;font-size:13px;font-weight:600;transition:.12s;text-align:center;line-height:1.35}
  .tab{display:inline-flex;align-items:center;gap:7px}
  .tab .tabimg{height:28px;width:28px;flex:none;pointer-events:none}
  .tab:hover{background:#dde4e8;color:#3a4750}
  .tab.active{background:#fff;color:var(--accent);border-color:var(--accent);position:relative;top:1px}
  .tab .cnt{font-weight:400;font-size:11px;color:#9aa4ac;margin-left:5px}
  .tab.active .cnt{color:var(--accent)}
  .tname{outline:none}
  .tname.editing{background:#fffbe6;box-shadow:0 0 0 2px #ffe08a inset;border-radius:4px;padding:0 3px;cursor:text}
  .subtabs{display:flex;gap:3px;padding:9px 14px 0;background:var(--bg)}
  .subtab{padding:6px 20px;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;background:#eceff2;color:var(--sub);cursor:pointer;font-size:13px;font-weight:600;transition:.12s}
  .subtab:hover{background:#e0e5e9;color:#3a4750}
  .subtab.active{background:#fff;color:var(--accent2);border-color:var(--accent2);position:relative;top:1px}
  .panel-empty{margin:12px;min-height:220px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--sub);font-size:14px;line-height:1.9;background:#fff;border:1px dashed var(--line);border-radius:12px}
  .pe-title{font-size:20px;color:var(--ink);margin-bottom:6px;font-weight:700}
  #panel-grammar{padding:14px}
  #panel-verb{padding:14px}
  #time-quiz{background:#f7f9fb;border:1px solid var(--line);border-radius:12px;padding:10px 12px 8px;margin:0 0 14px;display:flex;flex-direction:column;align-items:center}
  #time-quiz .nq-bar{justify-content:center}
  #time-quiz .aq-body{min-height:0;align-items:center;justify-content:center;gap:0;margin:0}
  #tq-q{font-size:24px;font-weight:700;color:#1f2933;text-align:center}
  .tq-lb{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:#3a4750;cursor:pointer;margin-right:14px}
  .tq-lb input{cursor:pointer;margin:0;width:16px;height:16px;accent-color:var(--accent2)}
  #tq-next,#tq-say{font-size:13px;padding:5px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer}
  #tq-say{background:var(--accent);color:#fff;border-color:var(--accent)}
  #time-quiz.nq-min{padding:2px 10px}
  #time-quiz.nq-min .nq-bar,#time-quiz.nq-min .aq-body{display:none}
  #time-quiz.nq-min .nq-mini-label{display:block}
  #time-quiz.nq-min .nq-collapse{transform:rotate(180deg)}
  .timewrap{display:flex;flex-wrap:wrap;gap:18px}
  .timecol h4{margin:0 0 6px;font-size:14px;color:var(--accent)}
  .timecol.tall table{font-size:14px}
  .timecol.tall tbody{column-count:1}
  .cnttable tr.tok-hl td.kana{background:#fff3e0;color:#c0561a;font-weight:700}
  .conjtable{border-collapse:collapse;margin:8px 0}
  .conjtable th,.conjtable td{border:1px solid var(--line);padding:8px 14px;text-align:center;font-size:15px}
  .conjtable th{background:var(--head);font-weight:600;color:#3a4750}
  .conjlist{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:8px 0;max-width:560px}
  .conjrow{display:flex;align-items:stretch;border-top:1px solid var(--line)}
  .conjrow:first-child{border-top:0}
  .conjlabel{flex:0 0 100px;background:#f3efe6;color:#b23a2f;font-weight:700;padding:10px 14px;display:flex;align-items:center;font-size:14px}
  .conjval{padding:10px 14px;font-size:16px;color:#1f3a5f;display:flex;align-items:center;flex-wrap:wrap;gap:6px}
  .conjzh{color:#8a95a1;font-size:14px;font-weight:400}
  .vex{display:flex;gap:10px;align-items:flex-start;padding:10px 2px;border-bottom:1px dashed var(--line)}
  .vex-jp{font-weight:700;color:#1f3a5f;font-size:16px}
  .vex-zh{color:#8a95a1;font-size:14px;margin-top:2px}
  .ghint{font-size:12px;color:var(--sub);margin:0 auto 12px;max-width:900px}
  #grammar-body{outline:none;max-width:900px;margin:0 auto}
  #grammar-body:empty::before{content:'此頁可直接打字新增文法，或把內容交給我幫你排版。';color:var(--sub)}
  #grammar-body h3{color:var(--accent2);font-size:16px;margin:0 0 14px;border-bottom:2px solid var(--accent2);padding-bottom:6px}
  .gp{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent2);border-radius:8px;padding:12px 16px;margin:0 0 14px}
  .gp-label{font-weight:700;color:var(--accent2);font-size:15px;margin-bottom:6px}
  .gp-form{font-size:17px;color:var(--jp);font-weight:600;letter-spacing:.5px;margin-bottom:6px}
  .gp-note{font-size:13px;color:var(--sub);margin-bottom:6px}
  .gp-ex{font-size:15px;color:#333;background:#f7f9fa;border-radius:6px;padding:9px 11px;line-height:2.4}
  .gp-ex b{color:var(--accent2)}
  #panel-gram{padding:14px}
  #panel-gram .gram-wrap{max-width:900px;margin:0 auto}
  #panel-gram .gsec{margin:0 0 22px}
  #panel-gram .gsec h3{color:var(--accent2);font-size:16px;margin:0 0 4px;border-bottom:2px solid var(--accent2);padding-bottom:6px}
  #panel-gram .gdesc{font-size:13px;color:var(--sub);margin:6px 0 12px}
  #panel-num,#panel-counter,#panel-time{padding:14px}
  #panel-num{padding:0}
  .numtable,.cnttable{border-collapse:collapse;background:#fff;margin:0 auto;font-size:15px}
  .numtable td,.numtable th,.cnttable td,.cnttable th{border:1px solid var(--line);padding:7px 14px;vertical-align:middle}
  .numtable thead th,.cnttable thead th{background:var(--head);color:#3a4750;font-size:13px}
  .numtable td.num{font-weight:700;text-align:right;color:var(--accent2);white-space:nowrap}
  .cnttable td.num{font-weight:700;text-align:center;color:var(--accent2);white-space:nowrap}
  .numtable td.kana,.cnttable td.kana{color:#1f2933;cursor:pointer}
  .numtable td.kana:hover,.cnttable td.kana:hover{background:#fff7cc}
  .cnthead{display:flex;align-items:center;gap:10px;margin:0 auto 12px;max-width:560px}
  .cnthead select{padding:6px 10px;font-size:15px;border:1px solid var(--line);border-radius:8px;background:#fff}
  #cnt-body{overflow-x:auto}
  .agegrid{border-collapse:collapse;margin:0 auto;font-size:14px}
  .agegrid th,.agegrid td{border:1px solid var(--line);padding:5px 10px;text-align:center;white-space:nowrap}
  .agegrid thead th{background:var(--head);color:#3a4750;font-size:12px}
  .agegrid td.num{font-weight:700;color:var(--accent2)}
  .agegrid td.kana{cursor:pointer}
  .agegrid td.kana:hover{background:#fff7cc}
  .agegrid thead th,.cnttable thead th,.numtable thead th{position:static;top:auto;z-index:1}
  .agegrid td.ag-hl{background:#fff3e0;color:#c0561a;font-weight:700}
  .spk-c:hover{background:#f4f9ff}
  #tbody td{cursor:pointer}
  #tbody td.drag{cursor:grab}
  #tbody tr:not(.sel):hover td{background:#eef6ff}
  #tbody td.editing{cursor:text;background:#fffbe6;box-shadow:inset 0 0 0 2px #ffe08a;border-radius:3px}
  #tbody td.ed{white-space:pre-wrap;word-break:break-word}
  #tbody td[data-col]{white-space:pre-wrap;word-break:break-word}
  #tbody td.note,.lvtable td.lv-note{background:#fffdf5}
  .colvis{display:inline-flex;align-items:center;gap:4px;cursor:pointer}
  .colvis-cb{cursor:pointer;vertical-align:middle}
  #tbody td.masked,.lvtable td.masked{position:relative;color:transparent!important;cursor:pointer;user-select:none}
  #tbody td.masked>*,.lvtable td.masked>*{visibility:hidden}
  #tbody td.masked::after,.lvtable td.masked::after{content:'•••••';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9aa5b1;background:repeating-linear-gradient(45deg,#f1f4f7,#f1f4f7 7px,#e7ecf1 7px,#e7ecf1 14px);letter-spacing:3px;font-size:13px}
  #tbody td.masked.revealed,.lvtable td.masked.revealed{color:inherit!important;user-select:text;-webkit-user-select:text}
  #tbody td.masked.revealed>*,.lvtable td.masked.revealed>*{visibility:visible}
  #tbody td.masked.revealed::after,.lvtable td.masked.revealed::after{display:none}
  #all-tbody td.spk-c{cursor:pointer}
  #all-tbody td.spk-c:hover{background:#fff7cc}
  #allverb-tbody td.spk-c{cursor:pointer}
  #allverb-tbody td.spk-c:hover{background:#fff7cc}
  #alladj-tbody td.spk-c{cursor:pointer}
  #alladj-tbody td.spk-c:hover{background:#fff7cc}
  .lv-h{margin:16px 0 8px;font-size:16px}
  #adj-body,#adv-body{padding:14px}
  #adv-body .adv-intro{max-width:860px}
  #adv-body ruby rt{font-size:10px;color:var(--sub);font-weight:400}
  #adj-body .adj-intro{max-width:820px}
  #adj-body ruby rt{font-size:10px;color:var(--sub);font-weight:400}
  .lvtable thead th{position:static;top:auto}
  .lvtable td.spk-c{cursor:pointer}
  .lvtable td.spk-c:hover{background:#fff7cc}
  .lvtable td.lv-note{white-space:pre-line;font-size:13px;color:#3a4750}
  .vtable td.vt-les{color:var(--sub);font-size:13px;white-space:nowrap}
  .vtable td.vt-f b{color:var(--jp);font-size:16px}
  .vtable .vt-k{display:block;font-size:12px;color:var(--sub);margin-top:2px}
  .vt-count{color:var(--sub);font-weight:600}
  .vt-empty{text-align:center;color:var(--sub);padding:18px}
  /* ===== 助詞分頁 ===== */
  #panel-joshi,#panel-alljoshi{padding:14px}
  .jo{font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;color:#c0392b;
      font-weight:800;font-size:1.18em;letter-spacing:.5px;padding:0 1px}
  .jo-tip{background:#fffbe6;border:1px solid #ffe08a;border-radius:10px;padding:10px 12px;
      margin:0 0 12px;font-size:14px;line-height:1.9}
  .jotable{border-collapse:collapse;background:#fff;width:100%;max-width:1180px;table-layout:auto}
  .jotable th,.jotable td{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
  .jotable thead th{background:var(--head);color:#3a4750;font-size:13px;position:static}
  .jotable td.jo-c{text-align:center;white-space:nowrap;width:44px;background:#fcfdff}
  .jotable tr.jo-key td.jo-logic,.jotable tr.jo-key td.jo-u,
  .jotable tr.jo-key td.jo-ex,.jotable tr.jo-key td.jo-note{background:#fff3e0}
  .jotable tr.jo-key td.jo-logic,.jotable tr.jo-key td.jo-u{background:#fff3e0}
  .jotable tr.jo-future td:not(.jo-c):not(.jo-p){color:#b3bac2;background:#f6f7f9}
  .jotable tr.jo-future .jo{color:#cfd4d9}
  .jotable tr.jo-future .jo-emo{filter:grayscale(1);opacity:.45}
  .jotable tr.jo-future .spk{opacity:.35}
  .jotable tr.jo-future .jo-zh{color:#c3c9cf}
  .jo-les{display:inline-block;font-size:11px;color:#8a95a1;border:1px solid var(--line);border-radius:8px;padding:0 6px;margin:0 6px 4px 0;vertical-align:middle;background:#fff}
  .jotable tr.jo-key .jo-les{color:#c0561a;border-color:#f3c48b;background:#fff8ec}
  .jo-legend{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 10px;font-size:13px;color:#3a4750}
  .jo-legend .lg{padding:3px 10px;border-radius:8px;border:1px solid var(--line)}
  .jo-legend .lg-key{background:#fff3e0;border-color:#f3c48b}
  .jo-legend .lg-past{background:#fff}
  .jo-legend .lg-future{background:#f6f7f9;color:#b3bac2}
  .jo-legend .lg-txt{color:var(--sub);font-size:12px}
  .jotable td.jo-c,.jotable td.jo-p{vertical-align:middle}
  .jotable td.jo-u{font-size:13px;color:#3a4750;width:200px}
  .jotable td.jo-p{font-size:12px;color:var(--sub);white-space:nowrap;width:118px}
  .jotable td.jo-logic{font-size:13px;color:#3a4750;text-align:center;width:92px;font-weight:700}
  .jotable td.jo-logic .jo-emo{display:block;font-size:20px;line-height:1.6}
  .jotable td.jo-note{font-size:12px;color:var(--sub);width:300px;line-height:1.7}
  .jo-one{margin:2px 0 6px}
  .jo-one:last-child{margin-bottom:0}
  .jo-tag{display:inline-block;background:#eef2f5;color:#6b7280;border-radius:10px;
      padding:0 7px;margin-right:6px;font-size:11px;font-weight:700}
  .jotable td.jo-ex{font-size:15px;color:var(--jp);min-width:330px;white-space:nowrap}
  .jotable td.jo-ex .jo-zh{white-space:normal}
  .jotable td.jo-l{text-align:center;color:var(--sub);font-size:12px;white-space:nowrap;width:56px}
  .jo-zh{font-size:12px;color:var(--sub);margin-left:6px}
  @media(max-width:600px){
    .jotable,.jotable tbody,.jotable tr,.jotable td{display:block;width:auto!important}
    .jotable thead{display:none}
    .jotable tr{border:1px solid var(--line);border-radius:10px;margin:0 0 10px;padding:8px 10px}
    .jotable td{border:0!important;padding:2px 0!important}
    .jotable td.jo-c{display:inline-block;background:transparent}
    .jotable td.jo-l{display:inline-block;margin-left:8px}
    .jotable td.jo-u,.jotable td.jo-p,.jotable td.jo-note{width:auto}
    .jotable td.jo-logic{text-align:left;width:auto}
    .jotable td.jo-logic .jo-emo{display:inline;font-size:17px;margin-right:4px}
    .jotable td.jo-c{display:none}
    .jotable tr::before{content:attr(data-jo);display:inline-block;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
      color:#c0392b;font-weight:800;font-size:20px;margin-right:8px;vertical-align:-2px}
    .jotable td.jo-p{display:none}
  }
  @media(max-width:600px){

1:`<h3>第1課　〜は〜です／〜ですか／〜じゃありません・〜の〜・〜で、〜・こちらは</h3>
<div class="gp"><div class="gp-label">① 〜は〜です：A 是 B</div><div class="gp-form">名詞A ＋ <u>は</u> ＋ 名詞B ＋ <u>です</u></div><div class="gp-note">名詞的肯定句。<b>です</b> 放在句尾表示肯定，大約等於中文的「是」。<br><b>は</b> 本來念 ha，但當<b>助詞</b>用的時候要念 <b>wa</b>：它把前面的 A 標成這句話的<b>主題</b>，は 後面接的就是關於這個主題的說明。</div><div class="gp-ex">例：<ruby>私<rt>わたし</rt></ruby><b>は</b> <ruby>会社員<rt>かいしゃいん</rt></ruby><b>です</b>。<button class="spk gspk" data-say="わたしは かいしゃいんです" title="播放發音">🔊</button>（我是公司職員）<br>例：<ruby>田中<rt>たなか</rt></ruby>さん<b>は</b> <ruby>日本人<rt>にほんじん</rt></ruby><b>です</b>。<button class="spk gspk" data-say="たなかさんは にほんじんです" title="播放發音">🔊</button>（田中先生是日本人）<br>　　↑ 主題是「田中さん」，「日本人です」是在說明他</div></div>
<div class="gp"><div class="gp-label">💡 什麼是「助詞〈じょし〉」？</div><div class="gp-form">は、の 都是助詞</div><div class="gp-note">助詞夾在詞和詞中間，用來表示它們之間的<b>關係</b>，或替句子加上某種意思。它<b>不會單獨出現</b>，也<b>不會變化</b>。可以想成把一節節車廂（單字）扣在一起的連結器。<br>打招呼的 こんにち<b>は</b>／こんばん<b>は</b> 最後那個字也念 <b>wa</b>，因為它原本就是助詞 は。一開始分不清哪個 は 念 wa 沒關係，學下去自然會分得出來。</div><div class="gp-ex">例：こんにち<b>は</b>。<button class="spk gspk" data-say="こんにちは" title="播放發音">🔊</button>（念 konnichi<b>wa</b>）<br>例：こんばん<b>は</b>。<button class="spk gspk" data-say="こんばんは" title="播放發音">🔊</button>（念 konban<b>wa</b>）</div></div>
<div class="gp"><div class="gp-label">② 〜は〜ですか：疑問句</div><div class="gp-form">名詞A ＋ は ＋ 名詞B ＋ です ＋ <u>か</u></div><div class="gp-note">句尾加上 <b>か</b> 就變成問句，念的時候<b>語調往上揚</b>。日文的問句通常就是這樣在最後加 か。</div><div class="gp-ex">例：<ruby>陳<rt>ちん</rt></ruby>さんは <ruby>公務員<rt>こうむいん</rt></ruby>です<b>か</b>。<button class="spk gspk" data-say="ちんさんは こうむいんですか" title="播放發音">🔊</button>（陳先生是公務員嗎？）<br>― はい、<ruby>公務員<rt>こうむいん</rt></ruby>です。<button class="spk gspk" data-say="はい、こうむいんです" title="播放發音">🔊</button>（是的，是公務員）<br>― いいえ、<ruby>公務員<rt>こうむいん</rt></ruby>じゃありません。<button class="spk gspk" data-say="いいえ、こうむいんじゃありません" title="播放發音">🔊</button>（不，不是公務員）</div></div>
<div class="gp"><div class="gp-label">③ 〜は〜じゃありません：A 不是 B</div><div class="gp-form">名詞A ＋ は ＋ 名詞B ＋ <u>じゃありません</u></div><div class="gp-note">「〜です」的<b>否定</b>。同一句話有三種講法，正式程度不同：<br>・<b>じゃありません</b>：一般會話<br>・<b>ではありません</b>：報紙、文章這類書面或正式場合（では 的 は 一樣念 <b>wa</b>）<br>・<b>じゃないです</b>：比較口語、隨便</div><div class="gp-ex">例：<ruby>私<rt>わたし</rt></ruby>は <ruby>銀行員<rt>ぎんこういん</rt></ruby><b>じゃありません</b>。<button class="spk gspk" data-say="わたしは ぎんこういんじゃありません" title="播放發音">🔊</button>（我不是銀行職員）<br>　＝ <ruby>私<rt>わたし</rt></ruby>は <ruby>銀行員<rt>ぎんこういん</rt></ruby><b>ではありません</b>。<button class="spk gspk" data-say="わたしは ぎんこういんではありません" title="播放發音">🔊</button>（書面、正式）<br>　＝ <ruby>私<rt>わたし</rt></ruby>は <ruby>銀行員<rt>ぎんこういん</rt></ruby><b>じゃないです</b>。<button class="spk gspk" data-say="わたしは ぎんこういんじゃないです" title="播放發音">🔊</button>（口語）</div></div>

<script>
/* ===== 日本語GOGOGO 1 筆記（2026-10-24 建立）=====
   只有查閱用的分頁：單字／動詞／形容詞／副詞／文法／助詞，外加「總學習」的單字總表。

   資料：<script id="vocab-data">＝{names:{課號:"第N課\n標題"}, lessons:{課號:[單字列]}}
         單字列欄位同 minna-notes：{word,kana,mean,note,pos,…}；pos＝verb／adjna／adji／adv／n…

   發音與遮欄位的寫法照搬 minna-notes；聲音設定共用 localStorage 的 jp_tts_vv。 */
const DATA=(function(){try{return JSON.parse(document.getElementById('vocab-data').textContent)||{};}catch(e){return {};}})();
const NAMES=DATA.names||{}, LES=DATA.lessons||{};
const LESSON_KEYS=Object.keys(NAMES).map(Number).filter(function(n){return n>0;}).sort(function(a,b){return a-b;});
const ALL=0;                                  /* 「總學習」頁籤的課號 */
const AKEY='gg_lesson',SKEY='gg_section',MKEY='gg_mask';

/* ---- 發音（同 minna-notes）---- */
const __VV=(function(){try{return JSON.parse(document.getElementById('vv-data').textContent)||{};}catch(e){return {};}})();
const VV_SAY=__VV.say||{};
const VV_BASE='audio/gogogo/';
let ttsCfg={voiceA:'',voiceB:'',rate:0.9,pitch:1};
try{const o=JSON.parse(localStorage.getItem('jp_tts_vv')||'{}');if(o.voice&&!o.voiceA)o.voiceA=o.voice;ttsCfg=Object.assign(ttsCfg,o);}catch(e){}
/* 三個角色與名稱同 minna-notes；設定存在 jp_tts_vv，兩頁共用 */
const VV_VOICES=[['2','Chloe — 快樂學生，女'],['13','Uncle Ben — 大叔，男'],['11','Darren — 聽起來是帥哥，男']];
const VV_IDS=VV_VOICES.map(function(v){return v[0];});
function saveTts(){try{localStorage.setItem('jp_tts_vv',JSON.stringify(ttsCfg));}catch(e){}}
function voiceFor(which){const want=which==='B'?ttsCfg.voiceB:ttsCfg.voiceA;return VV_IDS.indexOf(String(want))>=0?String(want):(which==='B'?'11':'2');}
const VV_PLAYER=new Audio();let VV_BTN=null;
function vvNorm(t){return String(t||'').replace(/[〜～~［］\[\]]/g,'').replace(/　/g,' ').trim();}

function vvMark(btn){if(VV_BTN)VV_BTN.classList.remove('playing');VV_BTN=btn||null;if(VV_BTN)VV_BTN.classList.add('playing');}
function vvStop(){VV_PLAYER.onended=null;VV_PLAYER.pause();try{VV_PLAYER.currentTime=0;}catch(e){}vvMark(null);}

    VV_PLAYER.onended=function(){vvMark(null);};VV_PLAYER.onerror=function(){vvMark(null);};
    VV_PLAYER.src=VV_BASE+id+'.ogg';VV_PLAYER.playbackRate=+ttsCfg.rate||0.9;vvMark(btn);
    VV_PLAYER.play().catch(function(){vvMark(null);});return;}
  if(!('speechSynthesis' in window))return;

  speechSynthesis.speak(u);
}
/* 用漢字念會念錯的字改念假名（與 minna-notes 同一份；export_missing_clips.py 也讀這裡） */
const sayForceKana=new Set(['日本人','方','静か','暇','水餃','事','揚げます','夜','道','絵','髪','車','何','薬','家','百','千','101','眼鏡','梅酒','夜市','元','何階','木','鈴','時','分','今','昼','明日','1日','2日','3日','4日','5日','6日','7日','8日','9日','10日','14日','20日','24日','年','月','日','何年','何月','何日','今年','今月','一人で','人','来ます','歩いて','船','次の','何で','実家','塾','手','二人','1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月','会社の人','何ですか。']);
function sayText(r){if(!r)return '';let w=(r.word||'').replace(/[〜～~［］\[\]]/g,'').trim();if(w&&!sayForceKana.has(w))return w;return (r.kana||'').replace(/[〜～~]/g,'').replace(/\s*\n\s*/g,'、').trim();}

/* ---- 形容詞（同 minna-notes 的 adjNeg；export_missing_clips.py 讀 ADJ_YOKU 決定要合成哪些否定形）---- */
const ADJ_YOKU=new Set(['いい','よい','かっこいい','格好いい','かっこ良い']);
function adjNeg(w,na){if(na)return w+'じゃ ありません';if(ADJ_YOKU.has(w))return w.replace(/[いよ]い$/,'よく')+' ないです';return w.replace(/い$/,'')+'く ないです';}

/* ---- 小工具 ---- */
function hh(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function md(s){return hh(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');}       /* 備註裡的 **粗體** */
function rowsOf(n){return (LES[String(n)]||[]).slice();}
function lessonName(n){return n===ALL?'總學習':(NAMES[n]||('第'+n+'課'));}

/* ---- 遮欄位：按下馬上放開＝開關；按住拖曳＝選字（同 minna-notes）---- */
let maskDown=null;
document.addEventListener('mousedown',function(e){maskDown={x:e.clientX,y:e.clientY,t:Date.now()};},true);
function quickTap(e){const sel=getSelection();if(sel&&!sel.isCollapsed&&String(sel).trim())return false;if(!maskDown)return true;
  return Date.now()-maskDown.t<250&&Math.abs(e.clientX-maskDown.x)<5&&Math.abs(e.clientY-maskDown.y)<5;}
function toggleMask(td,e){if(!td.classList.contains('revealed')){td.classList.add('revealed');return;}if(quickTap(e))td.classList.remove('revealed');}
let MASK=(function(){try{return JSON.parse(localStorage.getItem(MKEY))||{};}catch(e){return {};}})();

/* ---- 表格 ---- */
const W=['word','單詞','word'],K=['kana','假名','kana'],M=['mean','詞義',''],N=['note','備註','lv-note'];
const COLS={vocab:[W,K,M,N],verb:[W,K,M,['forms','變化',''],N],adj:[W,K,['type','種類',''],M,['neg','否定',''],N],
            adv:[W,K,M,N],all:[['les','課',''],W,K,M,N]};
function cell(kind,c,r){
  const key=kind+':'+c[0],mk=MASK[key]?' masked':'';
  if(c[0]==='note')return '<td class="lv-note'+mk+'">'+md(r.note)+'</td>';
  if(c[0]==='les'||c[0]==='type')return '<td class="'+mk.trim()+'">'+hh(r[c[0]])+'</td>';
  if(c[0]==='forms'){
    const wb=(r.word||'').replace(/ます$/,''),kb=(r.kana||'').replace(/ます$/,'');
    return '<td class="'+mk.trim()+'">'+['ません','ました','ませんでした'].map(function(s){
      return '<span class="vf" data-say="'+hh(kb+s)+'" title="播放發音">'+hh(wb+s)+'</span>';}).join('')+'</td>';}
  const say=c[0]==='neg'?r.negk:sayText(r);
  return '<td class="'+(c[2]+' spk-c'+mk).trim()+'" data-say="'+hh(say)+'">'+hh(r[c[0]])+'</td>';
}
function table(kind,rows,title){
  const cols=COLS[kind];
  const head=cols.map(function(c){return '<th><label class="colvis" title="取消勾選＝遮住此欄，用來練習"><input type="checkbox" class="colvis-cb" data-key="'+kind+':'+c[0]+'"'+(MASK[kind+':'+c[0]]?'':' checked')+'> '+c[1]+'</label></th>';}).join('');
  return '<h3 class="lv-h">'+hh(title)+'（'+rows.length+' 個）</h3><table class="alltable lvtable"><thead><tr>'+head+'</tr></thead><tbody>'
    +rows.map(function(r,i){return '<tr data-i="'+i+'">'+cols.map(function(c){return cell(kind,c,r);}).join('')+'</tr>';}).join('')+'</tbody></table>';
}
function adjRows(n){return rowsOf(n).filter(function(r){return r.pos==='adjna'||r.pos==='adji';}).map(function(r){
  const na=r.pos==='adjna',w=r.word||r.kana||'',k=r.kana||'';
  return Object.assign({},r,{type:na?'な形容詞':'い形容詞',neg:adjNeg(w,na),negk:adjNeg(k,na)});});}
function allRows(){const seen={},out=[];LESSON_KEYS.forEach(function(n){rowsOf(n).forEach(function(r){
  const k=(r.word||'')+'|'+(r.kana||'');if(seen[k])return;seen[k]=1;out.push(Object.assign({},r,{les:'第'+n+'課'}));});});return out;}

/* ---- 助詞表：整張表每一課都一樣，只有顏色隨課次變（同 minna-notes）---- */
function joshiHTML(n){
  return '<div class="jo-legend"><span class="lg lg-key">本課新學</span><span class="lg lg-past">之前學過</span><span class="lg lg-future">還沒學</span>'
    +'<span class="lg-txt">課次依《日本語GOGOGO 1》。</span></div>'
    +'<table class="jotable"><thead><tr><th>助詞</th><th>組合</th><th>用法</th><th>功能</th><th>例句</th><th>筆記</th></tr></thead><tbody>'
    +JOSHI_ROWS+'</tbody></table>';
}

/* ---- 分頁：該課有內容才出現 ---- */
function subsFor(n){
  if(n===ALL)return [['all','單字總表']];
  const rs=rowsOf(n),has=function(ps){return rs.some(function(r){return ps.indexOf(r.pos)>=0;});};
  const out=[['vocab','單字']];
  if(has(['verb']))out.push(['verb','動詞']);
  if(has(['adjna','adji']))out.push(['adj','形容詞']);
  if(has(['adv']))out.push(['adv','副詞']);
  if(GRAMMAR[n])out.push(['grammar','文法']);
  if(GRAMMAR_PLUS[n])out.push(['gplus','文法補充']);
  if(JOSHI_ROWS.indexOf('data-les="'+n+'"')>=0)out.push(['joshi','助詞']);
  return out;
}
const PANELS=['vocab','verb','adj','adv','grammar','gplus','joshi','all'];
/* 沒存過時 getItem 是 null，+null 會變 0＝總學習，第一次打開就跑到總學習去了 */
let lesson=(function(){const s=localStorage.getItem(AKEY);return s===null?NaN:+s;})();
if(!(lesson===ALL||LESSON_KEYS.indexOf(lesson)>=0))lesson=LESSON_KEYS.length?LESSON_KEYS[0]:ALL;
let section=localStorage.getItem(SKEY)||'vocab';

function renderTabs(){
  const el=document.getElementById('tabs');el.innerHTML='';
  LESSON_KEYS.concat([ALL]).forEach(function(n,i){
    const t=document.createElement('div');t.className='tab'+(n===lesson?' active':'');
    /* 頁籤的熊貓沿用 minna 的圖：各課輪流用 02〜13 號，總學習用 15 號 */
    const im=document.createElement('img');im.className='tabimg';im.alt='';im.draggable=false;
    im.src='img/tab/panda-'+String(n===ALL?15:((i%12)+2)).padStart(2,'0')+'.png';t.appendChild(im);
    const nm=document.createElement('span');nm.className='tname';nm.innerHTML=hh(lessonName(n)).replace(/\n/g,'<br>');t.appendChild(nm);
    const zh=(DATA.zh||{})[n];if(zh)t.title=zh;
    t.addEventListener('click',function(){switchLesson(n);});el.appendChild(t);
  });
}
function renderSubtabs(){
  const el=document.getElementById('subtabs');el.innerHTML='';
  subsFor(lesson).forEach(function(s){const b=document.createElement('div');b.className='subtab'+(s[0]===section?' active':'');
    b.textContent=s[1];b.addEventListener('click',function(){switchSection(s[0]);});el.appendChild(b);});
}
function renderPanel(){
  PANELS.forEach(function(p){document.getElementById('panel-'+p).style.display=p===section?'':'none';});
  const n=lesson,empty=document.getElementById('gg-empty');
  empty.style.display=(!LESSON_KEYS.length)?'':'none';
  if(section==='vocab')document.getElementById('voc-body').innerHTML=rowsOf(n).length?table('vocab',rowsOf(n),'本課單字'):'<div class="ghint">這一課還沒有單字。</div>';
  if(section==='verb')document.getElementById('verb-body').innerHTML=table('verb',rowsOf(n).filter(function(r){return r.pos==='verb';}),'本課動詞');
  if(section==='adj')document.getElementById('adj-body').innerHTML=table('adj',adjRows(n),'本課形容詞');
  if(section==='adv')document.getElementById('adv-body').innerHTML=table('adv',rowsOf(n).filter(function(r){return r.pos==='adv';}),'本課副詞');
  if(section==='grammar')document.getElementById('grammar-body').innerHTML=GRAMMAR[n]||'';
  if(section==='gplus')document.getElementById('gplus-body').innerHTML=GRAMMAR_PLUS[n]||'';
  if(section==='joshi'){const b=document.getElementById('joshi-body');b.innerHTML=joshiHTML(n);
    b.querySelectorAll('tr[data-les]').forEach(function(tr){const les=+tr.dataset.les;
      tr.classList.toggle('jo-key',les===n);tr.classList.toggle('jo-future',les>n);
      const nt=tr.querySelector('td.jo-note');if(nt)nt.insertAdjacentHTML('afterbegin','<span class="jo-les">第'+les+'課</span>');});}
  if(section==='all'){const rs=allRows();document.getElementById('all-body').innerHTML=rs.length?table('all',rs,'單字總表'):'<div class="ghint">還沒有單字。</div>';}
}
function switchLesson(n){lesson=n;localStorage.setItem(AKEY,n);
  const subs=subsFor(n).map(function(s){return s[0];});if(subs.indexOf(section)<0)section=subs[0];
  localStorage.setItem(SKEY,section);renderTabs();renderSubtabs();renderPanel();}
function switchSection(s){section=s;localStorage.setItem(SKEY,s);renderSubtabs();renderPanel();}

document.querySelector('main').addEventListener('click',function(e){
  const m=e.target.closest('.lvtable td.masked');if(m){toggleMask(m,e);return;}
  const s=e.target.closest('[data-say]');if(s){e.preventDefault();speak(s.getAttribute('data-say'),s);}
});
document.querySelector('main').addEventListener('change',function(e){
  const cb=e.target.closest('.colvis-cb');if(!cb)return;
  if(cb.checked)delete MASK[cb.dataset.key];else MASK[cb.dataset.key]=true;
  try{localStorage.setItem(MKEY,JSON.stringify(MASK));}catch(err){}renderPanel();
});
(function(){const n=allRows().length;document.getElementById('stat').textContent='共 '+n+' 筆單字';})();
switchLesson(lesson);

/* ---- 搜尋（同 minna-notes）：單詞／假名／詞義／備註，加上各課文法內容；點結果跳到那一課並標亮那一列 ---- */
function setTopbarH(){const tb=document.getElementById('topbar');if(tb)document.documentElement.style.setProperty('--topbar-h',tb.offsetHeight+'px');}
setTopbarH();window.addEventListener('resize',setTopbarH);
function globalSearch(q){
  q=q.trim().toLowerCase();const out=[];if(!q)return out;
  for(const n of LESSON_KEYS){
    rowsOf(n).forEach(function(r,i){
      if(out.length>=60)return;
      const hay=((r.word||'')+(r.kana||'')+(r.mean||'')+(r.note||'')).toLowerCase();
      if(hay.indexOf(q)>=0)out.push({n:n,sec:'vocab',i:i,label:(r.word||r.kana||'')+'　'+(r.kana||'')+'　'+(r.mean||'')});
    });
    const g=GRAMMAR[n]||'';
    if(g&&g.replace(/<[^>]+>/g,' ').toLowerCase().indexOf(q)>=0)out.push({n:n,sec:'grammar',i:-1,label:'（文法內容含「'+q+'」）'});
    const gp=GRAMMAR_PLUS[n]||'';
    if(gp&&gp.replace(/<[^>]+>/g,' ').toLowerCase().indexOf(q)>=0)out.push({n:n,sec:'gplus',i:-1,label:'（文法補充含「'+q+'」）'});
    if(out.length>=60)break;
  }
  return out;
}
function showSearchResults(q){
  const box=document.getElementById('searchresults');
  if(!q.trim()){box.style.display='none';box.innerHTML='';return;}
  setTopbarH();
  const res=globalSearch(q);
  if(!res.length){box.innerHTML='<div class="sr-empty">找不到「'+hh(q)+'」</div>';box.style.display='block';return;}
  box.innerHTML=res.map(function(r){return '<div class="sr-item" data-n="'+r.n+'" data-sec="'+r.sec+'" data-i="'+r.i+'"><span class="sr-loc">'
    +hh(lessonName(r.n).replace(/\n/g,' '))+' · '+({vocab:'單字',grammar:'文法',gplus:'文法補充'}[r.sec]||r.sec)+'</span><span class="sr-txt">'+hh(r.label)+'</span></div>';}).join('');
  box.style.display='block';
}
function jumpTo(n,sec,i){
  document.getElementById('searchresults').style.display='none';
  switchLesson(n);switchSection(sec);
  if(sec==='vocab'&&i>=0){const tr=document.querySelector('#voc-body tr[data-i="'+i+'"]');
    if(tr){tr.scrollIntoView({block:'center'});tr.classList.add('hitrow');setTimeout(function(){tr.classList.remove('hitrow');},2200);}}
}
document.getElementById('search').addEventListener('input',function(){showSearchResults(this.value);});
document.getElementById('search').addEventListener('keydown',function(e){if(e.key==='Escape')document.getElementById('searchresults').style.display='none';});
document.getElementById('searchresults').addEventListener('click',function(e){const it=e.target.closest('.sr-item');if(!it)return;jumpTo(+it.dataset.n,it.dataset.sec,+it.dataset.i);});
document.addEventListener('click',function(e){if(!e.target.closest('#searchresults')&&e.target.id!=='search'){const b=document.getElementById('searchresults');if(b)b.style.display='none';}});

/* ---- 語音設定（⚙）：聲音（三個角色）＋語速 ---- */
function openVoiceModal(){
  const sel=document.getElementById('voicesel');
  sel.innerHTML=VV_VOICES.map(function(v){return '<option value="'+v[0]+'">'+hh(v[1])+'</option>';}).join('');
  sel.value=voiceFor('A');
  document.getElementById('ratein').value=+ttsCfg.rate||0.9;
  document.getElementById('rateval').textContent=(+ttsCfg.rate||0.9).toFixed(2)+'×';
  document.getElementById('voicemodal').classList.add('show');
}
document.getElementById('ttsbtn').addEventListener('click',openVoiceModal);
document.getElementById('voicesel').addEventListener('change',function(){ttsCfg.voiceA=this.value;saveTts();});
document.getElementById('ratein').addEventListener('input',function(){ttsCfg.rate=+this.value;
  document.getElementById('rateval').textContent=ttsCfg.rate.toFixed(2)+'×';saveTts();});
document.getElementById('vtest').addEventListener('click',function(){speak(this.getAttribute('data-say'),this);});
document.getElementById('vclose').addEventListener('click',function(){document.getElementById('voicemodal').classList.remove('show');});
document.getElementById('voicemodal').addEventListener('click',function(e){if(e.target.id==='voicemodal')e.currentTarget.classList.remove('show');});
</script>
</body>
