<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N5 總單字</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  :root{
    --bg:#f7f5f0; --card:#ffffff; --ink:#2b2b2b; --sub:#6b6b6b;
    --accent:#c0392b; --accent2:#2e7d6b; --line:#e6e2d8;
    --jp:#1a3a5c; --done:#e8f5e9; --doneline:#bcdfc0; --shadow:0 1px 3px rgba(0,0,0,.07);

  *{box-sizing:border-box}
  body{margin:0;font-family:"Hiragino Sans","Noto Sans TC","Microsoft JhengHei",sans-serif;

  h1{font-size:22px;margin:0;color:var(--accent);letter-spacing:1px}

  .progbar{height:10px;background:#e6e2d8;border-radius:6px;overflow:hidden}
  .progfill{height:100%;width:0;background:linear-gradient(90deg,#2e7d6b,#56b39a);transition:width .4s}
  .progtxt{font-size:12px;color:var(--sub);margin-top:3px}

    font-size:15px;background:#fff;outline:none}

  .filters{max-width:1150px;margin:10px auto 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .chip{padding:5px 13px;border:1px solid var(--line);background:#fff;border-radius:18px;
    font-size:13px;cursor:pointer;color:var(--sub);user-select:none;transition:.15s}
  .chip:hover{border-color:var(--accent2)}
  .chip.active{background:var(--accent2);color:#fff;border-color:var(--accent2)}
  .chip.mask{border-style:dashed}
  .chip.mask.active{background:var(--accent);border-color:var(--accent)}
  .resetbtn{margin-left:auto;padding:5px 13px;border:1px solid var(--accent);color:var(--accent);
    background:#fff;border-radius:18px;font-size:13px;cursor:pointer}
  main{max-width:1150px;margin:0 auto;padding:20px}
  .sec{margin-bottom:28px}
  .sec>h2{font-size:19px;color:var(--accent2);border-left:5px solid var(--accent2);
    padding-left:10px;margin:26px 0 6px}
  .sec>h2 .cnt{font-size:13px;color:var(--sub);font-weight:normal;margin-left:8px}
  .sub{font-size:15px;color:var(--accent);margin:16px 0 4px;font-weight:bold}
  table{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;
    overflow:hidden;box-shadow:var(--shadow);font-size:15px}
  th{background:#efece4;color:var(--sub);font-size:13px;font-weight:normal;
    padding:6px 8px;text-align:left;white-space:nowrap}
  td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:middle}
  tr.done td{background:var(--done)}
  .c-chk{width:34px;text-align:center}
  .c-chk input{width:17px;height:17px;cursor:pointer;accent-color:var(--accent2)}
  .word{color:var(--jp);font-weight:bold;font-size:17px;white-space:nowrap;cursor:pointer}
  .kana{color:var(--accent2);white-space:nowrap;cursor:pointer}
  .word:hover,.kana:hover{background:#fff7cc}
  .panote{white-space:nowrap}
  .mean{min-width:90px}
  .ex{color:var(--sub);font-size:13.5px;line-height:1.5}
  .ex .ejp{color:var(--jp);cursor:pointer}
  .ex .ejp:hover{background:#fff7cc}
  .ex .ezh{color:#8a8578}
  .masked{position:relative}
  .masked>*{visibility:hidden}
  .masked::after{content:"點一下顯示";position:absolute;inset:4px;display:flex;align-items:center;
    justify-content:center;background:#eceae2;border-radius:6px;color:#b6b1a4;font-size:12px;cursor:pointer}
  .empty{display:none;text-align:center;color:var(--sub);padding:50px 0}
  footer{max-width:1150px;margin:0 auto;padding:10px 20px 40px;color:var(--sub);font-size:12.5px}
  .homelnk{font-size:13px;text-decoration:none;color:var(--ink);background:#fff;
    border:1px solid var(--line);border-radius:16px;padding:4px 11px;white-space:nowrap}
  .homelnk:hover{border-color:var(--accent2);color:var(--accent2)}
  @media(max-width:700px){
    .ex{display:none}
    th:last-child{display:none}
    td{padding:6px 5px}
    .sec{overflow-x:auto}
  }
</style>
</head>
<body>
<header>
  <div class="htop">
    <h1>N5 總單字</h1>
    <a class="homelnk" href="index.html" title="回到目錄首頁">🏠 首頁</a>
    <div class="progwrap">
      <div class="progbar"><div class="progfill" id="fill"></div></div>
      <div class="progtxt" id="ptxt"></div>

    <input class="search" id="q" type="search" placeholder="搜尋：單字／假名／中文…">
  </div>
  <div class="filters" id="chips"></div>
  <div class="filters">
    <span style="font-size:13px;color:var(--sub)">自測：</span>
    <span class="chip mask" id="mzh">遮住中文</span>
    <span class="chip mask" id="mkana">遮住假名</span>
    <button class="resetbtn" id="reset">清除已熟紀錄</button>
  </div>
</header>
<main>
  <div id="secs"></div>
  <div class="empty" id="empty">沒有符合的單字</div>
</main>
<footer>
  說明：JLPT 自 2010 年起不公布官方單字表，本表為依舊制四級與歷屆考題整理的常見 N5 範圍單字。

</footer>

function splitMora(kana){const small='ゃゅょぁぃぅぇぉゎャュョァィゥェォヮ';const res=[];for(const ch of (kana||'').replace(/[～~\s]/g,'')){if(small.indexOf(ch)>=0&&res.length)res[res.length-1]+=ch;else res.push(ch);}return res;}
function pitchNotes(kana,cho){const m=splitMora(kana);const N=m.length;let a=parseInt(cho,10);if(!N||isNaN(a)||a<0)return '';if(a>N)a=N;const hi=i=>{if(a===0)return i!==1;if(a===1)return i===1;return i!==1&&i<=a;};let s='<span class="pa2">';for(let i=1;i<=N;i++){s+='<span class="pm"><span class="nb"><span class="note '+(hi(i)?'hi':'lo')+'">♪</span></span><span class="mk">'+esc(m[i-1])+'</span></span>';}return s+'</span>';}
/* 朗讀：VOICEVOX 預錄音檔優先，查無音檔才退回瀏覽器語音 */
let VV=null;
try{VV=JSON.parse(document.getElementById('vv-data').textContent);}catch(e){VV=null;}
const VV_SPEAKER='14';
/* 音檔外置（2026-09-11）：clip 是 audio/n5vocab/<id>.ogg 的獨立檔案 */
const VV_BASE='audio/n5vocab/';
/* vvNorm 必須與合成端一致，否則查不到 clip（靜默失敗） */
function vvNorm(t){return String(t??'').replace(/[～~〜［］\[\]]/g,'').replace(/\u3000/g,' ').trim();}
function vvClip(text){
  if(!VV||!VV.say)return null;
  const e=VV.say[vvNorm(text)];const id=e&&e[VV_SPEAKER];
  return id?VV_BASE+id+'.ogg':null;
}
let vvAudio=null;
let jvoice=null;
function pickVoice(){if(!('speechSynthesis' in window))return;const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith('ja'));jvoice=vs[0]||null;}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function ttsSpeak(text){if(!('speechSynthesis' in window)){alert('這個瀏覽器不支援語音朗讀，建議改用 Chrome、Edge 或 Safari。');return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(text||'').replace(/[～~〜]/g,''));u.lang='ja-JP';u.rate=0.95;if(jvoice)u.voice=jvoice;speechSynthesis.speak(u);}
function speak(text){
  const b64=vvClip(text);
  if(!b64){ttsSpeak(text);return;}
  if(vvAudio){vvAudio.pause();vvAudio=null;}
  vvAudio=new Audio(b64);
  vvAudio.play().catch(()=>ttsSpeak(text));
}

        html+='<tr data-id="'+esc(id)+'" data-hay="'+esc((r[0]+r[1]+r[3]).toLowerCase())+'"'+(dn?' class="done"':'')+'>'+
          '<td class="c-chk"><input type="checkbox"'+(dn?' checked':'')+'></td>'+
          '<td class="word" data-say="'+esc(r[1]||r[0])+'">'+esc(r[0])+'</td>'+
          '<td class="kana kcell" data-say="'+esc(r[1])+'">'+esc(r[1])+'</td>'+
          '<td class="panote">'+(r[2]===''?'':('<span style="color:var(--sub);font-size:12px;margin-right:5px">'+r[2]+'</span>'))+'</td>'+
          '<td class="mean zcell">'+esc(r[3])+'</td>'+
          '<td class="ex">'+(r[4]?'<span class="ejp" data-say="'+esc(r[4])+'">'+esc(r[4])+'</span><br><span class="ezh zcell2">'+esc(r[5]||'')+'</span>':'')+'</td></tr>';
      });
      html+='</tbody></table>';
    });
    html+='</section>';
  });
  secsEl.innerHTML=html;
}
/* chips */
const chipsEl=document.getElementById('chips');
function buildChips(){
  chipsEl.innerHTML=['全部',...GROUPS].map(g=>'<span class="chip'+(g===curG?' active':'')+'" data-g="'+esc(g)+'">'+esc(g)+'</span>').join('');
}
chipsEl.addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;curG=c.dataset.g;buildChips();applyFilter();});
/* filter */
const q=document.getElementById('q');
q.addEventListener('input',applyFilter);
function applyFilter(){
  const kw=q.value.trim().toLowerCase();let any=false;
  document.querySelectorAll('.sec').forEach(sec=>{
    const gOk=(curG==='全部'||sec.dataset.g===curG);
    let secShown=0;
    sec.querySelectorAll('tbody tr').forEach(tr=>{
      const ok=gOk&&(!kw||tr.dataset.hay.indexOf(kw)>=0);
      tr.style.display=ok?'':'none';if(ok)secShown++;
    });
    sec.querySelectorAll('table').forEach(tb=>{
      const vis=[...tb.querySelectorAll('tbody tr')].some(tr=>tr.style.display!=='none');
      tb.style.display=vis?'':'none';
      const sub=tb.previousElementSibling;
      if(sub&&sub.classList.contains('sub'))sub.style.display=vis?'':'none';
    });
    sec.style.display=secShown?'':'none';
    if(secShown)any=true;
  });
  document.getElementById('empty').style.display=any?'none':'block';
}
/* progress */
function updateProg(){
  const total=DATA.reduce((s,b)=>s+b.items.length,0);
  const n=doneSet.size;
  document.getElementById('fill').style.width=(total?100*n/total:0)+'%';
  document.getElementById('ptxt').textContent='已熟 '+n+' / '+total+' 字（'+(total?Math.round(100*n/total):0)+'%）';
}
/* mask */
function applyMask(){
  document.querySelectorAll('.zcell,.ezh').forEach(td=>{
    if(td.classList.contains('ezh')){td.style.visibility=maskZh?'hidden':'';return;}
    td.classList.toggle('masked',maskZh&&!td.dataset.peek);
  });
  document.querySelectorAll('.kcell').forEach(td=>td.classList.toggle('masked',maskKana&&!td.dataset.peek));
}
document.getElementById('mzh').addEventListener('click',function(){maskZh=!maskZh;this.classList.toggle('active',maskZh);clearPeek();applyMask();});
document.getElementById('mkana').addEventListener('click',function(){maskKana=!maskKana;this.classList.toggle('active',maskKana);clearPeek();applyMask();});
function clearPeek(){document.querySelectorAll('[data-peek]').forEach(el=>delete el.dataset.peek);}
/* clicks */
secsEl.addEventListener('click',e=>{
  const td=e.target.closest('td');if(!td)return;
  if(td.classList.contains('masked')){td.dataset.peek='1';td.classList.remove('masked');return;}
  const chk=e.target.closest('input[type=checkbox]');
  if(chk){
    const tr=td.closest('tr');const id=tr.dataset.id;
    if(chk.checked)doneSet.add(id);else doneSet.delete(id);
    tr.classList.toggle('done',chk.checked);
    store.set(JSON.stringify([...doneSet]));
    updateProg();return;
  }
  const sayEl=e.target.closest('[data-say]')||((td.dataset.say)?td:null);
  if(sayEl&&sayEl.dataset.say)speak(sayEl.dataset.say);
});
document.getElementById('reset').addEventListener('click',()=>{
  if(!confirm('確定要清除全部已熟紀錄嗎？'))return;
  doneSet.clear();store.set('[]');
  document.querySelectorAll('tr.done').forEach(tr=>{tr.classList.remove('done');const c=tr.querySelector('input');if(c)c.checked=false;});
  updateProg();
});
/* init */
build();buildChips();applyFilter();updateProg();
</script>
</body>
</html>
