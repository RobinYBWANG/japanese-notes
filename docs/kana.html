<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>五十音 — 日文學習</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  :root{
    --bg:#f4f6f8;--ink:#1f2933;--sub:#6b7580;--accent:#2e7d6b;--accent2:#c0392b;
    --line:#d8dee3;--head:#e8edf0;--sel:#ffe680;--jp:#1a3a5c;--stripe:#f9fafb;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei","Hiragino Sans",sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  #topbar{position:sticky;top:0;z-index:40;background:var(--bg);box-shadow:0 2px 6px rgba(0,0,0,.08)}
  header{background:#fff;border-bottom:1px solid var(--line);padding:10px 16px}
  .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  #zen{position:fixed;top:calc(var(--topbar-h,150px) + 8px);right:14px;z-index:80;width:34px;height:30px;border:1px solid var(--line);background:#fff;color:#3a4750;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 5px rgba(0,0,0,.14);transition:top .2s}
  #zen:hover{background:#eef4f9}
  body.zen #zen{background:#121417;color:#fff;border-color:#121417}
  body.zen #topbar{display:none}
  body.zen #zen{top:8px}
  #zen-save{position:fixed;top:8px;right:56px;z-index:80;width:34px;height:30px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:0 1px 5px rgba(0,0,0,.14);font-size:15px}
  body.zen #zen-save{display:flex}
  #zen-add{position:fixed;top:8px;right:98px;z-index:80;width:34px;height:30px;border:1px solid var(--line);background:#fff;color:#0a8a3c;border-radius:8px;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:0 1px 5px rgba(0,0,0,.14);font-size:22px;line-height:1;font-weight:700}
  body.zen #zen-add{display:flex}
  #zen-add:hover{background:#eef9f0}
  #zen-add:disabled{opacity:.4;cursor:not-allowed}
  #add,#save,#zen-add,#zen-save{display:none!important}
  #zen-save:hover{background:#eef4f9}
  #zen-save.need{background:#fff3e0;border-color:#f0c987}
  body.zen{padding-top:6px}
  h1{font-size:18px;margin:0;color:var(--accent);white-space:nowrap}
  .stat{font-size:12px;color:var(--sub);background:var(--head);padding:4px 10px;border-radius:12px}
  .search{flex:1;min-width:150px;padding:7px 12px;border:1px solid var(--line);border-radius:18px;font-size:14px;outline:none}
  .search:focus{border-color:var(--accent)}
  button{font-family:inherit;font-size:13px;cursor:pointer;border-radius:8px;padding:7px 12px;border:1px solid var(--line);background:#fff;transition:.15s;white-space:nowrap}
  button:hover{background:var(--head)}
  .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn-primary:hover{background:#26695a}
  .btn-danger{color:var(--accent2);border-color:#e6c3bd}
  .btn-danger:hover{background:#fbeceb}
  #save.need{background:#e67e22;border-color:#e67e22;color:#fff}
  #save.need:hover{background:#cf6f16}
  .wrap{padding:12px;overflow:visible}
  #bulkbar{display:none;align-items:center;gap:12px;background:#fff3e0;border:1px solid #f0c987;border-radius:10px;padding:8px 14px;margin:8px 12px 10px;font-size:13px}
  #bulkbar b{color:var(--accent2);font-size:15px}
  #bulkbar .grow{flex:1}
  #add:disabled{opacity:.5;cursor:not-allowed}
  table{border-collapse:collapse;background:#fff;table-layout:fixed;width:auto}
  th,td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left;overflow-wrap:break-word;word-break:break-word}
  th{background:var(--head);position:sticky;top:var(--topbar-h,132px);z-index:15;font-size:13px;color:#3a4750;white-space:nowrap}
  .resizer{position:absolute;top:0;right:-3px;width:8px;height:100%;cursor:col-resize;z-index:6;user-select:none}
  .resizer:hover,.resizer.active{background:var(--accent);opacity:.5}
  tbody tr:nth-child(even){background:var(--stripe)}
  tbody tr.sel{background:var(--sel)!important}
  tbody tr.sel td:first-child{box-shadow:inset 4px 0 0 var(--accent2)}
  td[contenteditable]{outline:none}
  td[contenteditable]:focus{background:#fffbe6;box-shadow:inset 0 0 0 2px #ffe08a}
  td.word{font-weight:700;font-size:15px}
  td.kana{color:#555;white-space:pre-line}
  td.cho{text-align:center;color:var(--accent2);font-weight:600}
  .panote{overflow-x:auto;white-space:nowrap}
  .pa2{display:inline-flex;align-items:flex-end}
  .pm{display:inline-block;text-align:center;margin:0 1px}
  .pm .nb{display:block;height:18px;position:relative;min-width:14px}
  .pm .note{position:absolute;left:0;right:0;font-size:13px;line-height:1}
  .pm .note.hi{top:0;color:var(--accent2)}
  .pm .note.lo{bottom:0;color:#1f2933}
  .pm .mk{display:block;font-size:12px;color:var(--jp);line-height:1.3}
  .col-chk{width:36px;text-align:center}
  .col-chk input{width:18px;height:18px;cursor:pointer;accent-color:var(--accent2)}
  .drag{text-align:center;color:#c2c8cd;cursor:grab;user-select:none;font-size:15px;line-height:1}
  .drag:hover{color:var(--accent)}
  tr.dragging{opacity:.4}
  tr.dropline td{box-shadow:inset 0 2px 0 var(--accent)}
  tr.dropline-b td{box-shadow:inset 0 -2px 0 var(--accent)}
  .spk-cell{text-align:center;padding:4px}
  .spk{border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 8px;font-size:16px;cursor:pointer;line-height:1;transition:.12s}
  .spk:hover{background:#e8f5ef;border-color:var(--accent)}
  .spk.playing{background:var(--accent);border-color:var(--accent);animation:pulse .8s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
  th small{font-weight:400;color:var(--sub);font-size:10px}
  .colh{cursor:grab}
  .colh[data-key="say"]{text-align:center}
  .colh[data-key="say"] .resizer{cursor:col-resize}
  .colh small{white-space:normal;display:inline-block;line-height:1.25}
  .colh.coldrag{opacity:.45}
  .colh.colover{box-shadow:inset 0 -3px 0 var(--accent2)}
  .empty{text-align:center;color:var(--sub);padding:30px}
  .hint{font-size:12px;color:var(--sub);margin-top:6px}
  .tabs{display:flex;gap:3px;overflow-x:auto;padding:10px 12px 0;background:var(--bg);border-bottom:1px solid var(--line)}
  .tab{padding:7px 15px;border:1px solid var(--line);border-bottom:none;border-radius:9px 9px 0 0;background:#e9eef1;color:var(--sub);cursor:pointer;white-space:nowrap;font-size:13px;font-weight:600;transition:.12s;text-align:center;line-height:1.35}
  .tab:hover{background:#dde4e8;color:#3a4750}
  .tab.active{background:#fff;color:var(--accent);border-color:var(--accent);position:relative;top:1px}
  .tab .cnt{font-weight:400;font-size:11px;color:#9aa4ac;margin-left:5px}
  .tab.active .cnt{color:var(--accent)}
  .tname{outline:none}
  .tname.editing{background:#fffbe6;box-shadow:0 0 0 2px #ffe08a inset;border-radius:4px;padding:0 3px;cursor:text}
  .subtabs{display:flex;gap:3px;padding:9px 14px 0;background:var(--bg)}
  .subtab{padding:6px 20px;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;background:#eceff2;color:var(--sub);cursor:pointer;font-size:13px;font-weight:600;transition:.12s}
  .subtab:hover{background:#e0e5e9;color:#3a4750}
  .subtab.active{background:#fff;color:var(--accent2);border-color:var(--accent2);position:relative;top:1px}
  .panel-empty{margin:12px;min-height:220px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--sub);font-size:14px;line-height:1.9;background:#fff;border:1px dashed var(--line);border-radius:12px}
  .pe-title{font-size:20px;color:var(--ink);margin-bottom:6px;font-weight:700}
  #panel-grammar{padding:14px}
  #panel-verb{padding:14px}
  #time-quiz{background:#f7f9fb;border:1px solid var(--line);border-radius:12px;padding:10px 12px 8px;margin:0 0 14px;display:flex;flex-direction:column;align-items:center}
  #time-quiz .nq-bar{justify-content:center}
  #time-quiz .aq-body{min-height:0;align-items:center;justify-content:center;gap:0;margin:0}
  #tq-q{font-size:24px;font-weight:700;color:#1f2933;text-align:center}
  .tq-lb{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:#3a4750;cursor:pointer;margin-right:14px}
  .tq-lb input{cursor:pointer;margin:0;width:16px;height:16px;accent-color:var(--accent2)}
  #tq-next,#tq-say{font-size:13px;padding:5px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer}
  #tq-say{background:var(--accent);color:#fff;border-color:var(--accent)}
  #time-quiz.nq-min{padding:2px 10px}
  #time-quiz.nq-min .nq-bar,#time-quiz.nq-min .aq-body{display:none}
  #time-quiz.nq-min .nq-mini-label{display:block}
  #time-quiz.nq-min .nq-collapse{transform:rotate(180deg)}
  .timewrap{display:flex;flex-wrap:wrap;gap:18px}
  .timecol h4{margin:0 0 6px;font-size:14px;color:var(--accent)}
  .cnttable tr.tok-hl td.kana{background:#fff3e0;color:#c0561a;font-weight:700}
  .conjtable{border-collapse:collapse;margin:8px 0}
  .conjtable th,.conjtable td{border:1px solid var(--line);padding:8px 14px;text-align:center;font-size:15px}
  .conjtable th{background:var(--head);font-weight:600;color:#3a4750}
  .conjlist{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:8px 0;max-width:560px}
  .conjrow{display:flex;align-items:stretch;border-top:1px solid var(--line)}
  .conjrow:first-child{border-top:0}
  .conjlabel{flex:0 0 100px;background:#f3efe6;color:#b23a2f;font-weight:700;padding:10px 14px;display:flex;align-items:center;font-size:14px}
  .conjval{padding:10px 14px;font-size:16px;color:#1f3a5f;display:flex;align-items:center;flex-wrap:wrap;gap:6px}
  .conjzh{color:#8a95a1;font-size:14px;font-weight:400}
  .vex{display:flex;gap:10px;align-items:flex-start;padding:10px 2px;border-bottom:1px dashed var(--line)}
  .vex-jp{font-weight:700;color:#1f3a5f;font-size:16px}
  .vex-zh{color:#8a95a1;font-size:14px;margin-top:2px}
  .ghint{font-size:12px;color:var(--sub);margin:0 auto 12px;max-width:900px}
  #grammar-body{outline:none;max-width:900px;margin:0 auto}
  #grammar-body:empty::before{content:'此頁可直接打字新增文法，或把內容交給我幫你排版。';color:var(--sub)}
  #grammar-body h3{color:var(--accent2);font-size:16px;margin:0 0 14px;border-bottom:2px solid var(--accent2);padding-bottom:6px}
  .gp{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent2);border-radius:8px;padding:12px 16px;margin:0 0 14px}
  .gp-label{font-weight:700;color:var(--accent2);font-size:15px;margin-bottom:6px}
  .gp-form{font-size:17px;color:var(--jp);font-weight:600;letter-spacing:.5px;margin-bottom:6px}
  .gp-note{font-size:13px;color:var(--sub);margin-bottom:6px}
  .gp-ex{font-size:15px;color:#333;background:#f7f9fa;border-radius:6px;padding:9px 11px;line-height:2.4}
  .gp-ex b{color:var(--accent2)}
  #panel-gram{padding:14px}
  #panel-gram .gram-wrap{max-width:900px;margin:0 auto}
  #panel-gram .gsec{margin:0 0 22px}
  #panel-gram .gsec h3{color:var(--accent2);font-size:16px;margin:0 0 4px;border-bottom:2px solid var(--accent2);padding-bottom:6px}
  #panel-gram .gdesc{font-size:13px;color:var(--sub);margin:6px 0 12px}
  #panel-num,#panel-counter,#panel-time{padding:14px}
  #panel-num{padding:0}
  .numtable,.cnttable{border-collapse:collapse;background:#fff;margin:0 auto;font-size:15px}
  .numtable td,.numtable th,.cnttable td,.cnttable th{border:1px solid var(--line);padding:7px 14px;vertical-align:middle}
  .numtable thead th,.cnttable thead th{background:var(--head);color:#3a4750;font-size:13px}
  .numtable td.num{font-weight:700;text-align:right;color:var(--accent2);white-space:nowrap}
  .cnttable td.num{font-weight:700;text-align:center;color:var(--accent2);white-space:nowrap}
  .numtable td.kana,.cnttable td.kana{color:#1f2933;cursor:pointer}
  .numtable td.kana:hover,.cnttable td.kana:hover{background:#fff7cc}
  .cnthead{display:flex;align-items:center;gap:10px;margin:0 auto 12px;max-width:560px}
  .cnthead select{padding:6px 10px;font-size:15px;border:1px solid var(--line);border-radius:8px;background:#fff}
  #cnt-body{overflow-x:auto}
  .agegrid{border-collapse:collapse;margin:0 auto;font-size:14px}
  .agegrid th,.agegrid td{border:1px solid var(--line);padding:5px 10px;text-align:center;white-space:nowrap}
  .agegrid thead th{background:var(--head);color:#3a4750;font-size:12px}
  .agegrid td.num{font-weight:700;color:var(--accent2)}
  .agegrid td.kana{cursor:pointer}
  .agegrid td.kana:hover{background:#fff7cc}
  .agegrid thead th,.cnttable thead th,.numtable thead th{position:static;top:auto;z-index:1}
  .agegrid td.ag-hl{background:#fff3e0;color:#c0561a;font-weight:700}
  .spk-c:hover{background:#f4f9ff}
  #tbody td{cursor:pointer}
  #tbody td.drag{cursor:grab}
  #tbody tr:not(.sel):hover td{background:#eef6ff}
  #tbody td.editing{cursor:text;background:#fffbe6;box-shadow:inset 0 0 0 2px #ffe08a;border-radius:3px}
  #tbody td.ed{white-space:pre-wrap;word-break:break-word}
  .colvis{display:inline-flex;align-items:center;gap:4px;cursor:pointer}
  .colvis-cb{cursor:pointer;vertical-align:middle}
  #tbody td.masked{position:relative;color:transparent!important;cursor:pointer;user-select:none}
  #tbody td.masked>*{visibility:hidden}
  #tbody td.masked::after{content:'•••••';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9aa5b1;background:repeating-linear-gradient(45deg,#f1f4f7,#f1f4f7 7px,#e7ecf1 7px,#e7ecf1 14px);letter-spacing:3px;font-size:13px}
  #tbody td.masked.revealed{color:inherit!important}
  #tbody td.masked.revealed>*{visibility:visible}
  #tbody td.masked.revealed::after{display:none}
  #all-tbody td.spk-c{cursor:pointer}
  #all-tbody td.spk-c:hover{background:#fff7cc}
  #all-quiz,#voc-quiz,#verb-quiz{position:sticky;top:var(--topbar-h,132px);z-index:17;background:#f7f9fb;border:1px solid var(--line);border-top:0;border-radius:0;padding:10px 12px 8px;margin:0;box-shadow:0 4px 8px rgba(0,0,0,.08);display:flex;flex-direction:column}
  #verb-quiz{margin-bottom:12px}
  .aq-modes,.aq-body{max-width:900px}
  .aq-modes{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px;padding-right:54px}
  .aq-mode{font-size:13px;padding:4px 11px;border:1px solid var(--line);background:#fff;border-radius:16px;cursor:pointer}
  .aq-mode.on{background:var(--accent2);color:#fff;border-color:var(--accent2)}
  #aq-next,#vq-next,#aq-restart,#vq-restart{font-size:13px;padding:4px 11px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;margin-left:6px}
  .aq-count{margin-left:auto;font-size:13px;color:var(--sub);align-self:center;white-space:nowrap;font-weight:600}
  .aq-body{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .aq-q{font-size:20px;font-weight:700;color:#1f2933;min-width:110px}
  .aq-a{flex:1;min-width:160px;min-height:38px;display:flex;align-items:center;justify-content:center;font-size:18px;border-radius:8px;cursor:pointer;padding:6px 10px;user-select:none}
  .aq-a.masked{background:repeating-linear-gradient(45deg,#eef2f5,#eef2f5 7px,#e3e9ee 7px,#e3e9ee 14px);color:#8a95a1;font-size:14px}
  .aq-a.masked::before{content:'••••• 點一下看答案'}
  .aq-a.shown{background:#fffbe6;color:#1f2933}
  .aq-collapse{align-self:center;order:9;margin-top:2px;width:28px;height:9px;border:1px solid var(--line);background:#fff;border-radius:5px;cursor:pointer;font-size:6px;line-height:1;color:#9aa5b1;display:flex;align-items:center;justify-content:center;transition:transform .15s}
  .aq-collapse:hover{background:#eef4f9}
  .aq-mini-label{display:none;font-size:13px;color:#5a6b7a;font-weight:600;text-align:center;width:100%}
  .aq-min{padding:0 10px 2px}
  .aq-min .aq-modes,.aq-min .aq-body{display:none}
  .aq-min .aq-collapse{transform:rotate(180deg)}
  .aq-play{font-size:15px;padding:6px 14px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer}
  #num-quiz{background:#f7f9fb;border:1px solid var(--line);border-radius:12px;padding:10px 12px 8px;margin:0 0 14px;display:flex;flex-direction:column;align-items:center}
  .nq-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:7px;margin-bottom:4px;font-size:13px;color:#5a6b7a}
  #num-quiz .aq-body{min-height:0;align-items:center;justify-content:center;gap:0;margin:0}
  #num-quiz #nq-q{min-width:0;line-height:1.2}
  .nq-bar input[type=number]{width:74px;padding:5px 7px;border:1px solid var(--line);border-radius:8px;font-size:14px;text-align:right}
  #nq-next,#nq-say{font-size:13px;padding:5px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer}
  #nq-say{background:var(--accent);color:#fff;border-color:var(--accent)}
  #nq-q{font-size:20px;font-weight:700;letter-spacing:1px;color:#1f2933}
  .nq-collapse{align-self:center;order:9;margin-top:6px;width:28px;height:9px;border:1px solid var(--line);background:#fff;border-radius:5px;cursor:pointer;font-size:6px;line-height:1;color:#9aa5b1;display:flex;align-items:center;justify-content:center;transition:transform .15s}
  .nq-collapse:hover{background:#eef4f9}
  .nq-mini-label{display:none;font-size:13px;color:#5a6b7a;font-weight:600;text-align:center;width:100%}
  #num-quiz.nq-min{padding:2px 10px}
  #num-quiz.nq-min .nq-bar,#num-quiz.nq-min .aq-body{display:none}
  #num-quiz.nq-min .nq-mini-label{display:block}
  #num-quiz.nq-min .nq-collapse{transform:rotate(180deg)}
  .aq-play:hover{background:#eef4f9}
  .alltable thead th{top:calc(var(--topbar-h,132px) + var(--allquiz-h,0px));z-index:16;background:var(--head)}
  #thd th{top:calc(var(--topbar-h,132px) + var(--vocquiz-h,0px));z-index:16;background:var(--head)}
  #cnt-extra{max-width:640px;margin:20px auto 0}
  .gp-form u,.gp-ex u{text-decoration-color:var(--accent2)}
  #grammar-body ruby rt{font-size:10px;color:var(--sub);font-weight:400}
  .gspk{font-size:12px;padding:1px 6px;margin:0 5px;vertical-align:middle;line-height:1.4}
  #panel-quiz{padding:14px;max-width:820px;margin:0 auto}
  .qtop{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .qscore{font-size:15px;font-weight:700;color:var(--accent)}
  .qcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
  .qhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--sub);font-size:13px}
  .qtag{font-size:11px;background:#fdecea;color:var(--accent2);border-radius:10px;padding:1px 8px}
  .qtag.v{background:#e8f5ef;color:var(--accent)}
  .qprompt{font-size:16px;color:var(--jp);font-weight:600;margin-bottom:10px}
  .qopts{display:flex;flex-direction:column;gap:6px}
  .qopt{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:15px}
  .qopt:hover{background:var(--head)}
  .qopt.ok{background:#e7f6ec;border-color:#8bd3a3}
  .qopt.ng{background:#fbeaea;border-color:#e6a6a0}
  .qfb{margin-top:8px;font-size:13px;display:none}
  .qfb.good{display:block;color:var(--accent)}
  .qfb.bad{display:block;color:var(--accent2)}
  .qempty{color:var(--sub);text-align:center;padding:30px}

<script>

const __VV=JSON.parse(document.getElementById('vv-data').textContent);

/* 音檔外置（2026-09-11）：clip 是 audio/kana/<id>.ogg 的獨立檔案；VV_AUDIO 只記「有這個 id」 */
const VV_BASE='audio/kana/';const VV_AUDIO={};for(const t in VV_SAY)for(const v in VV_SAY[t])VV_AUDIO[VV_SAY[t][v]]=true;
const VV_VOICES=[["2", "Chloe — 快樂學生，女"], ["13", "Uncle Ben — 大叔，男"], ["11", "Darren — 聽起來是帥哥，男"]];
const VV_IDS=VV_VOICES.map(v=>v[0]);
let ttsCfg={rate:0.9,pitch:1,voiceA:'2',voiceB:'11'};
try{const o=JSON.parse(localStorage.getItem('jp_tts_vv')||'{}');if(o.voice&&!o.voiceA)o.voiceA=o.voice;ttsCfg=Object.assign(ttsCfg,o);}catch(e){}
function saveTts(){localStorage.setItem('jp_tts_vv',JSON.stringify(ttsCfg));}
const VV_PLAYER=new Audio();let VV_BTN=null;
let quiz=[],quizPrefix='',quizEmptyMsg='',kanaScope=null;

function esc(s){return (s==null?'':String(s));}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function vvNorm(t){return String(t||'').replace(/[～~［］\[\]]/g,'').replace(/　/g,' ').trim();}
function vvClip(text,which){const m=VV_SAY[vvNorm(text)];return m?m[voiceFor(which)]:null;}
function vvMark(btn){if(VV_BTN)VV_BTN.classList.remove('playing');VV_BTN=btn||null;if(VV_BTN)VV_BTN.classList.add('playing');}
function vvPlay(id,rate,btn,onend){VV_PLAYER.onended=()=>{vvMark(null);if(onend)onend(true);};VV_PLAYER.onerror=()=>{vvMark(null);if(onend)onend(false);};VV_PLAYER.src=VV_BASE+id+'.ogg';VV_PLAYER.playbackRate=rate||1;vvMark(btn);VV_PLAYER.play().catch(()=>{vvMark(null);if(onend)onend(false);});}
function vvStop(){VV_PLAYER.onended=null;VV_PLAYER.pause();try{VV_PLAYER.currentTime=0;}catch(e){}vvMark(null);}
function voiceFor(which){const want=which==='B'?ttsCfg.voiceB:ttsCfg.voiceA;return VV_IDS.includes(String(want))?String(want):(which==='B'?'11':'2');}
function speakWith(text,which,btn){text=(text||'').replace(/[～~]/g,'').trim();if(!text)return;
  const id=vvClip(text,which);
  if(id&&VV_AUDIO[id]){if('speechSynthesis' in window)speechSynthesis.cancel();vvStop();vvPlay(id,+ttsCfg.rate||0.9,btn);return;}
  if(!('speechSynthesis' in window)){alert('這個瀏覽器不支援語音朗讀，建議改用 Chrome、Edge 或 Safari。');return;}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=+ttsCfg.rate||0.9;u.pitch=+ttsCfg.pitch||1;
  if(btn){u.onstart=()=>btn.classList.add('playing');u.onend=u.onerror=()=>btn.classList.remove('playing');}
  speechSynthesis.speak(u);}
function speak(text,btn){speakWith(text,'A',btn);}
function loadKanaScope(){if(kanaScope)return;try{kanaScope=JSON.parse(localStorage.getItem('jp_kanascope'));}catch(e){}if(!kanaScope||typeof kanaScope!=='object')kanaScope={grp:{'清音':true,'濁音':false,'半濁音':false,'拗音':false},script:'both'};}
function saveKanaScope(){localStorage.setItem('jp_kanascope',JSON.stringify(kanaScope));}
function kanaPool(){return (workbook.lessons['0']||[]).filter(r=>kanaScope.grp[r.grp||'清音']&&r.roma&&(r.hira||r.kata));}
function scopeBarHTML(){
  const g=['清音','濁音','半濁音','拗音'].map(k=>'<label class="ksc-g"><input type="checkbox" class="ksc" data-kind="grp" data-key="'+k+'" '+(kanaScope.grp[k]?'checked':'')+'>'+k+'</label>').join('');
  const sc=[['hira','平假名'],['kata','片假名'],['both','兩者']].map(a=>'<label class="ksc-g"><input type="radio" name="kscript" class="ksc" data-kind="script" data-key="'+a[0]+'" '+(kanaScope.script===a[0]?'checked':'')+'>'+a[1]+'</label>').join('');
  return '<div class="ksbar"><span class="ksb-t">範圍</span>'+g+'<span class="ksb-sep"></span>'+sc+'</div>';
}
function dispKana(r,which){return which==='kata'?(r.kata||r.hira):(r.hira||r.kata);}
function kanaDistractors(pool,r,key,n){const seen=new Set([key(r)]);const out=[];for(const x of shuffle(pool.slice())){if(x===r)continue;const v=key(x);if(v&&!seen.has(v)){seen.add(v);out.push(x);}if(out.length>=n)break;}return out;}
function makeKanaQ(r,pool){
  const scr=kanaScope.script==='both'?(Math.random()<0.5?'hira':'kata'):kanaScope.script;
  const t=['read','listen','pair','input'][Math.floor(Math.random()*4)];
  if(t==='read'){const ds=kanaDistractors(pool,r,x=>x.roma,3);const opts=shuffle([r,...ds].map(x=>x.roma));return {tag:'讀音',prompt:'「'+dispKana(r,scr)+'」的讀音是？',opts,ans:opts.indexOf(r.roma),exp:dispKana(r,scr)+' ＝ '+r.roma};}
  if(t==='listen'){const ds=kanaDistractors(pool,r,x=>dispKana(x,scr),3);const opts=shuffle([r,...ds].map(x=>dispKana(x,scr)));return {tag:'聽力',prompt:'🔊 聽發音，選出正確的假名：',say:(r.hira||r.kata),opts,ans:opts.indexOf(dispKana(r,scr)),exp:'答案：'+dispKana(r,scr)+'（'+r.roma+'）'};}
  if(t==='pair'){const h2k=Math.random()<0.5;const from=h2k?(r.hira||r.kata):(r.kata||r.hira);const key=h2k?(x=>x.kata||x.hira):(x=>x.hira||x.kata);const ds=kanaDistractors(pool,r,key,3);const opts=shuffle([r,...ds].map(key));return {tag:'平↔片',prompt:'「'+from+'」的'+(h2k?'片假名':'平假名')+'是？',opts,ans:opts.indexOf(key(r)),exp:from+' ＝ '+key(r)+'（'+r.roma+'）'};}

function buildKanaQuiz(){

  const rs=shuffle(pool.slice());const qs=[];for(let i=0;i<10;i++)qs.push(makeKanaQ(rs[i%rs.length],pool));

function renderQuiz(){

    const say=q.say?` <button class="spk gspk" data-say="${q.say}" title="播放發音">🔊</button>`:'';

    if(q.input){inner='<input class="qinput" data-qi="'+i+'" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="輸入羅馬字，例如 ka">';}
    else{inner='<div class="qopts">'+q.opts.map((o,j)=>`<label class="qopt"><input type="radio" name="q${i}" value="${j}"><span>${o}</span></label>`).join('')+'</div>';}
    return `<div class="qcard" data-qi="${i}"><div class="qhead"><span class="qnum">Q${i+1}</span><span class="qtag${q.grammar?'':' v'}">${q.tag||'語彙'}</span></div><div class="qprompt">${q.prompt}${say}</div>${inner}<div class="qfb"></div></div>`;
  }).join('');

    const card=document.querySelector('.qcard[data-qi="'+i+'"]');const fb=card.querySelector('.qfb');

      const inp=card.querySelector('.qinput');const val=(inp?inp.value:'').trim().toLowerCase().replace(/\s+/g,'');
      const ok=val===String(q.answer||'').toLowerCase();
      if(inp){inp.classList.remove('ok','ng');inp.classList.add(ok?'ok':'ng');}
      if(ok){correct++;fb.className='qfb good';fb.textContent='✅ 正確';}
      else{fb.className='qfb bad';fb.textContent='❌ '+(val?('答錯：'+val):'未作答')+'　·　'+q.exp;}
    }else{
      const sel=card.querySelector('input[name=q'+i+']:checked');const chosen=sel?+sel.value:-1;
      card.querySelectorAll('.qopt').forEach((el,j)=>{el.classList.remove('ok','ng');if(j===q.ans)el.classList.add('ok');if(j===chosen&&chosen!==q.ans)el.classList.add('ng');});
      if(chosen===q.ans){correct++;fb.className='qfb good';fb.textContent='✅ 正確';}
      else{fb.className='qfb bad';fb.textContent='❌ '+(chosen===-1?'未作答':'答錯')+'　·　'+q.exp;}
    }
  });
  document.getElementById('qscore').textContent='得分：'+correct+' / '+quiz.length;
}

function renderGojuon(){
  const tb=document.getElementById('gj-tbody');const rs=workbook.lessons['0']||[];
  let prev=null,html='';
  rs.forEach((r,i)=>{
    const g=r.grp||'清音';
    if(g!==prev){html+=`<tr class="gj-sec"><td colspan="5">${g}</td></tr>`;prev=g;}
    html+=`<tr data-i="${i}">`+
      `<td class="gj-kana spk-c" data-f="hira">${esc(r.hira)}</td>`+
      `<td data-f="roma">${esc(r.roma)}</td>`+
      `<td class="spk-c" data-f="hiraex">${esc(r.hiraex)}</td>`+
      `<td class="gj-kana spk-c" data-f="kata">${esc(r.kata)}</td>`+
      `<td class="spk-c" data-f="kataex">${esc(r.kataex)}</td>`+
    `</tr>`;
  });
  tb.innerHTML=html;
}

/* ===== 分頁 ===== */
let section='gojuon';
function applySection(){
  document.getElementById('panel-gojuon').style.display=section==='gojuon'?'':'none';
  document.getElementById('panel-quiz').style.display=section==='quiz'?'':'none';
  document.querySelectorAll('#tabs .tab').forEach(t=>t.classList.toggle('active',t.dataset.sec===section));
  if(section==='gojuon')renderGojuon();
  if(section==='quiz'&&!quiz.length)buildKanaQuiz();
}
document.getElementById('tabs').addEventListener('click',e=>{
  const t=e.target.closest('.tab');if(!t)return;section=t.dataset.sec;applySection();
});

/* ===== 發音：表格格子、題目的 🔊 ===== */
document.getElementById('panel-gojuon').addEventListener('click',e=>{
  const td=e.target.closest('td[data-f]');if(!td)return;
  const fld=td.dataset.f;if(fld==='roma')return;
  const tr=td.closest('tr');if(!tr||tr.dataset.i===undefined)return;
  const r=KANA[+tr.dataset.i];if(!r)return;
  const t=fld==='hira'?r.hira:fld==='kata'?r.kata:((fld==='kataex'?r.kataex:r.hiraex)||'').split('（')[0].trim();
  if(t)speak(t,td);
});
document.addEventListener('click',e=>{
  const b=e.target.closest('.spk');if(!b)return;
  speak(b.getAttribute('data-say')||b.textContent,b);
});

/* ===== 測驗的按鈕與範圍列 ===== */
document.getElementById('newquiz').addEventListener('click',buildKanaQuiz);
document.getElementById('submitquiz').addEventListener('click',submitQuiz);
document.getElementById('quizbody').addEventListener('change',e=>{
  const el=e.target.closest('.ksc');if(!el)return;
  if(el.dataset.kind==='grp')kanaScope.grp[el.dataset.key]=el.checked;
  else if(el.dataset.kind==='script')kanaScope.script=el.dataset.key;
  saveKanaScope();buildKanaQuiz();
});

/* ===== 語音選單 ===== */
(function(){
  const vs=document.getElementById('voicesel'),rs=document.getElementById('ratesel');
  VV_VOICES.forEach(([id,label])=>{const o=document.createElement('option');o.value=id;o.textContent=label;vs.appendChild(o);});
  if(!VV_IDS.includes(String(ttsCfg.voiceA)))ttsCfg.voiceA='2';
  vs.value=String(ttsCfg.voiceA);
  vs.addEventListener('change',()=>{ttsCfg.voiceA=vs.value;saveTts();});
  rs.value=String(+ttsCfg.rate||0.9);
  rs.addEventListener('change',()=>{ttsCfg.rate=+rs.value;saveTts();});
})();

document.getElementById('stat').textContent='共 '+KANA.length+' 個假名　·　'+Object.keys(VV_AUDIO).length+' 個預錄音檔';
applySection();
